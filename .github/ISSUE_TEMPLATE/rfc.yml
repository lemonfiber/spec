# The area options are written by scripts/gen_rfc_areas.py from the catalogue's
# page; edit the page's headings, not the list.
name: RFC — propose a spec change
description: Propose a new or changed requirement without touching a file. A maintainer turns it into a proposal pull request, where it is discussed and decided.
title: "RFC: "
labels: ["rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a change — no git needed. A maintainer turns this issue
        into a proposal pull request under `10-functional/proposals/`, crediting you,
        and the proposal is discussed and decided there. Identifiers are allocated
        only if it is approved. You can also open the pull request yourself, adding
        the file as `10-functional/proposals/README.md` describes.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which feature area does this belong to?
      options:
        - "A — Getting started"
        - "B — Running it"
        - "C — Trust & correctness"
        - "D — Content & household"
        - "E — Maintenance"
        - "F — Extensibility"
        - "G — Cross-cutting UX"
        - "H — Ecosystem glue"
        - "I — Remote access & identity"
        - "J — Runtime & platform"
        - "K — Observability"
        - "L — Release & distribution"
        - "N — Companion"
    validations:
      required: true
  - type: input
    id: proposal-title
    attributes:
      label: Proposal title
      description: A short noun phrase naming the capability.
      placeholder: e.g. Scheduled library scans
    validations:
      required: true
  - type: textarea
    id: the-problem
    attributes:
      label: The problem
      description: What doesn't work today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposed-behaviour
    attributes:
      label: Proposed behaviour
      description: What should the product do? Write it as one or more testable statements (MUST / SHOULD / MAY).
    validations:
      required: true
  - type: textarea
    id: rationale-alternatives
    attributes:
      label: Rationale & alternatives
      description: Why this, and what did you consider instead?
    validations:
      required: false
