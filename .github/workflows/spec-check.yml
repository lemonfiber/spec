# Reusable governance gate. Every implementation repo calls this:
#
#   jobs:
#     spec-check:
#       uses: lemonfiber/spec/.github/workflows/spec-check.yml@main
#
# Defined once here so the rule has exactly one implementation and cannot drift
# between repos. See spec 50-governance/cross-repo-ci.md.
#
# `workflow_call` only. This repo is the source of citations rather than a
# consumer of them, and a spec PR introducing a requirement cannot cite an
# identifier that exists on main only once that PR has merged. Citations here are
# checked by integrity.py, which resolves them against the tree under review.
#
# Two events reach it, because a caller behind a merge queue has to call it from
# both. A pull request carries a body, an author and a commit range. A merge
# group carries a range and nothing else, and the steps below name which of the
# two they are reading rather than letting an absent field decide for them — a
# null read as a value is how this gate came to exit 1 on a base that was simply
# not there.
name: spec-check

on:
  workflow_call:

permissions:
  contents: read
  # Closing is the documented failure (50-governance/cross-repo-ci.md), so the
  # caller must grant this. A caller that does not still gets the refusal — the
  # check fails either way, and the step below says plainly that it could not
  # close rather than passing over it.
  pull-requests: write

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repo (the pull request, or the queue's branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit range below needs both ends present. Checkout clones to
          # depth 1 by default, which leaves the base commit out of the clone
          # and makes `git log base..head` fail.
          fetch-depth: 0

      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical

      - name: Gather the text this event carries
        # All untrusted event data is passed via env, never interpolated into
        # the shell — see the workflow-injection guidance. base/head are SHAs.
        #
        # The range is named per event rather than inferred from whichever field
        # happens to hold something. Both are read because only one of them
        # exists at a time: `github.event.pull_request` is null on a merge group
        # and `github.event.merge_group` is null on a pull request.
        #
        # A merge group's range is `main`'s tip to the queue's branch, so it is
        # every commit in the batch — which is the whole of what that event has
        # to offer. Its body is not absent because nobody wrote one; there is no
        # pull request for one to belong to, and the step below says so.
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          {
            # Only a pull request has one, and `printf` on an empty variable
            # would put a blank line at the top of the text either way — this is
            # about saying which event was read, not about the byte.
            if [ "$EVENT" = "pull_request" ]; then
              printf '%s\n' "$PR_BODY"
            fi
            if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
               && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              # A failure here must be loud. Swallowed, it leaves the body as the
              # only text searched, and the gate then reports a missing citation
              # for a pull request whose commits carry one.
              git log --format='%B' "${BASE_SHA}..${HEAD_SHA}" \
                || { echo "::error::Could not read commit messages for ${BASE_SHA}..${HEAD_SHA}. Nothing else was searched: on a merge group the commits are the only text there is, and on a pull request the body alone is not the rule." >&2; exit 1; }
            else
              echo "::error::base or head is not a commit SHA on a ${EVENT} event, so no commit message was read." >&2
              exit 1
            fi
          } > .pr-text.txt

      - name: Gather what this change writes into a file
        # The other half of GOV-R3. An identifier in a comment, a test's title
        # or a refusal message is a citation to whoever follows it, and until
        # this step existed it was resolved against nothing.
        #
        # The same two SHAs, re-read from the payload rather than carried over,
        # for the reason the step above names them per event: only one of the
        # two fields exists at a time and a null read as a value is how this
        # gate once exited 1 on a base that was simply not there.
        #
        # Two dots, and only added lines are read downstream, so a branch behind
        # the default one shows main's work as removals and is not answerable
        # for it.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
             && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            # Loud, like the log above it. A diff that silently came out empty
            # turns this half of the rule off in every repo, and nothing on the
            # green tick would say so.
            git diff --no-color "${BASE_SHA}" "${HEAD_SHA}" > .pr-diff.txt \
              || { echo "::error::Could not read the diff for ${BASE_SHA}..${HEAD_SHA}. Identifiers written into files were not checked, and a pass here would have said they were." >&2; exit 1; }
          else
            echo "::error::base or head is not a commit SHA on a ${EVENT} event, so no diff was read." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify citation
        id: citation
        # `pull_request.user.login` is GitHub's record of who opened this, not
        # anything the pull request carries. It is what lets Dependabot — which
        # cannot write a `Spec:` trailer — be cited for; see spec_check.py.
        #
        # The exit status decides what happens next, so it is captured rather
        # than allowed to end the job: 1 is the contributor's to fix and closes
        # the pull request, 2 is ours — a spec checkout that did not arrive, or
        # one holding no identifiers — and must never close somebody's work for
        # a fault on this side.
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e

          # `--citation-optional` on a merge group, and only there.
          #
          # GOV-R2 allows the citation to live in the pull request body, and the
          # Dependabot allowance keys on the author GitHub records for the pull
          # request. A merge group has neither, so requiring a trailer of the
          # commits alone would refuse a batch for carrying its citation exactly
          # where the rule permits it, and would refuse every dependency update
          # outright. GOV-R3 is untouched: whatever the batch cites is still
          # resolved, which is the half a queue can change while a pull request
          # waits in it.
          #
          # Keyed on the event, which comes from GitHub's payload rather than
          # from anything a contributor writes. See `spec_check.py` for what
          # widening that would cost.
          optional=()
          if [ "$EVENT" = "merge_group" ]; then
            optional+=(--citation-optional)
          fi

          python3 .spec-canonical/scripts/spec_check.py \
            --spec-dir .spec-canonical \
            --text-file .pr-text.txt \
            --diff-file .pr-diff.txt \
            --pr-author "$PR_AUTHOR" \
            "${optional[@]}" 2>&1 | tee .citation-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "status=${status}"
            echo "reason<<REASON"
            grep -F '::error::' .citation-output.txt | sed 's/^::error:://' || true
            echo "REASON"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Close the pull request, naming what it cited
        # There has to be one. A merge group reaches `status == 1` only through
        # GOV-R3 — an identifier that no longer resolves — and the thing at
        # fault there is a batch the queue built, not a pull request somebody
        # opened. Closing one of the pull requests in it would pick a victim.
        # The refusal below still stands, the batch is still rejected, and the
        # authors go back to a pull request that is open.
        if: steps.citation.outputs.status == '1' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.citation.outputs.reason }}
        run: |
          printf '%s\n\n%s\n' \
            "**\`spec-check\` closed this.** ${REASON}" \
            "This is sequencing, not rejection. Add a \`Spec:\` trailer naming an identifier that already exists on \`spec@main\` — to a commit or to the pull request body, on its own line, e.g. \`Spec: OPS-R1\`. Routine maintenance cites \`GOV-R12\`. Changing behaviour? Merge the spec change first, then cite the new identifier. Reopen when it is ready; nothing here is lost." \
            > .close-comment.md

          # Closing needs a token that may write, and a pull request opened from
          # a fork is handed a read-only one whatever this file declares. That is
          # not a reason to pass: the refusal below stands either way, and saying
          # which happened is the difference between a contributor who knows to
          # reopen and one who wonders why nothing moved.
          if gh pr comment "$NUMBER" --repo "$REPO" --body-file .close-comment.md \
             && gh pr close "$NUMBER" --repo "$REPO"; then
            echo "::notice::Closed #${NUMBER}. ${REASON}"
          else
            echo "::warning::Could not close #${NUMBER} — the token cannot write to pull requests here, which is what a fork is given. The refusal below still stands."
          fi

      - name: The citation decides whether this may merge
        if: steps.citation.outputs.status != '0'
        env:
          STATUS: ${{ steps.citation.outputs.status }}
          REASON: ${{ steps.citation.outputs.reason }}
        run: |
          if [ "$STATUS" = "2" ]; then
            echo "::error::spec-check could not run: ${REASON}. Nothing was closed — this is a fault on the gate's side, not the pull request's." >&2
          else
            echo "::error::${REASON}" >&2
          fi
          exit 1

      # A step absent from a log reads the same as a step that ran and found
      # nothing, so the narrower question a merge group was asked appears under
      # its own name carrying its reason — the shape `sonar.yml` uses for the
      # scan it skips, for the same reason.
      - name: What a merge group was, and was not, asked
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          said="This ran on a merge group, which carries no pull request: no body to read a citation from and no author to cite on behalf of. So GOV-R2 — that a citation is present — was not re-asked here. It was asked of every pull request in this batch before the queue accepted it, and a merge group does not rewrite a commit message. What did run is GOV-R3: every identifier the batch's commits cite was resolved against spec@main as it stands now, which is the one answer that can have changed while a pull request waited in the queue."
          echo "::notice::${said}"
          printf '### spec-check on a merge group\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

      # Only the implementation repo keeps a tracker; every other caller skips this.
      - name: The tracker claims only what the spec backs
        run: |
          if [ -f IMPLEMENTATION-STATUS.md ]; then
            python3 .spec-canonical/scripts/status_lint.py \
              --status IMPLEMENTATION-STATUS.md \
              --spec .spec-canonical
          else
            echo "no IMPLEMENTATION-STATUS.md here — nothing to check"
          fi
