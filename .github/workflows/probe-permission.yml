name: probe-permission
on: pull_request
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "maintainer: $(gh api repos/lemonfiber/spec/collaborators/lessevv/permission --jq '.role_name + " " + .permission' 2>&1)"
          echo "stranger: $(gh api repos/lemonfiber/spec/collaborators/octocat/permission --jq '.role_name + " " + .permission' 2>&1)"
          echo "bot: $(gh api 'repos/lemonfiber/spec/collaborators/dependabot%5Bbot%5D/permission' --jq '.role_name + " " + .permission' 2>&1)"
