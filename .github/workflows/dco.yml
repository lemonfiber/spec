# Reusable DCO sign-off check. Every commit needs a Signed-off-by matching its
# author (GOV-R30). Repos call it; the spec repo self-triggers on PRs.
name: dco
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
             && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            python3 .spec-canonical/scripts/dco_check.py "$BASE_SHA" "$HEAD_SHA"
          else
            echo "no PR range; skipping"
          fi
