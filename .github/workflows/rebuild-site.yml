# Tell the website the board snapshot changed (REPO-R44).
#
# The site is a static build, and everything it renders about the organisation
# is read from the snapshot `state.yml` publishes: the board, the trackers, the
# releases, and the commit of this repository its specification pages render.
# `state.yml` calls this when it publishes a snapshot whose content changed; a
# rebuild at any other moment would render the snapshot already published.
name: rebuild-site

on:
  workflow_call:
    inputs:
      because:
        description: "What changed, for the website run's log."
        required: false
        type: string
        default: "a sibling repository changed"
      site:
        description: "The repository to rebuild. Named, so a second site calls this rather than copying it."
        required: false
        type: string
        default: website-lemonfiber.app
    secrets:
      RELEASE_APP_KEY:
        description: "Private key of the release App, which is what may reach the website."
        required: true

permissions:
  contents: read

jobs:
  tell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Allowed to fail, for the reason the dispatch below is. This step is the
      # one that broke: a caller pinned a revision naming the site by its old
      # name, App-token minting does not follow a rename redirect, and the 404
      # reddened every merge into the calling repository for weeks. The notice
      # is worth less than the signal it was drowning.
      - name: Mint a token that can reach the website
        id: token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          repositories: ${{ inputs.site }}

      - name: Ask for a rebuild
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          BECAUSE: ${{ inputs.because }}
          FROM: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail
          # A failure here must not fail the merge that triggered it: the site
          # being a few hours stale is a smaller problem than a red main, and the
          # daily schedule is the backstop either way.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::No token to reach ${OWNER}/${SITE} with — is the App installed there, and is that the repository's current name? The daily schedule will catch it."
            exit 0
          fi
          if gh api -X POST "repos/${OWNER}/${SITE}/dispatches" \
            -f event_type=rebuild-site \
            -F "client_payload[from]=${FROM}" \
            -F "client_payload[sha]=${SHA}" \
            -F "client_payload[because]=${BECAUSE}"; then
            echo "::notice title=Site::Asked the website to rebuild — ${BECAUSE}."
          else
            echo "::warning::Could not ask the website to rebuild; the daily schedule will catch it."
          fi
