name: commitlint
on:
  workflow_call:
  pull_request:
  # A merge queue's own event, for the spec repo's self-run. A caller that sits
  # behind a queue calls this from `merge_group` too, and what the step below
  # does there is the same for both.
  merge_group:
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Lint commit subjects
        # The range is named per event, because only one of the two exists at a
        # time: `github.event.pull_request` is null on a merge group, and
        # `github.event.merge_group` is null on a pull request. A merge group's
        # range is `main`'s tip to the batch the queue built on it — one commit
        # per queued pull request, each the squash that will land — so this is
        # asked of exactly what `main` is about to hold.
        #
        # A merge group always has a range. One that arrives without both ends
        # fails rather than skipping: a skipped check reports success, and a
        # queue reads success as leave to merge a batch nothing read. On any
        # other event there is no pull request to hold to this, and the run says
        # so in its log.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
             && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            python3 .spec-canonical/scripts/commit_lint.py "$BASE_SHA" "$HEAD_SHA"
          elif [ "$EVENT" = "merge_group" ]; then
            echo "::error::A merge group arrived without a base..head range (base '${BASE_SHA}', head '${HEAD_SHA}'), so the batch was not read. Refusing rather than passing over nothing."
            exit 1
          else
            echo "no PR range; skipping"
          fi
