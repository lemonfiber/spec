# The bump nobody had to open, opened — OPS-R48.
#
# `workflow-pins` tells fourteen repositories their pin is behind. Until now it
# told them and nothing else happened: the remedy was a pull request somebody
# wrote by hand, in every repository, every time a workflow here moved. That is
# the admission `cross-repo-ci.md` makes about why the gate is not required
# everywhere — a gate whose remedy nothing automates, made required, blocks its
# own cure.
#
# On 2026-09-22 one line of `scorecard.yml` moved and nine of the ten
# repositories pinning it went red at once. Each needed the same one-line change
# and nothing was going to write it. That is this.
#
# **It runs after the tag, not after the merge.** The comment beside a pin
# carries the tag, and the tag is what Dependabot compares — so a fan-out that
# fired on the merge would have no number to write and would leave every pin
# labelled with the one it had. `publish-pin-tag` cuts the number and calls this
# with it.
#
# **It is not a race with Dependabot; it is the half Dependabot cannot do.** The
# bot proposes whatever tag existed when it ran, which is how four repositories
# took `v1.0.8` on an afternoon when `v1.0.9` was already published. This fires
# from the tag itself, so what it writes is the revision that has just become
# the one to hold. Where the bot gets there first the run finds nothing stale and
# opens nothing, which is the outcome either way.
name: fan-out-pins

on:
  workflow_call:
    inputs:
      tag:
        description: The number just cut, which the pin comments will carry.
        type: string
        required: true
      commit:
        description: The revision that tag names.
        type: string
        required: true
    # No `secrets:` block, and that is deliberate rather than an omission.
    # Declaring one narrows what this workflow can see to exactly what the
    # caller passes — which would make the same file work when called and fail
    # when run by hand, since a dispatch has no caller to pass anything. The
    # caller sends `secrets: inherit`, a dispatch runs in this repository, and
    # both reach the organisation's own secrets by name.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The published `vN.N.N` to bring every consumer up to. Its commit is
          read from the tag, so a number that does not exist here is refused
          rather than written into fourteen repositories.
        type: string
        required: true

permissions:
  contents: read

# One at a time. Two tags cut close together would otherwise open two pull
# requests per repository, each bumping past the other, and the second would be
# merged on top of a branch that had already moved.
concurrency:
  group: fan-out-pins
  cancel-in-progress: false

jobs:
  fan-out-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the history the measurement reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The measurement is "what has this file done since that commit", and
          # a shallow clone cannot answer it. The reader is right to call that
          # unanswerable rather than clean, which is what it would call every
          # repository without this line.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Which revision this number names
        id: at
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin

          # Resolved from the tag rather than taken from the caller, even when
          # the caller has just cut it. A number and a commit passed separately
          # can disagree, and the disagreement would be written into every
          # repository as a pin whose comment names a different tree.
          if ! commit=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null); then
            echo "::error::${TAG} is not a tag in this repository. A pin comment"\
              "names a published number, and one that does not exist here is one"\
              "Dependabot can never compare against."
            exit 1
          fi

          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "::notice::${TAG} names ${commit}"

      # The map says who holds a pin; only the installation says who can be
      # reached. A repository is declared on the map before it is created, and
      # the write token below is refused outright if one name it is minted for
      # is absent from the installation — so that name would cost every other
      # repository its bump.
      #
      # This token reads the installation's list and nothing else: metadata,
      # read, which every installation holds. It is scoped to the whole
      # installation because that list is what it is for.
      - name: Mint a token that can list the installation
        id: lister
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] -- read-only metadata; the installation's list is what it is for
          permission-metadata: read

      # Every repository on the map the installation does not hold is skipped
      # and named, as a warning and in the summary. A repository it does hold
      # goes on to the bump, and a failure there still fails the run.
      - name: Who holds a pin, and which of them the app can reach
        id: who
        env:
          GH_TOKEN: ${{ steps.lister.outputs.token }}
        run: |
          set -euo pipefail
          listed="${RUNNER_TEMP}/installed"

          # Captured to a file and its exit tested, so a failed listing stops
          # here rather than reading as an installation holding nothing.
          if ! gh api --paginate /installation/repositories \
               --jq '.repositories[].name' >"$listed"; then
            echo "::error::the app's installation could not be listed, so which"\
              "repositories exist and can be reached is unknown."
            exit 1
          fi

          python3 scripts/fan_out_pins.py --reach <"$listed"

      # Scoped to the repositories on the map the installation holds, and to this
      # run. The token can open a pull request in each and do nothing else; it is
      # minted once rather than per repository, because a mint per repository is
      # a dozen more chances for the thing that opens the bump to be the thing
      # that fails.
      #
      # **The app needs `workflows: write`, and `contents: write` is not enough.**
      # GitHub refuses a commit from an app that creates or updates anything under
      # `.github/workflows/`, whatever else the token may do — and every change
      # this workflow makes is to a file under `.github/workflows/`, because that
      # is what a pin on a reusable workflow is. Without it the run gets as far as
      # rewriting the pin correctly and is then answered
      #
      #     ! [remote rejected] ... refusing to allow a GitHub App to create or
      #       update workflow `.github/workflows/scorecard.yml` without
      #       `workflows` permission
      #
      # which reads like a branch problem and is a permission one. The first run
      # of this workflow, on `v1.0.10`, failed exactly there against
      # `lemonfiber-companion` after measuring all twelve repositories correctly.
      #
      # An installation does not take a newly granted permission until it is
      # approved for that installation, so granting it on the app is half of it.
      #
      # `actions: write` is what cancels the checks still running on a bump this
      # run replaces, on a branch it closes (OPS-R85).
      #
      # **The four below are asked for by name, and that is the whole point.**
      # A token minted with whatever the app happens to hold gets as far as
      # twelve clones, twelve rewrites and twelve rejected commits before anyone
      # learns which permission was missing — and the run reports it as twelve
      # repositories refusing a branch. Asking narrows the token to what this
      # workflow actually uses, and turns an absent one into a failure at this
      # step, before a single repository is touched. GitHub's answer does not say
      # which one is absent:
      #
      #     The permissions requested are not granted to this installation.
      #
      # and the cure is on the app's installation, not in this file.
      - name: Mint a token that can reach them
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.who.outputs.named }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: write

      # Every repository is visited even after one of them fails, and the run
      # fails at the end naming which. Stopping at the first would leave the rest
      # of the organisation red for a reason that has nothing to do with them —
      # which is the state this workflow exists to end rather than to reproduce
      # more efficiently.
      - name: Open the bump wherever one is owed
        # One pull request per repository, on one branch (OPS-R85). Each number
        # rebuilds `ci/take-the-shared-workflows` from `main` with the pins it
        # moves, force-moves the branch there, and retitles the open pull
        # request to the number, or opens one where none is open. The consumer's
        # own concurrency group, keyed by the pull request's ref, then cancels
        # the checks still running for the number this replaces.
        #
        # A pull request this workflow opened per number before, on
        # `ci/take-the-shared-workflows-at-v*`, is closed pointing at the rolling
        # one, its branch deleted and its unfinished runs cancelled. Where `main`
        # already holds every pin, an open rolling pull request is closed too: it
        # proposes nothing any more.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.at.outputs.commit }}
          NAMED: ${{ steps.who.outputs.named }}
          SPEC: ${{ github.workspace }}
          # The app the token is minted for, which is who the bump's own pull
          # requests were opened by.
          APP: ${{ steps.token.outputs.app-slug }}
        run: |
          set -uo pipefail
          branch="ci/take-the-shared-workflows"
          legacy="ci/take-the-shared-workflows-at-v"
          title="ci(workflows): take the shared workflows at ${TAG}"
          opened=""; moved=""; current=""; refused=""

          work=$(mktemp -d)

          # Written to files rather than from here-documents: the step is indented
          # inside YAML, and a here-document keeps that indentation.
          printf '%s\n' \
            "${title}" \
            "" \
            "A workflow this repository pins, or a script it runs, moved in the spec, or a" \
            "pin here is past what the pin check allows. \`workflow-pins\` or the pin check" \
            "names it on every pull request opened here until it is taken." \
            "" \
            "A pin is touched where its workflow or a script it runs moved, or where" \
            "the pin check refuses it for being too far behind main or too old. A pin" \
            "a few numbers back none of whose files has changed, inside both limits," \
            "is left alone." \
            "" \
            "Spec: OPS-R48, OPS-R85" \
            "" \
            "Signed-off-by: lemonfiber-release-train[bot] <lemonfiber-release-train[bot]@users.noreply.github.com>" \
            >"${work}/message"

          printf '%s\n' \
            "A workflow this repository pins, or a script it runs, moved in the spec at \`${TAG}\` (\`${COMMIT}\`), or a pin here is past what the pin check allows." \
            "" \
            "\`workflow-pins\` names it on every pull request opened here until it is taken, so this is opened for you rather than owed to you." \
            "" \
            "**The pins in the diff are those whose workflow or scripts moved, and those the pin check refuses** for being more commits behind \`main\` or more days old than \`hygiene.yml\` allows. A pin a few numbers back none of whose files has changed, inside both limits, is left where it is." \
            "" \
            "**One pull request, rebuilt for each number.** The fan-out keeps this branch and this pull request, rebuilds the branch from \`main\` when the spec publishes another number, and retitles it, so the checks of the number it replaces are cancelled rather than left running beside it." \
            "" \
            "Spec: OPS-R48, OPS-R85" \
            "" \
            "Signed-off-by: lemonfiber-release-train[bot] <lemonfiber-release-train[bot]@users.noreply.github.com>" \
            >"${work}/body"

          # The runs of a branch being closed that have not finished, cancelled.
          cancel_runs() {
            gh run list --repo "${OWNER}/$1" --branch "$2" --limit 50 \
              --json databaseId,status \
              --jq '.[] | select(.status != "completed") | .databaseId' \
              | while read -r id; do
                  if [ -n "$id" ]; then
                    gh run cancel "$id" --repo "${OWNER}/$1" >/dev/null || true
                  fi
                done
          }

          for repo in $NAMED; do
            echo "::group::${repo}"
            at="${work}/${repo}"

            if ! gh repo clone "${OWNER}/${repo}" "$at" -- --quiet; then
              echo "::warning::${repo} could not be cloned"
              refused="${refused} ${repo}"
              echo "::endgroup::"; continue
            fi

            # A pin is rewritten by the reader the gate refuses by, so this can
            # neither bump something the gate would not have named nor leave
            # behind something it would.
            if ! python3 "${SPEC}/scripts/fan_out_pins.py" \
                  --repo "$at" --spec "$SPEC" --tag "$TAG"; then
              echo "::warning::${repo} could not be measured"
              refused="${refused} ${repo}"
              echo "::endgroup::"; continue
            fi

            # Every open pull request this app opened here from the repository's
            # own branches, as `number branch`, read once. Matched by branch name
            # alone, a fork's pull request named like the bump would be retitled,
            # closed or have its runs cancelled by this; only the app's own are its.
            if ! gh pr list --repo "${OWNER}/${repo}" --state open --limit 200 \
                 --json number,headRefName,isCrossRepository,author \
                 --jq '.[] | select(.isCrossRepository | not)
                       | select(.author.login == "app/" + env.APP)
                       | "\(.number) \(.headRefName)"' \
                 >"${work}/${repo}.open"; then
              echo "::warning::${repo}'s open pull requests could not be listed"
              refused="${refused} ${repo}"
              echo "::endgroup::"; continue
            fi
            rolling=$(awk -v b="$branch" '$2 == b { print $1; exit }' "${work}/${repo}.open")

            if [ -z "$(git -C "$at" status --porcelain)" ]; then
              if [ -n "$rolling" ]; then
                gh pr close "$rolling" --repo "${OWNER}/${repo}" --delete-branch \
                  --comment "\`main\` already holds every pin this proposed, so there is nothing left to take." \
                  >/dev/null || echo "::warning::${repo}#${rolling} could not be closed"
                cancel_runs "$repo" "$branch"
                rolling=""
              fi
              current="${current} ${repo}"
            else
              # Committed through the API as the app, so GitHub signs it: every
              # consumer's `main` takes signed commits only, and a commit made
              # here with git and pushed is one none of them could merge. The
              # branch is rebuilt from `main` for every number, by way of a
              # staging branch, so the pull request on it is never left holding
              # no commits. What refused is kept: a protected branch, a missing
              # permission and a network fault all read alike without it.
              if ! built=$(python3 "${SPEC}/scripts/signed_pin_commit.py" \
                   --repo "$at" --slug "${OWNER}/${repo}" --branch "$branch" \
                   --message "${work}/message" 2>"${work}/refusal"); then
                echo "::warning::${repo} would not take the bump: $(tr '\n' ' ' <"${work}/refusal")"
                refused="${refused} ${repo}"
                echo "::endgroup::"; continue
              fi

              # The pull request is found and touched the way every bump's is
              # (OPS-R87): retitled only where it is the app's own, from this
              # repository's branch, at the commit just made; opened where none
              # is open; anything else edits nothing and is refused.
              if number=$(python3 "${SPEC}/scripts/rolling_pull_request.py" \
                   --repo "${OWNER}/${repo}" --branch "$branch" --head "$built" \
                   --author "${APP}[bot]" "--title=${title}" \
                   <"${work}/body" 2>"${work}/said"); then
                if [ -n "$rolling" ]; then moved="${moved} ${repo}"; else opened="${opened} ${repo}"; fi
                rolling=$number
              else
                echo "::warning::${repo} would not take the pull request: $(tr '\n' ' ' <"${work}/said")"
                refused="${refused} ${repo}"
              fi
            fi

            # The per-number pull requests this replaced, closed and quietened.
            awk -v l="$legacy" 'index($2, l) == 1 { print $1, $2 }' "${work}/${repo}.open" \
              | while read -r number old; do
                  if [ -n "$rolling" ]; then
                    said="Replaced by #${rolling}, which the fan-out keeps for every number (OPS-R85)."
                  else
                    said="\`main\` already holds every pin this proposed; the fan-out keeps one pull request per repository now (OPS-R85)."
                  fi
                  gh pr close "$number" --repo "${OWNER}/${repo}" --delete-branch \
                    --comment "$said" >/dev/null \
                    && echo "closed ${repo}#${number}" \
                    || echo "::warning::${repo}#${number} could not be closed"
                  cancel_runs "$repo" "$old"
                done

            echo "::endgroup::"
          done

          opened=${opened# }; moved=${moved# }; current=${current# }; refused=${refused# }

          {
            echo "### ${TAG} — the bump, fanned out"
            echo
            echo "- opened:  ${opened:-none}"
            echo "- moved:   ${moved:-none}"
            echo "- current: ${current:-none}"
            echo "- refused: ${refused:-none}"
          } >>"$GITHUB_STEP_SUMMARY"

          # A repository nobody could ask about is not a repository that is
          # current, and the difference is the whole reason this runs at all.
          if [ -n "$refused" ]; then
            echo "::error::no bump was opened in: ${refused}. Those repositories go"\
              "on pinning what they have, and their pull requests stay red, with"\
              "nothing else about to say so."
            exit 1
          fi

  # Loud, because the cost is invisible from every repository it affects: they
  # go on pinning what they already have, and the only sign is a red gate on
  # somebody's unrelated pull request.
  told:
    needs: fan-out-pins
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    with:
      title: "🌱 fan-out-pins failed"
      body: >-
        A number was cut and the bump was not opened everywhere. Until it is,
        those repositories go on pinning what they have and every pull request
        opened in them is red for it — the run page says which.
      url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      color: "15158332"
    secrets:
      webhook: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
