# Reusable: ask the catalogue to move a first-party plugin's pin in the default bundle
# to the revision a merged train pin made (OPS-R86, OPS-R91).
#
# A train tag opens one rolling pull request on the calling repository naming the image
# it published: `release/adapter-pin` from `adapter-release`, `release/image-pin` from
# `manifest-pin`. Once that pull request merges, its merge commit on main is the revision
# whose manifest names that image, and `bundle-bump` in lemonfiber-plugins moves the
# bundle's pin and copy to it. It is told the calling repository's address, and refuses a
# plugin the bundle does not pin from there, so a copy of a plugin's repository moves
# nothing but its own pin.
#
# It runs on each push to main, so the job holding the release App's key runs from main
# behind the calling repository's `release` environment, whose branch policy admits main
# and `v*` tags only. `author` holds the run's own token, able to read the repository and
# its pull requests and nothing else, and no secret: it finds the pull request the pushed
# commit merged and answers only where the release App opened it from this repository's
# pin branch. `bump` runs only on that answer, mints the App's token for
# lemonfiber-plugins alone, able to dispatch a workflow and nothing else, and holds the
# release App's login to the token's own App before it asks.
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     bundle:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@<sha> # vX.Y.Z
#       with:
#         pin: adapter
#       secrets:
#         RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
name: first-party-bundle
on:
  workflow_call:
    inputs:
      pin:
        description: "Whose pin moves the bundle: `adapter` for release/adapter-pin, `image` for release/image-pin."
        type: string
        required: true
    secrets:
      RELEASE_APP_KEY:
        description: "The release App's private key, which dispatches the catalogue's bump."
        required: true

permissions:
  contents: read

env:
  # The login the release App opens its pull requests under, the one author whose pin
  # moves the bundle.
  RELEASE_BOT: lemonfiber-release-train[bot]

jobs:
  author:
    name: which pin the push merged
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'lemonfiber'
      && (inputs.pin == 'adapter' || inputs.pin == 'image')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      opened: ${{ steps.who.outputs.opened }}
    steps:
      - name: The release App opened the pin this commit merged
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: release/${{ inputs.pin }}-pin
        run: |
          set -euo pipefail
          merged="$(gh api "repos/${REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq "map(select(
            .merged_at != null and .merge_commit_sha == \"${GITHUB_SHA}\"
            and .head.ref == \"${BRANCH}\" and .head.repo.full_name == \"${REPOSITORY}\"))
            | map(.user.login) | join(\" \")")"
          if [ -z "$merged" ]; then
            echo "${GITHUB_SHA} merges no ${BRANCH}, so nothing is pinned."
            exit 0
          fi
          [ "$merged" = "$RELEASE_BOT" ] \
            || { echo "::error::${BRANCH} was opened by ${merged}, not ${RELEASE_BOT}, so nothing is pinned"; exit 1; }
          echo "opened=release" >> "$GITHUB_OUTPUT"

  bump:
    needs: author
    if: needs.author.outputs.opened == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the plugin's id at the merged revision
        id: plugin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, tomllib
          plugin = tomllib.load(open("plugin.toml", "rb"))["plugin"]["id"]
          if not re.fullmatch(r"[a-z][a-z0-9]*(?:-[a-z0-9]+)*", plugin):
              sys.exit(f"::error::{plugin!r} is not a plugin id")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"id={plugin}\n")
          PY
      - name: Mint a token that can dispatch the catalogue's bump
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: lemonfiber-plugins
          permission-actions: write
      - name: Ask the catalogue to pin the merged revision
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PLUGIN: ${{ steps.plugin.outputs.id }}
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          [ "$RELEASE_BOT" = "$BOT" ] \
            || { echo "::error::the token is ${BOT}'s, not ${RELEASE_BOT}'s, so nothing is pinned"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::the push named no commit: '${GITHUB_SHA}'"; exit 1; }
          gh api --method POST \
            "repos/${OWNER}/lemonfiber-plugins/actions/workflows/bundle-bump.yml/dispatches" \
            -f ref=main -f "inputs[id]=${PLUGIN}" -f "inputs[revision]=${GITHUB_SHA}" -f "inputs[origin]=${ORIGIN}"
          echo "asked lemonfiber-plugins to pin ${PLUGIN} at ${GITHUB_SHA}."
