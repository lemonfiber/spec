# A pull request cannot change what spec's checks run on its own say (Q-R83).
# `pull_request_target` runs this file, and the reusable it calls, as the base
# branch holds them, so a pull request cannot rewrite either; the reusable
# checks nothing of the pull request out, runs its script from the base
# branch's commit, and reads the pull request's trees through the API. A change
# under `.github/workflows/` or `.github/actions/` fails it, unless a maintainer
# approved it with the `workflows-approved` label after its last push;
# `labeled` and `unlabeled` run it again when the approval is given or taken
# away.
#
# The verdict is a check on the head commit the event names, so every new head
# gets its own run. Under `pull_request_target` `github.ref` is the base branch
# every pull request shares, so the group is keyed on the pull request's number:
# a push cancels the run for the head it replaced, and nothing else (Q-R75).
name: pin-only
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pin-only:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pin-only.yml
