# Reusable hygiene checks: workflow lint, spelling, links, invite codes, markdown,
# the length of every tracked file, and the shared files those tools read.
# Every other repository runs these as the `hygiene` group of `gates.yml`, which
# scripts/gen_gates.py writes from this file; spec runs it as its own workflow.
# One definition, no drift (Q-R56).
#
# This workflow checks out the calling repository and lints that tree. The lint
# configurations that govern a run are the calling repository's own copies as
# its base branch holds them, never a pull request's, and the shared-files job
# keeps those copies equal to the canonical ones in lemonfiber/spec/shared.
name: hygiene

on:
  workflow_call:
  pull_request:
  # A merge queue asks for every context `main` requires again, on its own
  # branch: `main`'s tip with the queued pull requests applied. A context that
  # never reports there is read as a wait, and the queue drops the pull request
  # at the timeout naming nothing. Nothing here reads the pull request, so on
  # this event the same checks run over the merged batch.
  merge_group:

permissions:
  contents: read

jobs:
  # The CLI rather than an action that fetches `latest`: pinned by version and
  # run only once its bytes are the ones the release published, so a new
  # actionlint reaches every repository when the version below moves, not the
  # day it is cut. The watch after it says when that version falls behind.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # The SHA-256 of that release's linux_amd64 tarball, from its
      # actionlint_<version>_checksums.txt. Raise it with the version.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tool that reads what to pass over from the tree it checks would take
      # that list from the pull request it is judging, and one line there
      # silences it for the change that line came with. So each file that tells
      # it what to skip is the base branch's: a copy of the pull request's own at
      # the same path is replaced by the base's, or removed where the base has
      # none, and a change to one of them judges the pull requests after it
      # merges. On a push the branch's own copy already is the base's.
      - name: The files that say what to pass over are the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIGS: .github/actionlint.yaml .github/actionlint.yml .shellcheckrc
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is judged by the files it carries, which are its branch's own."
            exit 0
          fi
          listed="${RUNNER_TEMP}/configurations"
          said="${RUNNER_TEMP}/configuration-error"
          for name in $CONFIGS; do
            { printf '%s\0' "$name"; git ls-files -z -- ":(glob)**/${name}"; } | sort -zu > "$listed"
            while IFS= read -r -d '' path; do
              parent=$(dirname -- "$path")
              if [ -L "$parent" ]; then
                echo "::error::${parent} is a link, so ${path} would be read from wherever it points rather than from this tree."
                exit 1
              fi
              if [ ! -d "$parent" ]; then
                echo "${path}: no directory here holds it, so none is read"
                continue
              fi
              encoded=$(jq -rn --arg path "$path" '$path | split("/") | map(@uri) | join("/")')
              rm -rf -- "$path"
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/${encoded}?ref=${BASE_SHA}" > "$path" 2> "$said"; then
                echo "${path}: the base branch's copy"
              elif grep -qF "(HTTP 404)" "$said"; then
                rm -f -- "$path"
                echo "${path}: the base branch has none, so none is read"
              else
                cat "$said" >&2
                echo "::error::${path} could not be read at the base branch, so this check cannot say which list of what to pass over judges the change."
                exit 1
              fi
            done < "$listed"
          done
      - name: actionlint
        env:
          # Each finding as an annotation on the line it is about.
          FINDING: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -o "$archive" "$url"
          sha256sum --check --strict <<<"${ACTIONLINT_SHA256}  ${archive}"
          tar xzf "$archive" -C "$RUNNER_TEMP" actionlint
          rm -f "$archive"
          "${RUNNER_TEMP}/actionlint" -format "$FINDING"
      - name: The pinned actionlint is not far behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND_DAYS: "30"
          TOOL: actionlint
          RELEASES: rhysd/actionlint
          KNOB: ACTIONLINT_VERSION
          HOME_FILE: .github/workflows/hygiene.yml
        run: |
          set -euo pipefail

          # One watch, run after each scanner this workflow fetches by hand.
          # TOOL names it, RELEASES is where it publishes, and KNOB names the
          # variable above that holds the version it ran.
          version="${!KNOB}"

          # `gh` prints its own error body on stdout, so a failed call arrives
          # here looking like an answer. Only a release tag with a date is
          # believed. Three attempts, because this reddens a security gate in
          # every repository and one blocked API call is not staleness.
          tag=""
          dated=""
          for attempt in 1 2 3; do
            answer=$(gh api "repos/${RELEASES}/releases/latest" \
              --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null || true)
            tag=$(echo "$answer" | cut -d" " -f1)
            dated=$(echo "$answer" | cut -d" " -f2)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
              [[ "$dated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              break
            fi
            tag=""
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not read the latest ${TOOL} release in three attempts, so this run does not know whether it scanned with a current scanner."
            exit 1
          fi

          if [ "$tag" = "v${version}" ]; then
            echo "${TOOL} ${version} is the current release."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))
          if [ "$age" -gt "$BEHIND_DAYS" ]; then
            echo "::error::This scanned with ${TOOL} ${version}; ${tag} has been out ${age} days. Raise ${KNOB} in lemonfiber/spec ${HOME_FILE} — what ${TOOL} has learnt since ${version} is not being applied to any repository."
            exit 1
          fi
          echo "::notice::${TOOL} ${tag} is ${age} days old; this scanned with ${version}. Raise ${KNOB} in lemonfiber/spec ${HOME_FILE} when convenient."

  # Say what shared revision this repository is actually running. Every caller
  # pins by SHA, which is right, and it means a fix landing here reaches nobody
  # until each pin moves — a fix to the site-rebuild notice sat unreached in nine
  # repositories while one of them failed on every push to main.
  #
  # Three things fail, and being merely behind is none of them. A pin that is not
  # on this repository's main names a revision nobody reviewed, or a branch
  # rewritten under it. A pin a month old is abandonment by time. A pin more than
  # STALE_COMMITS behind is abandonment by distance. Everything between is a
  # notice, because a pin is expected to trail a merge and a check that reddens
  # the moment anything lands here is one people route around.
  #
  # Distance is here because age alone was blind in the direction this repository
  # actually moves. `brand` and `lemonfiber-media-stack` pinned this file at a
  # revision 94 commits behind and 13 days old: healthy under a day rule, and old
  # enough to predate this job, so neither repository ran a pin check at all and
  # nothing there watched any shared pin. Q-R68 asks for the commits not taken to
  # be reported, and a count of them is the thing a day cannot stand in for —
  # 148 commits landed here in the 30 days that rule tolerates.
  #
  # STALE_COMMITS is 75 because the fleet's last coordinated fan-out left every
  # healthy repository 60 commits behind, and the gap that hid the defect above
  # was 94. The line goes between the state the fleet was deliberately left in and
  # the state that hid a job that could not run — about a fortnight of this
  # repository's history at its measured pace, which is the interval the fan-out
  # runs at (OPS-R48). `fan_out_pins.py` reads both limits from here, so the
  # release train brings forward every pin this refuses.
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare each pinned shared workflow against the one maintained
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "30"
          STALE_COMMITS: "75"
        run: |
          set -euo pipefail

          # The workflow name is kept, not only the revision. A pin is asked two
          # questions below that a count cannot answer: which shared workflows
          # this repository actually runs, and whether any of them changed in the
          # commits the pin has not taken.
          pairs=$(grep -rhoE "lemonfiber/spec/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}" \
            .github/workflows/ 2>/dev/null | sed "s|lemonfiber/spec/\.github/workflows/||" | sort -u || true)
          pins=$(printf "%s" "$pairs" | grep -oE "[0-9a-f]{40}$" | sort -u || true)

          if [ -z "$pins" ]; then
            echo "This repository pins no shared workflow."
            exit 0
          fi

          faults=0
          for pin in $pins; do
            answer=$(gh api "repos/lemonfiber/spec/compare/${pin}...main" \
              --jq '"\(.status) \(.ahead_by) \(.base_commit.commit.committer.date) \([(.files // [])[].filename] | join(","))"' 2>/dev/null || true)
            status=$(echo "$answer" | cut -d" " -f1)
            ahead=$(echo "$answer" | cut -d" " -f2)
            dated=$(echo "$answer" | cut -d" " -f3)
            changed=$(echo "$answer" | cut -d" " -f4)

            # gh prints its own error body on stdout, so a revision that does not
            # exist arrives here looking like a status. Only the words the API
            # documents are believed.
            case "$status" in
            identical | ahead | behind | diverged) ;;
            *)
              echo "::error::${pin} is not a revision of lemonfiber/spec. A pin naming nothing runs nothing that was reviewed."
              faults=$((faults + 1))
              continue
              ;;
            esac

            case "$status" in
            identical)
              echo "${pin:0:8} is current."
              continue
              ;;
            ahead)
              # `main` is ahead of the pin: the ordinary case, and the one that ages.
              ;;
            *)
              echo "::error::${pin:0:8} is not on lemonfiber/spec main (${status}). It names a revision that was never merged, or a branch rewritten under it."
              faults=$((faults + 1))
              continue
              ;;
            esac

            age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))

            # Both questions are asked, and both are named in the answer. A pin
            # can be stale by either without being stale by the other, and which
            # one fired is what tells a reader whether the pin was forgotten or
            # merely outrun.
            # Which of the shared workflows this repository runs changed in the
            # commits this pin has not taken.
            #
            # "23 commits behind" is a number nobody acts on. "the link check you
            # run was fixed in one of them" is a sentence somebody does something
            # about — and that was the difference on the day SonarCloud answered
            # 503 for half an hour: `hygiene.yml` had gained the fix that morning,
            # every repository was inside both thresholds, and the count said
            # nothing about which commit any of them needed.
            #
            # It is said and not gated, deliberately. Failing the moment a shared
            # workflow lands would redden nine repositories on every change here,
            # which is the check people route around. `website-docs` draws the
            # same line between how far a pin is behind and what it is behind
            # *on*, and reports both rather than gating either (Q-R68).
            runs=$(printf "%s" "$pairs" | grep -F "@${pin}" | cut -d@ -f1 | sort -u || true)
            touched=""
            for name in $runs; do
              case ",${changed}," in
              *",.github/workflows/${name},"*)
                touched="${touched:+${touched}, }${name}"
                ;;
              esac
            done

            if [ -n "$touched" ]; then
              reads="${touched} changed in them"
            else
              reads="none of them touched a workflow this repository runs"
            fi

            broke=""
            if [ "$age" -gt "$STALE_DAYS" ]; then
              broke="more than ${STALE_DAYS} days old"
            fi
            if [ "$ahead" -gt "$STALE_COMMITS" ]; then
              if [ -n "$broke" ]; then
                broke="${broke}, and "
              fi
              broke="${broke}more than ${STALE_COMMITS} commits behind"
            fi

            if [ -n "$broke" ]; then
              echo "::error::${pin:0:8} is ${ahead} commits and ${age} days behind lemonfiber/spec main, which is ${broke}, and ${reads}. Bump it: whatever has been fixed there has not reached this repository."
              faults=$((faults + 1))
            else
              echo "::notice::${pin:0:8} is ${ahead} commits behind lemonfiber/spec main (${age} days), and ${reads}. Bump it when convenient."
            fi
          done

          if [ "$faults" -gt 0 ]; then
            echo "${faults} pin(s) need attention."
            exit 1
          fi

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tool that reads what to pass over from the tree it checks would take
      # that list from the pull request it is judging, and one line there
      # silences it for the change that line came with. So each file that tells
      # it what to skip is the base branch's: a copy of the pull request's own at
      # the same path is replaced by the base's, or removed where the base has
      # none, and a change to one of them judges the pull requests after it
      # merges. On a push the branch's own copy already is the base's.
      - name: The files that say what to pass over are the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIGS: typos.toml .gitignore .ignore
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is judged by the files it carries, which are its branch's own."
            exit 0
          fi
          listed="${RUNNER_TEMP}/configurations"
          said="${RUNNER_TEMP}/configuration-error"
          for name in $CONFIGS; do
            { printf '%s\0' "$name"; git ls-files -z -- ":(glob)**/${name}"; } | sort -zu > "$listed"
            while IFS= read -r -d '' path; do
              parent=$(dirname -- "$path")
              if [ -L "$parent" ]; then
                echo "::error::${parent} is a link, so ${path} would be read from wherever it points rather than from this tree."
                exit 1
              fi
              if [ ! -d "$parent" ]; then
                echo "${path}: no directory here holds it, so none is read"
                continue
              fi
              encoded=$(jq -rn --arg path "$path" '$path | split("/") | map(@uri) | join("/")')
              rm -rf -- "$path"
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/${encoded}?ref=${BASE_SHA}" > "$path" 2> "$said"; then
                echo "${path}: the base branch's copy"
              elif grep -qF "(HTTP 404)" "$said"; then
                rm -f -- "$path"
                echo "${path}: the base branch has none, so none is read"
              else
                cat "$said" >&2
                echo "::error::${path} could not be read at the base branch, so this check cannot say which list of what to pass over judges the change."
                exit 1
              fi
            done < "$listed"
          done
      # typos reads a configuration from every directory it checks, and from
      # `pyproject.toml` and `Cargo.toml` too, none of which the step above can
      # hand back. So it is told to read the root's `typos.toml` and no other,
      # and an empty one where the base branch has none.
      - name: typos reads an empty configuration where the base branch has none
        run: |
          if [ ! -e typos.toml ]; then
            : > typos.toml
          fi
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: typos.toml
          isolated: true

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--accept` here is the floor for repositories that ship no `lychee.toml`,
      # and it is what wins where one exists — a command-line argument overrides
      # the config file, so a repository's own `accept` list is decoration. That
      # is worth knowing before changing either.
      #
      # What is accepted, and why each one is not a broken link:
      #
      #   206  a partial response — the host answered, in pieces
      #   429  the host asking to be asked less often
      #   5xx  the host is unwell
      #
      # The last one is the addition. A `504 Gateway Timeout` from GitHub failed
      # this gate on a link that answers `200` from any other machine, and the
      # report read as a dead link. It is not: a 5xx is the *server* failing, and
      # a link check cannot tell a permanently broken host from a momentarily
      # busy one — but it can tell either from a URL that is wrong, because a URL
      # that is wrong answers `404` or `410`, and those still fail.
      #
      # The alternative is what was happening: somebody re-runs the job until it
      # passes. A gate that is re-run until green is not a gate, and the habit
      # spreads to the gates that matter.
      # A `lychee.toml` in the calling repository that declares `accept` is
      # declaring something the step below overrides, and the two agreeing is
      # exactly what makes it invisible.
      #
      # Five repositories carried `accept = ["200", "206", "429"]` and not one of
      # them had ever been consulted, because a command-line argument beats a
      # config file and the argument held the same three codes. On 2026-09-13
      # SonarCloud answered 503 for over an hour, `hygiene / links` went red on a
      # pull request that touched no link, and the obvious fix was to add `503` to
      # one of those lists. It would have been watched failing with no explanation.
      #
      # Refused rather than noticed, because there is nothing to weigh: the list
      # does nothing, it comes out in one line, and the message says where the one
      # that runs lives. A no-op that looks like configuration is the shape this
      # repository refuses everywhere else.
      - name: An accept list in the caller's config is not the one that runs
        run: |
          set -euo pipefail

          if [ ! -f lychee.toml ]; then
            echo "No lychee.toml here; the list below is the only one."
            exit 0
          fi

          if ! grep -qE "^[[:space:]]*accept[[:space:]]*=" lychee.toml; then
            echo "lychee.toml declares no accept list, which is right: the one that runs is below."
            exit 0
          fi

          said="lychee.toml declares an \`accept\` list. The step below passes --accept on the command line and that beats a config file, so this list has never been consulted — and somebody editing it to fix a failing link check would watch it keep failing with no idea why. Take it out. The list that runs is in lemonfiber/spec's hygiene.yml, with the reasoning for each code beside it."
          echo "::error file=lychee.toml::${said}"
          printf '### An accept list that does not run\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # A tool that reads what to pass over from the tree it checks would take
      # that list from the pull request it is judging, and one line there
      # silences it for the change that line came with. So each file that tells
      # it what to skip is the base branch's: a copy of the pull request's own at
      # the same path is replaced by the base's, or removed where the base has
      # none, and a change to one of them judges the pull requests after it
      # merges. On a push the branch's own copy already is the base's.
      - name: The files that say what to pass over are the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIGS: lychee.toml .lycheeignore .gitignore .ignore
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is judged by the files it carries, which are its branch's own."
            exit 0
          fi
          listed="${RUNNER_TEMP}/configurations"
          said="${RUNNER_TEMP}/configuration-error"
          for name in $CONFIGS; do
            { printf '%s\0' "$name"; git ls-files -z -- ":(glob)**/${name}"; } | sort -zu > "$listed"
            while IFS= read -r -d '' path; do
              parent=$(dirname -- "$path")
              if [ -L "$parent" ]; then
                echo "::error::${parent} is a link, so ${path} would be read from wherever it points rather than from this tree."
                exit 1
              fi
              if [ ! -d "$parent" ]; then
                echo "${path}: no directory here holds it, so none is read"
                continue
              fi
              encoded=$(jq -rn --arg path "$path" '$path | split("/") | map(@uri) | join("/")')
              rm -rf -- "$path"
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/${encoded}?ref=${BASE_SHA}" > "$path" 2> "$said"; then
                echo "${path}: the base branch's copy"
              elif grep -qF "(HTTP 404)" "$said"; then
                rm -f -- "$path"
                echo "${path}: the base branch has none, so none is read"
              else
                cat "$said" >&2
                echo "::error::${path} could not be read at the base branch, so this check cannot say which list of what to pass over judges the change."
                exit 1
              fi
            done < "$listed"
          done
      - name: lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --max-retries 3 --retry-wait-time 3 --accept 200,206,429,500..=599 ."
          fail: true

  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The escaped dots in INVITE mean this workflow does not match its own text.
      - name: The community is addressed by name, not by invite code
        env:
          INVITE: 'discord\.gg/|discord(app)?\.com/invite/'
        run: |
          rc=0
          git grep -nIE "$INVITE" -- . || rc=$?
          case "$rc" in
            0)
              echo "::error::Address the community as https://discord.nightworks.io (OPS-R56). An invite code can be revoked, and every published link carrying it dies at once."
              exit 1
              ;;
            1)
              echo "no invite codes in tracked files"
              ;;
            *)
              echo "::error::git grep failed with rc $rc"
              exit 1
              ;;
          esac

  shared-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # spec's scripts at the commit this workflow was called at, so a caller
      # pinned at a revision runs that revision's scripts. What they read stays
      # the canonical spec below.
      - name: Check out spec's scripts at this workflow's commit
        if: github.repository != 'lemonfiber/spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling

      # The copies are read from `main`, like spec-check's identifiers: a repo is
      # checked against the canonical copies as they stand, not as its pin
      # remembers them.
      - name: Check out the canonical copies
        if: github.repository != 'lemonfiber/spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every shared file matches its one home
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" = "lemonfiber/spec" ]; then
            scripts="scripts"
            canonical="."
          else
            scripts=".spec-tooling/scripts"
            canonical=".spec-canonical"
          fi
          python3 -E -s "$scripts/check_shared_files.py" \
            --canonical "$canonical" \
            --repo "$REPO"

      # AGENTS.md opens with the pointer to the board and the shared rules, and
      # fits the cap (GOV-R50). A step of this job rather than a check of the
      # script above, so it reaches a repository when that repository moves its
      # pin of this workflow, not the moment the rule merges.
      - name: AGENTS.md points first at the board and the shared rules
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" = "lemonfiber/spec" ]; then
            scripts="scripts"
          else
            scripts=".spec-tooling/scripts"
          fi
          python3 -E -s "$scripts/check_agents.py" --root .

  # No tracked file over 1,000 lines, generated output included; lockfiles, images
  # and fonts are not counted. The cap and that list are in the script, read at
  # the commit this workflow was called at, so a rule reaches a repository with
  # its pin, the way the AGENTS.md step above does.
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out spec's scripts at this workflow's commit
        if: github.repository != 'lemonfiber/spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: No tracked file is longer than the cap
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" = "lemonfiber/spec" ]; then
            reader=scripts/check_line_cap.py
          else
            reader=.spec-tooling/scripts/check_line_cap.py
          fi
          python3 -E -s "$reader" --root .

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # markdownlint-cli2 reads a configuration from every directory it lints,
      # in formats that import code, and resolves the modules a configuration
      # names from the tree beside it. In `gates` that tree is a pull request's,
      # on the runner every later verdict runs on. So the linter is never handed
      # it: the pull request is checked out aside, and the linter's workspace
      # holds the tracked Markdown files, read out of git, and the canonical
      # configuration, and nothing else. No file of the pull request's is read
      # as configuration, so there is no configuration of its to judge.
      - name: Check out the calling repository, aside from what the linter reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .pr

      - name: Check out the canonical copy
        if: github.repository != 'lemonfiber/spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical

      - name: The linter is handed the Markdown and the canonical configuration, and nothing else
        id: markdown-only
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REPO" = "lemonfiber/spec" ]; then
            canonical=.pr
          else
            canonical=.spec-canonical
          fi
          stage="${RUNNER_TEMP}/markdown"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$canonical/shared/markdownlint.jsonc" "$stage/.markdownlint.jsonc"
          STAGE="$stage" python3 -I - <<'PY'
          import os, subprocess, sys
          # Every tracked Markdown file, as git holds it: a regular file's blob,
          # never a link, a submodule or whatever the working tree has at the path.
          stage = os.environ["STAGE"]
          listed = subprocess.run(["git", "-C", ".pr", "ls-files", "-z", "--stage", "--", "*.md"],
                                  check=True, capture_output=True).stdout
          wanted = []
          for entry in filter(None, listed.split(b"\0")):
              meta, path = entry.split(b"\t", 1)
              mode, blob, _ = meta.split(b" ")
              if mode not in (b"100644", b"100755"):
                  continue
              parts = path.split(b"/")
              # A directory under a configuration's name would be read as one.
              if any(part.lower().startswith(b".markdownlint") for part in parts[:-1]):
                  where = os.fsdecode(path).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error::{where} sits in a directory named as a markdownlint configuration, "
                        "which the linter would read as one. Rename the directory.")
                  sys.exit(1)
              wanted.append((blob, path))
          batch = subprocess.run(["git", "-C", ".pr", "cat-file", "--batch"], check=True, capture_output=True,
                                 input=b"".join(blob + b"\n" for blob, _ in wanted)).stdout
          at = 0
          for blob, path in wanted:
              header_end = batch.index(b"\n", at)
              size = int(batch[at:header_end].split(b" ")[2])
              body = batch[header_end + 1:header_end + 1 + size]
              at = header_end + 1 + size + 1
              target = os.path.join(stage, os.fsdecode(path))
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as out:
                  out.write(body)
          print(f"{len(wanted)} Markdown file(s) handed to the linter")
          PY
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          cp -a "$stage/." "$GITHUB_WORKSPACE/"
          rm -rf "$stage"

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
