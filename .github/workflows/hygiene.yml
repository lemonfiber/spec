# Reusable hygiene checks: workflow lint, spelling, links, invite codes, markdown,
# and the shared files those tools read.
# Called by each repo:  uses: lemonfiber/spec/.github/workflows/hygiene.yml@main
# One definition, no drift (Q-R56).
#
# This workflow checks out the calling repository and lints that tree, so the
# lint configs that govern a run are the calling repo's own copies. The
# shared-files job is what keeps those copies equal to the canonical ones in
# lemonfiber/spec/shared.
name: hygiene

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # Say what shared revision this repository is actually running. Every caller
  # pins by SHA, which is right, and it means a fix landing here reaches nobody
  # until each pin moves — a fix to the site-rebuild notice sat unreached in nine
  # repositories while one of them failed on every push to main.
  #
  # Three things fail, and being merely behind is none of them. A pin that is not
  # on this repository's main names a revision nobody reviewed, or a branch
  # rewritten under it. A pin a month old is abandonment by time. A pin more than
  # STALE_COMMITS behind is abandonment by distance. Everything between is a
  # notice, because a pin is expected to trail a merge and a check that reddens
  # the moment anything lands here is one people route around.
  #
  # Distance is here because age alone was blind in the direction this repository
  # actually moves. `brand` and `lemonfiber-media-stack` pinned this file at a
  # revision 94 commits behind and 13 days old: healthy under a day rule, and old
  # enough to predate this job, so neither repository ran a pin check at all and
  # nothing there watched any shared pin. Q-R68 asks for the commits not taken to
  # be reported, and a count of them is the thing a day cannot stand in for —
  # 148 commits landed here in the 30 days that rule tolerates.
  #
  # STALE_COMMITS is 75 because the fleet's last coordinated fan-out left every
  # healthy repository 60 commits behind, and the gap that hid the defect above
  # was 94. The line goes between the state the fleet was deliberately left in and
  # the state that hid a job that could not run — about a fortnight of this
  # repository's history at its measured pace, which is the interval the fan-out
  # runs at (OPS-R48).
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare each pinned shared workflow against the one maintained
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "30"
          STALE_COMMITS: "75"
        run: |
          set -euo pipefail

          pins=$(grep -rhoE "lemonfiber/spec/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}" \
            .github/workflows/ 2>/dev/null | grep -oE "[0-9a-f]{40}$" | sort -u || true)

          if [ -z "$pins" ]; then
            echo "This repository pins no shared workflow."
            exit 0
          fi

          faults=0
          for pin in $pins; do
            answer=$(gh api "repos/lemonfiber/spec/compare/${pin}...main" \
              --jq '"\(.status) \(.ahead_by) \(.base_commit.commit.committer.date)"' 2>/dev/null || true)
            status=$(echo "$answer" | cut -d" " -f1)
            ahead=$(echo "$answer" | cut -d" " -f2)
            dated=$(echo "$answer" | cut -d" " -f3)

            # gh prints its own error body on stdout, so a revision that does not
            # exist arrives here looking like a status. Only the words the API
            # documents are believed.
            case "$status" in
            identical | ahead | behind | diverged) ;;
            *)
              echo "::error::${pin} is not a revision of lemonfiber/spec. A pin naming nothing runs nothing that was reviewed."
              faults=$((faults + 1))
              continue
              ;;
            esac

            case "$status" in
            identical)
              echo "${pin:0:8} is current."
              continue
              ;;
            ahead)
              # `main` is ahead of the pin: the ordinary case, and the one that ages.
              ;;
            *)
              echo "::error::${pin:0:8} is not on lemonfiber/spec main (${status}). It names a revision that was never merged, or a branch rewritten under it."
              faults=$((faults + 1))
              continue
              ;;
            esac

            age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))

            # Both questions are asked, and both are named in the answer. A pin
            # can be stale by either without being stale by the other, and which
            # one fired is what tells a reader whether the pin was forgotten or
            # merely outrun.
            broke=""
            if [ "$age" -gt "$STALE_DAYS" ]; then
              broke="more than ${STALE_DAYS} days old"
            fi
            if [ "$ahead" -gt "$STALE_COMMITS" ]; then
              if [ -n "$broke" ]; then
                broke="${broke}, and "
              fi
              broke="${broke}more than ${STALE_COMMITS} commits behind"
            fi

            if [ -n "$broke" ]; then
              echo "::error::${pin:0:8} is ${ahead} commits and ${age} days behind lemonfiber/spec main, which is ${broke}. Bump it: whatever has been fixed there has not reached this repository."
              faults=$((faults + 1))
            else
              echo "::notice::${pin:0:8} is ${ahead} commits behind lemonfiber/spec main (${age} days). Bump it when convenient."
            fi
          done

          if [ "$faults" -gt 0 ]; then
            echo "${faults} pin(s) need attention."
            exit 1
          fi

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --accept 200,206,429 ."
          fail: true

  invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The escaped dots in INVITE mean this workflow does not match its own text.
      - name: The community is addressed by name, not by invite code
        env:
          INVITE: 'discord\.gg/|discord(app)?\.com/invite/'
        run: |
          rc=0
          git grep -nIE "$INVITE" -- . || rc=$?
          case "$rc" in
            0)
              echo "::error::Address the community as https://discord.nightworks.io (OPS-R56). An invite code can be revoked, and every published link carrying it dies at once."
              exit 1
              ;;
            1)
              echo "no invite codes in tracked files"
              ;;
            *)
              echo "::error::git grep failed with rc $rc"
              exit 1
              ;;
          esac

  shared-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read from `main`, like spec-check and commitlint: a repo is checked
      # against the canonical copies as they stand, not as its pin remembers them.
      - name: Check out the canonical copies
        if: github.repository != 'lemonfiber/spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every shared file matches its one home
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" = "lemonfiber/spec" ]; then
            canonical="."
          else
            canonical=".spec-canonical"
          fi
          python3 "$canonical/scripts/check_shared_files.py" \
            --canonical "$canonical" \
            --repo "$REPO"

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
