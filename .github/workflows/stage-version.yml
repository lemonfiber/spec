# Open a version's staging period — OPS-R30, R32, R33, R43, R49, R50, R52.
#
# Validates the version is stageable (planned, goals defined, nothing else in
# flight), cuts a release branch in each target repo, flips the manifest to
# staged, opens the tracking issue, and announces to #maintainers. Maintainer-only.
name: stage-version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stage, e.g. 0.2.0 — its versions/<v>.toml must exist as planned."
        required: true
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    outputs:
      goals: ${{ steps.issue.outputs.goals }}
    steps:
      - name: Gate to maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          case "$perm" in
            admin|maintain) echo "${ACTOR} is a maintainer (${perm})." ;;
            *) echo "::error::${ACTOR} lacks maintainer permission (${perm})."; exit 1 ;;
          esac
      - name: Validate the version string
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }
      - name: Mint the release App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - name: Validate stageable (OPS-R30, R52)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_stageable.py "$VERSION" > repos.txt
          echo "target repos:"; cat repos.txt
      - name: Cut release branches (OPS-R33, R49)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          while read -r r; do
            [ -n "$r" ] || continue
            base=$(gh api "repos/${OWNER}/${r}/git/ref/heads/main" --jq '.object.sha')
            gh api --method POST "repos/${OWNER}/${r}/git/refs" \
              -f ref="refs/heads/release/${VERSION}" -f sha="$base" \
              || echo "::warning::release/${VERSION} may already exist in ${r}"
            echo "cut release/${VERSION} in ${r}"
          done < repos.txt
      - name: Flip status → staged (OPS-R32)
        uses: ./.github/actions/manifest-transition
        with:
          version: ${{ inputs.version }}
          status: staged
          token: ${{ steps.token.outputs.token }}
      - name: Open the tracking issue (OPS-R43)
        id: issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" > body.md <<'PY'
          import sys, tomllib
          d = tomllib.load(open(f"70-operations/versions/{sys.argv[1]}.toml", "rb"))
          print(f"## Release {d['version']} — 0/{len(d['goals'])} goals\n")
          for g in d["goals"]:
              print(f"- [ ] `{g}`")
          print("\n_staged — the tracker updates this as goals land (OPS-R43)._")
          PY
          echo "goals=$(grep -c '^- \[' body.md)" >> "$GITHUB_OUTPUT"
          gh issue create --repo "${OWNER}/spec" \
            --title "Release ${VERSION} — tracker" \
            --body-file body.md
      - name: Announce staging (OPS-R50)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
          GOALS: ${{ steps.issue.outputs.goals }}
        run: echo "::notice::Staged ${VERSION} with ${GOALS} goals."
  announce:
    needs: stage
    uses: lemonfiber/spec/.github/workflows/discord-notify.yml@5c97eb3535dddf1a74c0efae88d759b01dbc8188 # main
    with:
      title: "📦 Staged ${{ inputs.version }}"
      body: "${{ needs.stage.outputs.goals }} goals locked. Tracking issue opened."
      color: "10181046"
    secrets:
      webhook: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
