# Execute a staged (or fast-lane) version — OPS-R34, R35, R36, R54.
#
# Gates on every locked goal being satisfied and on every one of them being
# built, checks the streams still agree and nothing is blocking, then tags each target repo (an App-token tag DOES trigger
# their release.yml, unlike GITHUB_TOKEN) and stops. The tags produce draft
# releases; a human reviews and publishes one, and only then does the manifest
# flip to released and the announcement fire — release-finalize and
# release-announce, both on the `release: published` event. Nothing is claimed
# released before it is. Maintainer-only; dry_run defaults on.
#
# A version that cuts a repository building one of the stack's own images is
# executed twice (ADR-0033 §4). The first run tags those repositories and stops.
# Once the stack pins the image each tag published, and the core's submodule
# embeds that stack, the second run checks those pins and tags everything else.
# `train_step.py` reads which run this is from the repositories themselves.
name: execute-version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to execute, e.g. 0.1.0 — its versions/<v>.toml must be staged, in_progress or releasable."
        required: true
      dry_run:
        description: "Run the gate and compat checks but tag nothing."
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  # Every registered plugin riding this version, proved with the candidate build of
  # the core commit this run is about to tag (OPS-R68, OPS-R72). The job tagging it
  # holds its checkout of the core at the commit settled here.
  #
  # Its own job, ahead of the one that mints the release App token, and holding no
  # secret: building the core runs every dependency's build script, which does not
  # belong beside a token that can tag every repository. The build is most of the
  # run's time.
  plugins:
    # The host the core's release builds its Linux archive on, so the candidate
    # links against what the release's binary links against.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      core: ${{ steps.prove.outputs.core }}
    steps:
      - name: Gate to maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          case "$perm" in
            admin|maintain) echo "${ACTOR} is a maintainer (${perm})." ;;
            *) echo "::error::${ACTOR} lacks maintainer permission (${perm})."; exit 1 ;;
          esac
      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every registered plugin, proved with the candidate (OPS-R68, OPS-R72)
        id: prove
        uses: ./.github/actions/prove-plugins
        with:
          version: ${{ inputs.version }}

  execute:
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the version string
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }
      - name: Mint the release App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - name: Read the manifest and clone its repos
        id: read
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          man="70-operations/versions/${VERSION}.toml"
          [ -f "$man" ] || { echo "::error::no manifest at ${man}"; exit 1; }
          echo "manifest=${man}" >> "$GITHUB_OUTPUT"
          python3 - "$man" <<'PY'
          import sys, tomllib
          sys.path.insert(0, "scripts")
          from patterns import IN_FLIGHT
          st = tomllib.load(open(sys.argv[1], "rb")).get("status")
          if st not in IN_FLIGHT:
              sys.exit(f"::error::{sys.argv[1]} is '{st}', not {'/'.join(IN_FLIGHT)}")
          PY
          # Two lists, because they answer two questions (OPS-R58). `repos.txt`
          # is what gets tagged; `searched.txt` is where the gate reads commit
          # messages. They coincide for most versions and must not be assumed to.
          python3 scripts/manifest_repos.py --version "$VERSION" --for cut > repos.txt
          python3 scripts/manifest_repos.py --version "$VERSION" --for searched > searched.txt
          # Cloned by the union, since a repository may be in either list: one
          # that is only cut still has to be tagged, and one that is only
          # searched still has to be read.
          sort -u repos.txt searched.txt > needed.txt
          while read -r r; do
            [ -n "$r" ] || continue
            # Whole history, no file contents: the gate reads every commit
            # message and only the checked-out tree, and a citation it cannot
            # see reads as work never done.
            git clone --quiet --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "checkouts/${r}"
          done < needed.txt
      - name: Hold the core at the commit its plugins were proved with (OPS-R68)
        env:
          CORE: ${{ needs.plugins.outputs.core }}
        run: |
          set -euo pipefail
          # Every check below, and the tag, reads this checkout. The default branch
          # may have moved since the plugins were proved, and a tag on a commit they
          # were not proved with would carry a verdict about another build.
          if [[ ! "$CORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the plugin gate settled no core commit: '${CORE}'"
            exit 1
          fi
          git -C checkouts/lemonfiber checkout --quiet --detach "$CORE"
          echo "lemonfiber held at ${CORE:0:8}, the commit its plugins were proved with."
      - name: Which step of the train this run is (ADR-0033 §4)
        id: step
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/train_step.py --version "$VERSION" --tag "v${VERSION}"
      - name: Gate — every goal satisfied (OPS-R34)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=()
          while read -r r; do [ -n "$r" ] && args+=(--repo "${r}=checkouts/${r}"); done < searched.txt
          python3 scripts/gate.py --manifest "70-operations/versions/${VERSION}.toml" \
            "${args[@]}" --status "checkouts/lemonfiber/IMPLEMENTATION-STATUS.md"
      - name: Gate — no requirement it locks is unbuilt (OPS-R54)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_no_stubs.py --version "$VERSION" \
            --status "checkouts/lemonfiber/IMPLEMENTATION-STATUS.md"
      - name: Cross-stream compatibility (OPS-R35)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # What ships is the submodule the binary embeds, not whatever the
          # stack repository's default branch happens to hold. The submodule is
          # always present, so this cannot pass by finding nothing.
          git -C checkouts/lemonfiber submodule update --init --depth 1 assets/media-stack
          stack="checkouts/lemonfiber/assets/media-stack/stack.toml"
          if [ ! -f "$stack" ]; then
            echo "::error::the embedded stack carries no stack.toml"
            exit 1
          fi

          mincli=$(sed -nE 's/^min_cli_version[[:space:]]*=[[:space:]]*"(.*)".*/\1/p' "$stack" | head -1)
          schema=$(sed -nE 's/^schema_version[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$stack" | head -1)
          if [ -z "$mincli" ] || [ -z "$schema" ]; then
            echo "::error::the embedded stack declares no min_cli_version or schema_version"
            exit 1
          fi

          # The binary version must be >= the stack's declared minimum.
          if [ "$(printf '%s\n%s\n' "$mincli" "$VERSION" | sort -V | head -1)" != "$mincli" ]; then
            echo "::error::stack needs cli >= ${mincli}, releasing ${VERSION}"
            exit 1
          fi

          # And the binary must read the schema the stack is written in.
          reads=$(sed -nE 's/^pub const SCHEMA_VERSION: u32 = ([0-9]+);.*/\1/p' \
            checkouts/lemonfiber/crates/lemonfiber-manifest/src/lib.rs | head -1)
          if [ -z "$reads" ]; then
            echo "::error::could not read the binary's schema version"
            exit 1
          fi
          if [ "$schema" != "$reads" ]; then
            echo "::error::stack is schema ${schema}, binary reads ${reads}"
            exit 1
          fi

          echo "compat ok: binary ${VERSION} >= min_cli ${mincli}, schema ${schema}"
          pin=$(git -C checkouts/lemonfiber/assets/media-stack rev-parse HEAD)
          echo "STACK_PIN=${pin}" >> "$GITHUB_ENV"
      - name: The embedded stack pins each image at this tag (ADR-0033 §4)
        if: ${{ steps.step.outputs.step == 'streams' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_image_pins.py --version "$VERSION" --tag "v${VERSION}" \
            --stack checkouts/lemonfiber/assets/media-stack/stack.toml
      - name: Check for release blockers (OPS-R44)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          { echo spec; cat needed.txt; } > allrepos.txt
          blockers=0
          while read -r repo; do
            [ -n "$repo" ] || continue
            n=$(gh issue list --repo "${OWNER}/${repo}" --state open \
              --label release-blocker --label "v${VERSION}" --json number --jq 'length')
            if [ "$n" -gt 0 ]; then
              echo "::error::${n} open release-blocker(s) labelled v${VERSION} in ${repo}"
              blockers=$((blockers + n))
            fi
          done < allrepos.txt
          [ "$blockers" -eq 0 ] || { echo "::error::release blocked — resolve the blockers first."; exit 1; }
          echo "no release blockers."
      - name: The repos declare the version being released (OPS-R35)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A tag is only worth as much as what it points at. cargo-dist releases
          # the tag whose version the workspace carries, so tagging v0.5.0 over a
          # workspace still saying 0.4.0 produces a tag nothing will build — which
          # is exactly what happened once, and cost a deleted tag to undo. Checked
          # before the dry-run boundary so a dry run catches it too. What is read is
          # every stream still to be tagged, which `train_step.py` wrote.
          mismatched=0
          while read -r r; do
            [ -n "$r" ] || continue
            man="checkouts/${r}/Cargo.toml"
            if [ ! -f "$man" ]; then
              echo "no Cargo.toml in ${r} — nothing to check."
              continue
            fi
            declared=$(python3 - "$man" <<'PY'
          import sys, tomllib
          d = tomllib.load(open(sys.argv[1], "rb"))
          print(d.get("workspace", {}).get("package", {}).get("version")
                or d.get("package", {}).get("version") or "")
          PY
            )
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::${r} declares ${declared:-nothing}, not ${VERSION} — merge the version bump before tagging"
              mismatched=$((mismatched + 1))
            else
              echo "${r} declares ${declared}."
            fi
          done < declaring.txt
          [ "$mismatched" -eq 0 ] || exit 1

      - name: Dry run — stop before tagging
        if: ${{ inputs.dry_run }}
        env:
          STEP: ${{ steps.step.outputs.step }}
        run: |
          echo "::notice title=Dry run::Gate, compat and blockers passed. This is the ${STEP} step; it would tag $(paste -sd, tagging.txt). Re-run with dry_run=false to tag."
      - name: Tag the target repos
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          while read -r r; do
            [ -n "$r" ] || continue
            sha=$(git -C "checkouts/${r}" rev-parse HEAD)
            # A run that stopped part-way through this loop is finished by running
            # it again: a repository already carrying the tag at this commit is
            # passed over. One carrying it at another commit is refused, since a
            # tag cut twice is two artefacts answering to one name.
            held=$(gh api "repos/${OWNER}/${r}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)
            if [ "$held" = "$sha" ]; then
              echo "${r} already carries ${TAG} @ ${sha:0:8}."
              continue
            fi
            if [ -n "$held" ]; then
              echo "::error::${r} carries ${TAG} at ${held:0:8}, not ${sha:0:8}"
              exit 1
            fi
            gh api --method POST "repos/${OWNER}/${r}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${sha}"
            echo "tagged ${r} @ ${sha:0:8} as ${TAG}"
          done < tagging.txt
      - name: Images tagged — run again once the core embeds them
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'images' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::notice title=Images tagged::$(paste -sd, tagging.txt) carry v${VERSION}. Once lemonfiber-media-stack pins the image each tag published and the core's submodule takes that stack, run execute-version again: it checks those pins and tags every other stream."
      - name: Tagged — publish to finish
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'streams' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::notice title=Tagged::v${VERSION} is tagged and the drafts are up. Review and publish the release — publishing flips the manifest to released, records the pins, cleans the branches, and announces to #releases (release-finalize + release-announce)."
