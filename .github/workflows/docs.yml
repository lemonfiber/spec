# Publish the redirect site that stands where the specification's book stood.
#
# The specification is rendered by website-docs.lemonfiber.app from a pinned
# revision of this repository (ADR-0015, REPO-R52). A URL the book published
# still has to resolve (REPO-R53), and GitHub Pages serves no 301, so every one
# of them gets a page that names the document's new address as canonical and
# sends a reader there.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue asks for every context `main` requires again, on its own
  # branch: `main`'s tip with the queued pull requests applied. A context that
  # never reports there is read as a wait, and the queue drops the pull request
  # at the timeout naming nothing. Nothing here reads the pull request, so on
  # this event the same checks run over the merged batch.
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate a page for every URL the book published
        run: python3 scripts/gen_redirects.py redirect

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
