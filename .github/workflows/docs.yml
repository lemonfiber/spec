# Build the spec into a docs site with mdBook and publish to GitHub Pages.
# The src/ tree is assembled from the numbered sections in CI, link-checked,
# then built — so the site never ships a broken link (Q-R58).
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest

      - name: Assemble src/ from the numbered sections
        run: |
          rm -rf src && mkdir src
          cp README.md src/README.md
          cp LICENSE.md src/LICENSE.md
          # README header/footer reference image assets in .github/
          mkdir -p src/.github
          cp .github/*.svg .github/*.png src/.github/ 2>/dev/null || true
          for d in 00-overview 10-functional 20-architecture 30-repos \
                   40-quality 50-governance 60-brand 70-operations 90-appendix; do
            [ -d "$d" ] && cp -r "$d" "src/$d"
          done
          python3 scripts/strip_frontmatter.py src
          python3 scripts/gen_summary.py src

      - name: Link check the assembled site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --accept 200,206,429 --exclude discord.gg src"
          fail: true

      - name: Build
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
