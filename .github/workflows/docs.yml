# Build the spec into a docs site with mdBook and publish to GitHub Pages.
# The src/ tree is assembled from the numbered sections in CI, link-checked,
# then built — so the site never ships a broken link (Q-R58).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Assemble src/ from the numbered sections
        run: |
          rm -rf src && mkdir src
          cp README.md src/README.md
          for d in 00-overview 10-functional 20-architecture 30-repos \
                   40-quality 50-governance 60-brand 90-appendix; do
            [ -d "$d" ] && cp -r "$d" "src/$d"
          done
          python3 scripts/gen_summary.py src

      - name: Link check the assembled site
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-mail src"
          fail: true

      - name: Build
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
