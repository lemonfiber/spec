# Approve a proposal pull request when a maintainer labels it
# `proposal:approved` (GOV-R41, GOV-R42). scripts/proposal_approve.py allocates
# the proposal's identifiers and moves its text into the specification as
# Draft, committed as the release App: onto the pull request's branch where it
# is in this repository, otherwise onto a pull request of its own crediting the
# author.
#
# It runs on `workflow_run`, from `main`, when spec's pin-only relay completes
# for a label (Q-R84): the pull request's tree is never checked out or run, and
# its proposal is read through the API as data (GOV-R43). The relay's run name
# says which label was added; the pull request can write that, so it only spares
# a runner, and `run_pull.py` reads the rest from the forge: the open pull
# request whose head is the commit the forge set on the run, carrying the label
# now, last added by an account that may write, on that head, before this run
# was created. A push after the label is a head nobody approved.
name: proposal-approve

on:
  workflow_run:
    workflows: [pin-only]
    types: [completed]

permissions:
  contents: read

# One approval at a time per branch, and never cancelled: a second label event
# waits and then finds the proposal already moved, rather than allocating the
# same identifiers twice.
concurrency:
  group: proposal-approve-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.path == '.github/workflows/pin-only-check.yml'
      && endsWith(github.event.workflow_run.display_title, ' labeled proposal:approved')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The base branch, whole: `next_id.py` reads every remote branch, so an
      # identifier allocated on an open pull request is never handed out again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The pull request carries the label, added by a maintainer who may write (GOV-R41)
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE: ${{ github.event.workflow_run.head_repository.full_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELAY: ${{ github.event.workflow_run.path }}
          STARTED: ${{ github.event.workflow_run.created_at }}
        run: >-
          python3 scripts/run_pull.py --repo="$REPO" --source="$SOURCE" --branch="$BRANCH"
          --head="$HEAD_SHA" --label=proposal:approved --roles=admin,write
          --relay="$RELAY" --started="$STARTED"

      # A commit the forge signs, a pull request whose checks run, and a comment
      # on a pull request from a fork: each takes a token other than this run's.
      - name: Mint the release App token
        if: steps.pull.outputs.approved == 'true'
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          repositories: ${{ github.event.repository.name }}

      - name: Allocate the identifiers and move the proposal in as Draft
        if: steps.pull.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
          PR_AUTHOR: ${{ steps.pull.outputs.author }}
          PR_AUTHOR_ID: ${{ steps.pull.outputs.author_id }}
          HEAD_REPO: ${{ steps.pull.outputs.head_repo }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
        run: python3 scripts/proposal_approve.py
