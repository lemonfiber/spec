# Gate the release-train scripts at 100% line coverage (Q-R61) — the same
# standard lemonfiber holds its Rust at. The suite is stdlib unittest (the repo
# has no Python dependencies); coverage.py is the only CI-only tool.
name: coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coverage.py
        run: pip install --disable-pip-version-check --only-binary :all: coverage==7.15.2
      - name: Release-train scripts at 100% coverage (Q-R61)
        run: |
          coverage run scripts/test_release_train.py
          coverage report --fail-under=100
