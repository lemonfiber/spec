# Reusable check that a pull request leaves its checks as its base runs them,
# moving spec's pins forward and nothing else, unless a maintainer approved the
# change it makes with the `workflows-approved` label (Q-R83). It runs in two
# halves, since no workflow runs on `pull_request_target` (Q-R84).
#
# The relay runs on `pull_request`, as the pull request's own copy, with no
# token and no secrets, and does nothing. Its run is the forge's record of the
# event, stamped with the head it was for:
#
#   name: pin-only
#   run-name: "#${{ github.event.pull_request.number }} ${{ github.event.action }} ${{ github.event.label.name }}"
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#   permissions: {}
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
#     cancel-in-progress: true
#   jobs:
#     pin-only:
#       runs-on: ubuntu-latest
#       timeout-minutes: 5
#       steps:
#         - run: "true"
#
# The verdict runs on `workflow_run` when the relay's run completes, from the
# default branch, which the pull request cannot rewrite, and calls this:
#
#   name: pin-only verdict
#   on:
#     workflow_run:
#       workflows: [pin-only]
#       types: [completed]
#   permissions: {}
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
#     cancel-in-progress: false
#   jobs:
#     verdict:
#       permissions:
#         actions: read
#         contents: read
#         pull-requests: read
#         statuses: write
#       uses: lemonfiber/spec/.github/workflows/pin-only.yml@<sha> # v1.0.0
#
# Called from any other event, as a caller still on `pull_request_target`
# would, it fails rather than skips: that caller's job would be the check
# branch protection reads, and a skipped check passes.
#
# A pull request rewriting its relay can only fail itself: a run the relay does
# not start is a verdict never posted, and branch protection waits for it. The
# verdict reads nothing the relay's run carries that the pull request wrote.
# It takes the head commit and the branch and repository the head came from
# from the run, which the forge sets, finds the open pull request through the
# API, and posts the check `check` names on that head, as a commit status. One
# verdict runs at a
# time for a branch, so a newer one is never overwritten by an older; a newer
# waiting replaces the one waiting before it, since each reads the pull
# request as it is when it starts.
#
# A status, because a check run this run's token posts is filed under the first
# of GitHub Actions' check suites on the head, often the relay's first run, and
# once the relay runs again on that head the forge counts only that workflow's
# newest suite, so the verdict is never counted. A status belongs to no suite.
#
# `check-source: app` posts the check as a check run of the release App, passing
# `secrets: { RELEASE_APP_KEY: ... }`, so branch protection can require the
# check from that App alone: a fork's pull request, which gets no secrets,
# cannot then answer it with a job of the same name. The job then runs behind
# the repository's `release` environment, as every reader of the key does. Where
# the App's installation is not granted Checks: write, the run posts the verdict
# as a commit status with this run's token instead, and warns; a key that mints
# no token at all fails the run. The default, `actions`, posts with this run's token, as
# every job's check is.
name: pin-only

on:
  workflow_call:
    inputs:
      relay:
        description: The relay's path, whose runs alone start a verdict and record each head.
        type: string
        default: .github/workflows/pin-only.yml
      check:
        description: The check run the verdict is posted as, the name branch protection requires.
        type: string
        default: pin-only / pin-only
      label:
        description: The label a maintainer approves a change to the checks with.
        type: string
        default: workflows-approved
      quiet:
        description: Seconds the branch must have held a head before a label approves it.
        type: number
        default: 60
      check-source:
        description: >-
          Who posts the check: `actions`, this run's token, or `app`, the release
          App, whose check a repository can require by that App alone.
        type: string
        default: actions
    secrets:
      RELEASE_APP_KEY:
        description: "The release App's key, which `check-source: app` posts with."
        required: false

permissions: {}

jobs:
  pin-only:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.path == inputs.relay)
    runs-on: ubuntu-latest
    environment: ${{ inputs.check-source == 'app' && 'release' || '' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Called as the verdict, on workflow_run
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "::error::pin-only is the verdict a relay's run starts on workflow_run; this run came from ${EVENT}, whose caller would report this job as its check, so it fails rather than skips."
            exit 1
          fi

      - name: The check is posted by `actions` or `app`
        env:
          SOURCE: ${{ inputs.check-source }}
        run: |
          case "$SOURCE" in
          actions | app) echo "The verdict is posted by ${SOURCE}." ;;
          *)
            echo "::error::check-source is ${SOURCE}, and only actions or app post a verdict."
            exit 1
            ;;
          esac

      - name: Mint the release App token
        if: inputs.check-source == 'app'
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read

      - name: The release App reads here, without the checks it cannot write
        if: inputs.check-source == 'app' && steps.app.outcome == 'failure'
        id: unposted
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: The verdict is a status where the release App may not write checks
        if: steps.unposted.outcome == 'success'
        env:
          REPO: ${{ github.repository }}
          CHECK: ${{ inputs.check }}
        run: |
          echo "::warning::The release App's installation on ${REPO} is not granted Checks: write, so ${CHECK} is posted as a commit status with this run's token."

      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the YAML reader
        run: pip install --disable-pip-version-check --only-binary ":all:" pyyaml==6.0.3

      - name: The checks are the base branch's, or spec's pins moved forward
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE: ${{ github.event.workflow_run.head_repository.full_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELAY: ${{ inputs.relay }}
          CHECK: ${{ inputs.check }}
          LABEL: ${{ inputs.label }}
          QUIET: ${{ inputs.quiet }}
          POST: ${{ steps.app.outcome == 'success' && 'check' || 'status' }}
          DETAILS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .spec-tooling/scripts/pin_only.py
          --repo="$REPO" --head="$HEAD_SHA" --source="$SOURCE" --branch="$BRANCH"
          --relay="$RELAY" --label="$LABEL" --quiet="$QUIET" --check="$CHECK" --post="$POST" --details="$DETAILS"
