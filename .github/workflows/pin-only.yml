# Reusable check that a pull request leaves its checks as its base runs them,
# moving spec's pins forward and nothing else (Q-R83). A repository calls it
# from `pull_request_target`, so the caller that runs is the base branch's and
# the pull request cannot rewrite it:
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#   jobs:
#     pin-only:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: lemonfiber/spec/.github/workflows/pin-only.yml@<sha> # v1.0.0
#
# Nothing of the pull request's is checked out or run. The script is spec's,
# from its `main`, and reads the pull request's files through the API as text.
# The token reads and writes nothing, so a pull request from a fork is judged
# the same way as one from a branch.
name: pin-only

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pin-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Under `pull_request` the caller that runs is the pull request's own copy,
      # which it can rewrite to call anything or nothing, so the answer would be
      # the pull request's to give.
      - name: Called from the base branch
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request_target" ]; then
            echo "::error::pin-only is called from pull_request_target, so the caller that runs is the base branch's; this run came from ${EVENT}."
            exit 1
          fi

      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The checks are the base branch's, or spec's pins moved forward
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .spec-canonical/scripts/pin_only.py --repo "$REPO" --number "$PR"
