# Reusable check that a pull request leaves its checks as its base runs them,
# moving spec's pins forward and nothing else, unless a maintainer approved the
# change with the `workflows-approved` label after its last push (Q-R83). A
# repository calls it from `pull_request_target`, so the caller that runs is the
# base branch's and the pull request cannot rewrite it:
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   jobs:
#     pin-only:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: lemonfiber/spec/.github/workflows/pin-only.yml@<sha> # v1.0.0
#
# `labeled` and `unlabeled` run it again when the approval is given or taken
# away. Any other label runs it too, and it answers the same: the approval is
# read from the forge's records, not from the event that started the run. A
# caller that does not list them yet takes the approval on a re-run.
#
# `synchronize` and `reopened` matter as much as `opened`. The verdict is a check
# on the head commit the event names, and branch protection asks for the check on
# the commit it would merge, so a pass on one head does not stand for the next:
# a push starts a run for the new head, and the old pass is on a commit that is
# no longer the head. The group is keyed on the pull request's number, because
# under `pull_request_target` `github.ref` is the base branch every pull request
# shares, and a push cancels the run for the head it replaced and nothing else.
#
# Nothing of the pull request's is checked out or run. The script is spec's,
# from the commit this workflow was called at, so a caller pinned at a revision
# runs that revision's script with the arguments that revision passes. It reads
# the pull request's files, labels, timeline and this check's runs through the
# API as data. The token writes nothing, so a pull
# request from a fork is judged the same way as one from a branch.
name: pin-only

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pin-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Under `pull_request` the caller that runs is the pull request's own copy,
      # which it can rewrite to call anything or nothing, so the answer would be
      # the pull request's to give.
      - name: Called from the base branch
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request_target" ]; then
            echo "::error::pin-only is called from pull_request_target, so the caller that runs is the base branch's; this run came from ${EVENT}."
            exit 1
          fi

      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The workflows are read as YAML by a loader that refuses what could make
      # one text mean two things, so a pin is judged where Actions reads it.
      - name: Install the YAML reader
        run: pip install --disable-pip-version-check --only-binary ":all:" pyyaml==6.0.3

      - name: The checks are the base branch's, or spec's pins moved forward
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The commit the event was for, which every read names; never the branch.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The calling workflow, whose runs record each head the branch had.
          CALLING: ${{ github.workflow_ref }}
        run: python3 .spec-tooling/scripts/pin_only.py --repo "$REPO" --number "$PR" --head "$HEAD_SHA" --workflow "$CALLING"
