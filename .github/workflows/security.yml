# Reusable security checks: secret scanning (gitleaks CLI) and dependency
# vulnerabilities (osv-scanner, through the action Google publishes for it).
# Q-R53, Q-R56.
#
# Dependabot reads a `uses:` and nothing else — no regular expressions, and by
# its own parser no `docker://` reference either. A version written into a `run:`
# block here is therefore a version nobody advances, and a scanner that predates
# a rule class finds fewer secrets while still reporting green.
#
# osv-scanner is called as a pinned action, which puts it back under
# `github-actions`. gitleaks cannot be: see the note over that job.
name: security

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  # `gitleaks/gitleaks-action` is not available to this org. It requires a
  # `GITLEAKS_LICENSE` secret for any repository an organisation owns — free to
  # obtain, but a per-org registration, a secret every caller of this workflow
  # would have to forward, and a licence check against a third-party server on
  # the critical path of a required gate. The action is also not open source:
  # since v2.0.0 it ships under a Gitleaks LLC end-user licence agreement, where
  # the CLI stays MIT. `gitleaks/gitleaks` itself publishes no action.
  #
  # So the CLI is fetched by hand, and the version below is watched by the step
  # that follows the scan rather than by Dependabot.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # One home for the version: the download reads it and the watch checks it.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (CLI)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 "$url" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

      # The watch. It runs after the scan, so a fault here never stands in for a
      # secret going unfound — it says only that the scanner doing the finding is
      # behind the one that exists.
      #
      # Being behind is a notice, not a failure, for the first month: a check that
      # reddens every repository the hour gitleaks cuts a release is a check people
      # route around, and the same reasoning is written over `pins` in hygiene.yml.
      # After that it is a failure, because a scanner a month stale is one nobody
      # is advancing.
      #
      # An answer that cannot be read is a failure, not a pass. A watch that says
      # nothing when it could not look is the failure it exists to prevent.
      - name: The pinned gitleaks is not far behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "30"
        run: |
          set -euo pipefail

          # `gh` prints its own error body on stdout, so a failed call arrives
          # here looking like an answer. Only a release tag with a date is
          # believed. Three attempts, because this reddens a security gate in
          # every repository and one blocked API call is not staleness.
          tag=""
          dated=""
          for attempt in 1 2 3; do
            answer=$(gh api repos/gitleaks/gitleaks/releases/latest \
              --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null || true)
            tag=$(echo "$answer" | cut -d" " -f1)
            dated=$(echo "$answer" | cut -d" " -f2)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
              [[ "$dated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              break
            fi
            tag=""
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not read the latest gitleaks release in three attempts, so this run does not know whether it scanned with a current scanner."
            exit 1
          fi

          if [ "$tag" = "v${GITLEAKS_VERSION}" ]; then
            echo "gitleaks ${GITLEAKS_VERSION} is the current release."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))
          if [ "$age" -gt "$STALE_DAYS" ]; then
            echo "::error::This scanned with gitleaks ${GITLEAKS_VERSION}; ${tag} has been out ${age} days. Raise GITLEAKS_VERSION in lemonfiber/spec .github/workflows/security.yml — rules published since ${GITLEAKS_VERSION} are not being applied to any repository."
            exit 1
          fi
          echo "::notice::gitleaks ${tag} is ${age} days old; this scanned with ${GITLEAKS_VERSION}. Raise GITLEAKS_VERSION in lemonfiber/spec .github/workflows/security.yml when convenient."

  # The action is a container action running `ghcr.io/google/osv-scanner-action`
  # at the version its own tag names, so the pin below is what fixes the scanner
  # version — and Dependabot advances it under `github-actions`.
  #
  # `--allow-no-lockfiles` is what used to be the `exit 128` arm of a hand-rolled
  # exit-code dance: a repository with no manifest to read is not a finding. The
  # action's entrypoint still maps 128 to 0 without the flag, and warns; the flag
  # says it on purpose instead.
  #
  # Upstream recommends its reusable workflow over calling this action directly,
  # because the action's behaviour may change within a patch release. Pinned by
  # SHA, such a change arrives as a Dependabot pull request that runs this gate
  # first. The reusable workflow would also demand `security-events: write` from
  # every caller, in order to file the findings on a Code Scanning page —
  # findings this job already prints, and fails on, in the run itself.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            scan
            source
            --allow-no-lockfiles
            --recursive
            ./
