# Reusable security checks: secret scanning (gitleaks CLI) and dependency
# vulnerabilities (osv-scanner, from the image Google publishes for its action).
# Q-R53, Q-R56.
#
# Dependabot reads a `uses:` and nothing else — no regular expressions, and by
# its own parser no `docker://` reference either. A version written into a `run:`
# block here is therefore a version nobody advances, and a scanner that predates
# a rule class finds fewer findings while still reporting green. Neither scanner
# here is called as an action, each for the reason written over its job, so each
# is followed by the same watch: a step that fails once the version it ran has
# been behind the latest release for a month.
name: security

on:
  workflow_call:
  pull_request:
  # A merge queue asks for every context `main` requires again, on its own
  # branch: `main`'s tip with the queued pull requests applied. A context that
  # never reports there is read as a wait, and the queue drops the pull request
  # at the timeout naming nothing. Nothing here reads the pull request, so on
  # this event the same checks run over the merged batch.
  merge_group:

permissions:
  contents: read

jobs:
  # `gitleaks/gitleaks-action` is not available to this org. It requires a
  # `GITLEAKS_LICENSE` secret for any repository an organisation owns — free to
  # obtain, but a per-org registration, a secret every caller of this workflow
  # would have to forward, and a licence check against a third-party server on
  # the critical path of a required gate. The action is also not open source:
  # since v2.0.0 it ships under a Gitleaks LLC end-user licence agreement, where
  # the CLI stays MIT. `gitleaks/gitleaks` itself publishes no action.
  #
  # So the CLI is fetched by hand, and the version below is watched by the step
  # that follows the scan rather than by Dependabot.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One home for the version: the download reads it and the watch checks it.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tool that reads what to pass over from the tree it checks would take
      # that list from the pull request it is judging, and one line there
      # silences it for the change that line came with. So each file that tells
      # it what to skip is the base branch's: a copy of the pull request's own at
      # the same path is replaced by the base's, or removed where the base has
      # none, and a change to one of them judges the pull requests after it
      # merges. On a push the branch's own copy already is the base's.
      - name: The files that say what to pass over are the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIGS: .gitleaks.toml .gitleaksignore
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is judged by the files it carries, which are its branch's own."
            exit 0
          fi
          listed="${RUNNER_TEMP}/configurations"
          said="${RUNNER_TEMP}/configuration-error"
          for name in $CONFIGS; do
            { printf '%s\0' "$name"; git ls-files -z -- ":(glob)**/${name}"; } | sort -zu > "$listed"
            while IFS= read -r -d '' path; do
              parent=$(dirname -- "$path")
              if [ -L "$parent" ]; then
                echo "::error::${parent} is a link, so ${path} would be read from wherever it points rather than from this tree."
                exit 1
              fi
              if [ ! -d "$parent" ]; then
                echo "${path}: no directory here holds it, so none is read"
                continue
              fi
              encoded=$(jq -rn --arg path "$path" '$path | split("/") | map(@uri) | join("/")')
              rm -rf -- "$path"
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/${encoded}?ref=${BASE_SHA}" > "$path" 2> "$said"; then
                echo "${path}: the base branch's copy"
              elif grep -qF "(HTTP 404)" "$said"; then
                rm -f -- "$path"
                echo "${path}: the base branch has none, so none is read"
              else
                cat "$said" >&2
                echo "::error::${path} could not be read at the base branch, so this check cannot say which list of what to pass over judges the change."
                exit 1
              fi
            done < "$listed"
          done
      - name: gitleaks (CLI)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          # Downloaded to a file rather than piped into tar, and retried.
          #
          # `curl | tar xz` reports the wrong thing when the network blips: tar
          # receives a truncated stream and says `gzip: stdin: unexpected end of
          # file`, which reads as a corrupt release. It is not — the release is
          # fine and the transfer was not. A security gate that fails with a
          # message pointing at the wrong cause is one somebody re-runs until it
          # passes, which is the habit this whole job exists to avoid.
          #
          # `--retry-all-errors` is needed alongside `--retry`: without it curl
          # retries only what it considers transient, and a connection reset
          # mid-body is not on that list.
          curl -sSfL --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -o gitleaks.tar.gz "$url"

          tar xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz

          ./gitleaks git --no-banner --redact --exit-code 1 .

      # The watch. It runs after the scan, so a fault here never stands in for a
      # secret going unfound — it says only that the scanner doing the finding is
      # behind the one that exists.
      #
      # Being behind is a notice, not a failure, for the first month: a check that
      # reddens every repository the hour gitleaks cuts a release is a check people
      # route around, and the same reasoning is written over `pins` in hygiene.yml.
      # After that it is a failure, because a scanner a month stale is one nobody
      # is advancing.
      #
      # An answer that cannot be read is a failure, not a pass. A watch that says
      # nothing when it could not look is the failure it exists to prevent.
      - name: The pinned gitleaks is not far behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "30"
          TOOL: gitleaks
          RELEASES: gitleaks/gitleaks
          KNOB: GITLEAKS_VERSION
        run: |
          set -euo pipefail

          # One watch, run after each scanner this workflow fetches by hand.
          # TOOL names it, RELEASES is where it publishes, and KNOB names the
          # variable above that holds the version it ran.
          version="${!KNOB}"

          # `gh` prints its own error body on stdout, so a failed call arrives
          # here looking like an answer. Only a release tag with a date is
          # believed. Three attempts, because this reddens a security gate in
          # every repository and one blocked API call is not staleness.
          tag=""
          dated=""
          for attempt in 1 2 3; do
            answer=$(gh api "repos/${RELEASES}/releases/latest" \
              --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null || true)
            tag=$(echo "$answer" | cut -d" " -f1)
            dated=$(echo "$answer" | cut -d" " -f2)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
              [[ "$dated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              break
            fi
            tag=""
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not read the latest ${TOOL} release in three attempts, so this run does not know whether it scanned with a current scanner."
            exit 1
          fi

          if [ "$tag" = "v${version}" ]; then
            echo "${TOOL} ${version} is the current release."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))
          if [ "$age" -gt "$STALE_DAYS" ]; then
            echo "::error::This scanned with ${TOOL} ${version}; ${tag} has been out ${age} days. Raise ${KNOB} in lemonfiber/spec .github/workflows/security.yml — what ${TOOL} has learnt since ${version} is not being applied to any repository."
            exit 1
          fi
          echo "::notice::${TOOL} ${tag} is ${age} days old; this scanned with ${version}. Raise ${KNOB} in lemonfiber/spec .github/workflows/security.yml when convenient."

  # osv-scanner runs from the image Google publishes for its action, by digest,
  # in a container this step starts itself. The action would start it with the
  # tree mounted writable and the job's environment files mounted beside it, so
  # whatever ran in the container could set what every later step of `gates`
  # runs. Here the container is handed the tree read-only and nothing else: no
  # token, no file of the job's, no capability. It keeps its network, which is
  # how it asks OSV about each package it reads.
  #
  # `--no-call-analysis=all` keeps the scan to reading manifests and lockfiles.
  # Call analysis builds the tree's code to see what it calls: the image is built
  # on golang and analyses Go by default, and Rust's analysis runs build scripts.
  #
  # `--allow-no-lockfiles`: a repository with no manifest to read is not a
  # finding.
  #
  # Dependabot reads no version out of a `run:` block, so the version is watched
  # by the step after the scan, as gitleaks' is. OSV_IMAGE carries OSV_VERSION
  # as its tag and pins the digest that tag named when it was written.
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: "2.6.0"
      OSV_IMAGE: ghcr.io/google/osv-scanner-action:v2.6.0@sha256:71ad04ab2f8798be47870f9b18817ad317c2f8f2f97aa6726ba10d5578bc174a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tool that reads what to pass over from the tree it checks would take
      # that list from the pull request it is judging, and one line there
      # silences it for the change that line came with. So each file that tells
      # it what to skip is the base branch's: a copy of the pull request's own at
      # the same path is replaced by the base's, or removed where the base has
      # none, and a change to one of them judges the pull requests after it
      # merges. On a push the branch's own copy already is the base's.
      - name: The files that say what to pass over are the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIGS: osv-scanner.toml .gitignore
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is judged by the files it carries, which are its branch's own."
            exit 0
          fi
          listed="${RUNNER_TEMP}/configurations"
          said="${RUNNER_TEMP}/configuration-error"
          for name in $CONFIGS; do
            { printf '%s\0' "$name"; git ls-files -z -- ":(glob)**/${name}"; } | sort -zu > "$listed"
            while IFS= read -r -d '' path; do
              parent=$(dirname -- "$path")
              if [ -L "$parent" ]; then
                echo "::error::${parent} is a link, so ${path} would be read from wherever it points rather than from this tree."
                exit 1
              fi
              if [ ! -d "$parent" ]; then
                echo "${path}: no directory here holds it, so none is read"
                continue
              fi
              encoded=$(jq -rn --arg path "$path" '$path | split("/") | map(@uri) | join("/")')
              rm -rf -- "$path"
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/${encoded}?ref=${BASE_SHA}" > "$path" 2> "$said"; then
                echo "${path}: the base branch's copy"
              elif grep -qF "(HTTP 404)" "$said"; then
                rm -f -- "$path"
                echo "${path}: the base branch has none, so none is read"
              else
                cat "$said" >&2
                echo "::error::${path} could not be read at the base branch, so this check cannot say which list of what to pass over judges the change."
                exit 1
              fi
            done < "$listed"
          done
      - name: OSV-Scanner
        run: |
          set -euo pipefail
          docker run --rm \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "${GITHUB_WORKSPACE}:/src:ro" --workdir /src \
            --entrypoint /root/osv-scanner \
            "$OSV_IMAGE" \
            scan source --allow-no-lockfiles --no-call-analysis=all --recursive ./
      - name: The pinned OSV-Scanner is not far behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "30"
          TOOL: OSV-Scanner
          RELEASES: google/osv-scanner-action
          KNOB: OSV_VERSION
        run: |
          set -euo pipefail

          # One watch, run after each scanner this workflow fetches by hand.
          # TOOL names it, RELEASES is where it publishes, and KNOB names the
          # variable above that holds the version it ran.
          version="${!KNOB}"

          # `gh` prints its own error body on stdout, so a failed call arrives
          # here looking like an answer. Only a release tag with a date is
          # believed. Three attempts, because this reddens a security gate in
          # every repository and one blocked API call is not staleness.
          tag=""
          dated=""
          for attempt in 1 2 3; do
            answer=$(gh api "repos/${RELEASES}/releases/latest" \
              --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null || true)
            tag=$(echo "$answer" | cut -d" " -f1)
            dated=$(echo "$answer" | cut -d" " -f2)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
              [[ "$dated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              break
            fi
            tag=""
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not read the latest ${TOOL} release in three attempts, so this run does not know whether it scanned with a current scanner."
            exit 1
          fi

          if [ "$tag" = "v${version}" ]; then
            echo "${TOOL} ${version} is the current release."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))
          if [ "$age" -gt "$STALE_DAYS" ]; then
            echo "::error::This scanned with ${TOOL} ${version}; ${tag} has been out ${age} days. Raise ${KNOB} in lemonfiber/spec .github/workflows/security.yml — what ${TOOL} has learnt since ${version} is not being applied to any repository."
            exit 1
          fi
          echo "::notice::${TOOL} ${tag} is ${age} days old; this scanned with ${version}. Raise ${KNOB} in lemonfiber/spec .github/workflows/security.yml when convenient."
