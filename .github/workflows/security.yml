# Reusable security checks: secret scanning (gitleaks CLI) and dependency
# vulnerabilities (osv-scanner CLI). Both free for orgs — the gitleaks *action*
# requires a paid org licence, the CLI does not. Q-R53, Q-R56.
name: security

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (CLI)
        run: |
          ver="8.30.1"
          curl -sSfL --proto '=https' --tlsv1.2 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_${ver}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: OSV-Scanner (CLI)
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          # exit 128 = no packages found (nothing to scan) -> treat as pass.
          # `|| code=$?` keeps the runner's `set -e` from aborting on non-zero.
          code=0
          ./osv-scanner scan source --recursive . || code=$?
          if [ "$code" = "128" ]; then echo "no package sources; nothing to scan"; exit 0; fi
          exit "$code"
