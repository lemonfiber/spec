# Publish a site to GitHub Pages and, once the organisation holds the
# Cloudflare secrets, to an assets-only Cloudflare Worker.
# The site is built once, by the command the caller names, and the same build
# goes to both.
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#     repository_dispatch:
#       types: [rebuild-site]
#   permissions: {}
#   concurrency:
#     group: pages
#     cancel-in-progress: false
#   jobs:
#     site:
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#       uses: lemonfiber/spec/.github/workflows/site-deploy.yml@<sha> # vX.Y.Z
#       with:
#         worker: website-docs
#         compatibility-date: "2026-10-09"
#         submodules: true
#         build: |
#           npm run messages
#           npm run build
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#
# The concurrency stays with the caller: one deploy at a time and never one
# cancelled, and a reusable that declared the same group would wait on its own
# caller.
name: site-deploy

on:
  workflow_call:
    inputs:
      build:
        description: "The shell that builds the site into dist/, run after `npm ci --ignore-scripts`."
        type: string
        required: true
      submodules:
        description: "Whether the build reads the repositories checked out under vendor/."
        type: boolean
        default: false
      worker:
        description: "The Cloudflare Worker the build is uploaded to, such as `website-docs`."
        type: string
        required: true
      compatibility-date:
        description: "The Workers compatibility date, YYYY-MM-DD."
        type: string
        required: true
      not-found-handling:
        description: "What a path with no file answers: 404-page, single-page-application or none."
        type: string
        default: 404-page
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

jobs:
  # Only the default branch publishes, for a push, a dispatch, a schedule or a
  # sibling's rebuild. A pull request's branch, whatever its event, never
  # reaches the build whose output the deploy jobs publish, nor the jobs that
  # hold the Pages token and the Cloudflare secrets.
  authorised:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Only the default branch publishes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push | workflow_dispatch | schedule | repository_dispatch) ;;
            *)
              echo "::error::a site publishes for a push, a dispatch, a schedule or a rebuild, never for ${EVENT}."
              exit 1
              ;;
          esac
          default=$(gh api "repos/${REPO}" --jq .default_branch)
          if [ -z "$default" ] || [ "$REF" != "refs/heads/${default}" ]; then
            echo "::error::${REF} is not the default branch${default:+ ${default}}, so nothing is published from it."
            exit 1
          fi

  build:
    needs: authorised
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The repositories under `vendor/`, and not the submodules they carry
          # themselves: the nested ones are never read.
          submodules: ${{ inputs.submodules }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # The site's own build, which leaves the site in `dist/`. It is handed the
      # job's read-only token, for a build that reads the organisation or the
      # repository's releases.
      - name: Build the site
        env:
          BUILD: ${{ inputs.build }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$BUILD"

      # The same build, for the Cloudflare job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Uploads the build to the assets-only Worker named below. Until the
  # organisation holds the Cloudflare secrets, the job says so and stops, so a
  # run without them publishes to GitHub Pages alone and stays green.
  #
  # Nothing of the repository's tree reaches this job. Wrangler would run a
  # `build` its configuration names, and a configuration file read from the
  # tree is one a parser here could read differently from wrangler's. So the
  # configuration is written here from the caller's inputs, each matched
  # against a closed pattern, into a directory holding nothing else but the
  # build `build` uploaded, and wrangler is pointed at it by path. It names
  # no `main` and no `build`, so wrangler uploads the static assets and runs
  # nothing. The secrets go to wrangler and to no other step.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Whether the Cloudflare secrets are set
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Cloudflare::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so this run published to GitHub Pages only."
          fi

      - name: The worker's configuration, from the caller's inputs alone
        id: config
        if: steps.secrets.outputs.set == 'true'
        env:
          WORKER: ${{ inputs.worker }}
          COMPATIBILITY: ${{ inputs.compatibility-date }}
          NOT_FOUND: ${{ inputs.not-found-handling }}
        run: |
          set -euo pipefail
          here="${RUNNER_TEMP}/worker"
          mkdir -p "$here"
          python3 -I - "$here/wrangler.json" <<'PY'
          import json, os, re, sys

          worker = os.environ["WORKER"]
          compatibility = os.environ["COMPATIBILITY"]
          not_found = os.environ["NOT_FOUND"]
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", worker):
              sys.exit(f"::error::{worker!r} is not a worker name.")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", compatibility):
              sys.exit(f"::error::{compatibility!r} is not a compatibility date.")
          if not_found not in ("404-page", "single-page-application", "none"):
              sys.exit(f"::error::{not_found!r} is not a not-found handling wrangler knows.")
          config = {
              "name": worker,
              "compatibility_date": compatibility,
              "assets": {
                  "directory": "./dist",
                  "html_handling": "auto-trailing-slash",
                  "not_found_handling": not_found,
              },
              "workers_dev": True,
              "preview_urls": False,
          }
          with open(sys.argv[1], "w", encoding="utf-8") as out:
              json.dump(config, out, indent=2)
          PY
          echo "dir=${here}" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - if: steps.secrets.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ steps.config.outputs.dir }}/dist

      - if: steps.secrets.outputs.set == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: ${{ steps.config.outputs.dir }}
          command: deploy --config wrangler.json
