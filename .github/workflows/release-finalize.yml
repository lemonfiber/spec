# Finish a release once its draft is published — OPS-R35, OPS-R52, OPS-R55,
# OPS-R57.
#
# `execute-version` tags and stops; the drafts it produces are reviewed and
# published by a person. This is what happens after that: the manifest records
# what was actually shipped, the day it went out, every submodule commit the
# release embedded is pinned so the version is reproducible rather than merely
# named, and the roadmap the website serves is regenerated so the public page and
# the manifest cannot disagree.
#
# Until this existed the whole step was manual, and a version left at
# `releasable` blocks the next one from being staged (OPS-R52) — so forgetting it
# does not merely leave the record stale, it stops the train.
#
# Fired by the binary repo on `release: published`, which is why it is a
# `repository_dispatch` here rather than a `release` trigger: the event happens
# there and the record lives here.
name: release-finalize

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version that was published, e.g. 0.4.0."
        required: true
      stack_pin:
        description: "The lemonfiber-media-stack commit the release embedded. Read from the tag when omitted; every other embedded submodule is read from the tag either way."
        required: false
      released_on:
        description: "UTC date the release was published, YYYY-MM-DD. Read from the release when omitted."
        required: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the release App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Settle the version and the pins
        id: what
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
          PIN: ${{ inputs.stack_pin || github.event.client_payload.stack_pin }}
          WHEN: ${{ inputs.released_on || github.event.client_payload.released_on }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }

          # The version whose goals this shipped, which is not always the tag it
          # shipped under. A minor whose release run fails part-way is finished by
          # a patch, and there is no manifest per patch: a patch delivers no goals
          # of its own, and a manifest for it would be another version the serial
          # train has to walk past. So a tag with no manifest of its own records
          # the line it belongs to.
          #
          # Until this was here, 0.9.1 arrived, found no 0.9.1.toml and stopped —
          # leaving 0.9.0 at `staged`, which by OPS-R52 blocks the next version
          # from being staged at all. The record was not merely stale; the train
          # was stopped, which is the failure this whole workflow exists to end.
          line="$VERSION"
          man="70-operations/versions/${line}.toml"
          if [ ! -f "$man" ]; then
            line="${VERSION%.*}.0"
            man="70-operations/versions/${line}.toml"
            [ -f "$man" ] || { echo "::error::no manifest for ${VERSION} or its line ${line}"; exit 1; }
            echo "::notice::${VERSION} is a patch; recording it against ${line}."
          fi
          # Said only where they differ, so a manifest recording its own tag is
          # not given a second name for it.
          shipped_as=""
          if [ "$line" != "$VERSION" ]; then
            shipped_as="$VERSION"
          fi

          # What the release actually embedded, read from the tag itself rather
          # than from whatever main points at now — a pin that drifts is worse
          # than no pin, because it claims to be reproducible.
          #
          # Enumerated from the tag's own `.gitmodules` rather than named here.
          # This step spelled out `assets/media-stack` while that was the only
          # submodule, and went on recording only that one after ADR-0012 added
          # `assets/web`: 0.10.0 shipped a manifest that did not say which build
          # of the web app went out with it. OPS-R35 asks for the pins, plural.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${OWNER}/lemonfiber/contents/.gitmodules?ref=v${VERSION}" \
            | python3 scripts/submodule_pins.py > modules.tsv

          recorded_pins=()
          overrode=false
          while IFS=$'\t' read -r name where; do
            # `stack_pin` supplies the stack's commit on the dispatch path; every
            # other submodule is read from the tag either way.
            sha=""
            if [ "$name" = "lemonfiber-media-stack" ]; then
              sha="$PIN"
              if [ -n "$sha" ]; then
                overrode=true
              fi
            fi
            if [ -z "$sha" ]; then
              sha=$(gh api "repos/${OWNER}/lemonfiber/contents/${where}?ref=v${VERSION}" --jq '.sha')
            fi
            # Checked to be a commit, not merely present. One of these arrives
            # from a dispatch payload, and every one of them is written into the
            # manifest verbatim, so what a pin is allowed to be is worth saying
            # rather than assuming.
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
              || { echo "::error::${name}'s pin is not a sha: '${sha}'"; exit 1; }
            recorded_pins+=("${name}=${sha}")
          done < modules.tsv
          # A `stack_pin` that overrode nothing is a caller naming a submodule
          # this tag does not embed, and silence would drop the commit it meant
          # to record — which is the defect this whole step exists to end.
          if [ -n "$PIN" ] && [ "$overrode" = false ]; then
            echo "::error::v${VERSION} embeds no lemonfiber-media-stack for stack_pin to override"
            exit 1
          fi
          pins="${recorded_pins[*]}"

          # The day the release went out, read from the release itself. This runs
          # on publish, so `published_at` is set and is the moment being recorded;
          # it is RFC 3339 in UTC, and the manifest keeps the date.
          when="$WHEN"
          if [ -z "$when" ]; then
            when=$(gh api "repos/${OWNER}/lemonfiber/releases/tags/v${VERSION}" --jq '.published_at')
          fi
          when="${when%%T*}"
          printf '%s' "$when" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "::error::could not read the date v${VERSION} was published"; exit 1; }
          # Publishing the same release twice fires this twice. The transition
          # writes only files whose content changed, so a second run would put no
          # commit on the branch and then fail opening a pull request with nothing
          # in it. Cheaper to notice here and do nothing.
          # An `if`, not `grep ... && recorded=true`: under `set -e` an AND-list
          # whose last command fails takes the whole step with it, so the ordinary
          # case — a version not yet released — would exit here.
          recorded=false
          if grep -Eq '^status[[:space:]]*=[[:space:]]*"released"' "$man"; then
            recorded=true
          fi
          {
            echo "version=${line}"
            echo "released_as=${shipped_as}"
            echo "pins=${pins}"
            echo "released_on=${when}"
            echo "recorded=${recorded}"
          } >> "$GITHUB_OUTPUT"
          if [ "$recorded" = true ]; then
            echo "::notice::${line} is already recorded as released; nothing to do."
          fi

      # Through the shared transition, not by hand. It writes the manifest with
      # `set_status` (pins included), regenerates the roadmap table and the board
      # that a status change makes stale, and commits through the contents API —
      # where GitHub fills in the author from the token and marks the commit
      # verified.
      #
      # That last part is why this is not a `git commit`. `main` requires signed
      # commits, and a runner has no key, so every record this workflow opened by
      # hand was unmergeable: 0.7.0's sat blocked until someone amended the commit
      # to sign it, and 0.6.0's only went in because a rebase happened to re-sign
      # it. The comment that used to sit here said unsigned was fine because the
      # squash merge is signed by GitHub — but the rule is checked against the
      # pull request's own commits, not the merge it produces.
      - name: Record it as released, with what it shipped
        if: steps.what.outputs.recorded != 'true'
        uses: ./.github/actions/manifest-transition
        with:
          version: ${{ steps.what.outputs.version }}
          status: released
          pins: ${{ steps.what.outputs.pins }}
          released_on: ${{ steps.what.outputs.released_on }}
          released_as: ${{ steps.what.outputs.released_as }}
          token: ${{ steps.token.outputs.token }}

      # An open issue about a version should mean something is still owed on it,
      # and that stops being true the moment the version ships. The watchdog's
      # drift issue is the one kind left; found by title rather than by number,
      # because the number is known only to the watchdog, which may never have
      # run for a given version.
      - name: Close the drift issues this version left
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          # Searched on words rather than on the exact title. GitHub's search
          # tokenises, and the drift issue's title leads with an emoji — a poor
          # search term, and the one whose absence would silently match nothing.
          words="Release ${VERSION} drift"
          gh issue list --repo "${OWNER}/spec" --state open \
            --search "${words} in:title" --json number --jq '.[].number' \
          | while read -r number; do
              echo "closing #${number} — ${words}"
              gh issue close "${number}" --repo "${OWNER}/spec" \
                --comment "${VERSION} is released. Closing what its watchdog opened."
            done
