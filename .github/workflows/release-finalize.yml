# Finish a release once its draft is published — OPS-R35, OPS-R45, OPS-R52, OPS-R55.
#
# `execute-version` tags and stops; the drafts it produces are reviewed and
# published by a person. This is what happens after that: the manifest records
# what was actually shipped, the stack commit the release embedded is pinned so
# the version is reproducible rather than merely named, and the roadmap the
# website serves is regenerated so the public page and the manifest cannot
# disagree.
#
# Until this existed the whole step was manual, and a version left at
# `releasable` blocks the next one from being staged (OPS-R52) — so forgetting it
# does not merely leave the record stale, it stops the train.
#
# Fired by the binary repo on `release: published`, which is why it is a
# `repository_dispatch` here rather than a `release` trigger: the event happens
# there and the record lives here.
name: release-finalize

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version that was published, e.g. 0.4.0."
        required: true
      stack_pin:
        description: "The media-stack commit the release embedded. Read from the tag when omitted."
        required: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Mint the release App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Settle the version and the pin
        id: what
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
          PIN: ${{ inputs.stack_pin || github.event.client_payload.stack_pin }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }
          man="70-operations/versions/${VERSION}.toml"
          [ -f "$man" ] || { echo "::error::no manifest at ${man}"; exit 1; }

          # The stack the release actually embedded, read from the tag itself
          # rather than from whatever main points at now — a pin that drifts is
          # worse than no pin, because it claims to be reproducible.
          pin="$PIN"
          if [ -z "$pin" ]; then
            pin=$(gh api "repos/${OWNER}/lemonfiber/contents/assets/media-stack?ref=v${VERSION}" --jq '.sha')
          fi
          [ -n "$pin" ] || { echo "::error::could not read the embedded stack commit"; exit 1; }
          # Publishing the same release twice fires this twice. The transition
          # writes only files whose content changed, so a second run would put no
          # commit on the branch and then fail opening a pull request with nothing
          # in it. Cheaper to notice here and do nothing.
          # An `if`, not `grep ... && recorded=true`: under `set -e` an AND-list
          # whose last command fails takes the whole step with it, so the ordinary
          # case — a version not yet released — would exit here.
          recorded=false
          if grep -Eq '^status[[:space:]]*=[[:space:]]*"released"' "$man"; then
            recorded=true
          fi
          {
            echo "version=${VERSION}"
            echo "pin=${pin}"
            echo "recorded=${recorded}"
          } >> "$GITHUB_OUTPUT"
          if [ "$recorded" = true ]; then
            echo "::notice::${VERSION} is already recorded as released; nothing to do."
          fi

      # Through the shared transition, not by hand. It writes the manifest with
      # `set_status` (pins included), regenerates the roadmap table and the board
      # that a status change makes stale, and commits through the contents API —
      # where GitHub fills in the author from the token and marks the commit
      # verified.
      #
      # That last part is why this is not a `git commit`. `main` requires signed
      # commits, and a runner has no key, so every record this workflow opened by
      # hand was unmergeable: 0.7.0's sat blocked until someone amended the commit
      # to sign it, and 0.6.0's only went in because a rebase happened to re-sign
      # it. The comment that used to sit here said unsigned was fine because the
      # squash merge is signed by GitHub — but the rule is checked against the
      # pull request's own commits, not the merge it produces.
      - name: Record it as released, with what it shipped
        if: steps.what.outputs.recorded != 'true'
        uses: ./.github/actions/manifest-transition
        with:
          version: ${{ steps.what.outputs.version }}
          status: released
          pins: media-stack=${{ steps.what.outputs.pin }}
          token: ${{ steps.token.outputs.token }}

      # An open issue about a version should mean something is still owed on it,
      # and that stops being true the moment the version ships. Found by title
      # rather than by number: the tracker's number is known only to the workflow
      # that opened it, the drift issue's only to the watchdog, and either may
      # never have run for a given version.
      - name: Close what this version opened
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          # Searched on words rather than on the exact title. GitHub's search
          # tokenises, and the drift issue's title leads with an emoji — a poor
          # search term, and the one whose absence would silently match nothing.
          # Every term must appear, so "Release 0.7.0 tracker" cannot reach the
          # drift issue and vice versa.
          for words in "Release ${VERSION} tracker" "Release ${VERSION} drift"; do
            gh issue list --repo "${OWNER}/spec" --state open \
              --search "${words} in:title" --json number --jq '.[].number' \
            | while read -r number; do
                echo "closing #${number} — ${words}"
                gh issue close "${number}" --repo "${OWNER}/spec" \
                  --comment "${VERSION} is released. Closing what its staging opened."
              done
          done

      # Seeded from the next planned manifest rather than from requirement status,
      # which is not machine-readable per identifier — and the manifest is the
      # better source anyway: it is the list somebody deliberately chose for that
      # version, where "everything Accepted and unshipped" is a pile.
      - name: Open the next version's planning issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib

          OWNER = os.environ["OWNER"]
          SHIPPED = os.environ["VERSION"]

          def ordered(name):
              return tuple(int(part) for part in name.split("."))

          # The lowest planned version above the one just shipped. Sorted as
          # numbers, because as text 0.10.0 sorts below 0.9.0.
          planned = []
          for manifest in pathlib.Path("70-operations/versions").glob("*.toml"):
              if manifest.stem == "TEMPLATE":
                  continue
              data = tomllib.loads(manifest.read_text(encoding="utf-8"))
              if data.get("status") == "planned":
                  planned.append((ordered(manifest.stem), data))
          planned.sort(key=lambda pair: pair[0])
          nxt = next((data for order, data in planned if order > ordered(SHIPPED)), None)
          if nxt is None:
              print("nothing planned after this one."); raise SystemExit(0)

          title = f"Plan {nxt['version']} — {nxt.get('delivers', 'the next version')}"
          found = subprocess.run(
              ["gh", "issue", "list", "--repo", f"{OWNER}/spec", "--state", "all",
               "--search", f"{title} in:title", "--json", "number", "--jq", ".[0].number // empty"],
              capture_output=True, text=True)
          if found.stdout.strip():
              print(f"already opened as #{found.stdout.strip()}."); raise SystemExit(0)

          goals = "\n".join(f"- [ ] `{goal}`" for goal in nxt.get("goals", []))
          body = (
              f"{SHIPPED} is out, so {nxt['version']} is next.\n\n"
              f"**{nxt.get('delivers', '')}**\n\n"
              f"Milestone {nxt.get('milestone', '—')}, {len(nxt.get('goals', []))} goals as the "
              f"manifest froze them. This issue is for planning; staging opens the tracker that "
              f"burns them down.\n\n{goals}\n"
          )
          subprocess.run(
              ["gh", "issue", "create", "--repo", f"{OWNER}/spec",
               "--title", title, "--body", body],
              check=False)
          print(f"opened planning for {nxt['version']}.")
          PY
