# Publish a Rust service's image from every commit on main and from each tag the
# release train cuts (ADR-0033 §3, §4; OPS-R90, OPS-R91).
#
# A push to `main` publishes the commit as `main-<12 hex>`, and a tag `vX.Y.Z`, or
# `vX.Y.Z-<identifier>` for a pre-release, on a commit `main` holds publishes that
# tag. A push to `main` whose change from the commit before it is only a pin's, at
# most `plugin.toml`, `proofs.json`, `targets.toml` and what is under `recordings/`,
# publishes nothing, so merging a pin's pull request never starts the next one
# (OPS-R90). The push's commits before and after are compared here, so a caller
# needs no path filter of its own.
#
# Each platform is built on a runner of its own architecture and pushed by digest;
# the two are joined under one multi-architecture index at
# `ghcr.io/lemonfiber/<service>:<tag>`, which carries BuildKit's SBOM and
# provenance, and gets a build-provenance attestation and an SBOM attestation per
# platform from GitHub. The index digest is recorded in the run summary.
#
# The repository declares its service in a `plugin.toml` of its own (ADR-0045 §1),
# which is what pins the image and what the bundle takes, and one without it
# publishes nothing, unless it says `pins: bundle`: an image no plugin declares, such
# as the fence's, holds no plugin.toml, and the bundle's own table for its service
# pins it, moved by `bundle-image-pin` on each commit image and train tag (ARCH-R363,
# OPS-R94).
# `manifest-pin` proposes each published image as the one its services run, with
# every recording the manifest names taken again from it and `proofs.json` written
# from them: a commit image on the rolling
# `release/image-commit-pin` branch, and a train tag, at the version the manifest
# declares, on `release/image-pin`. So a service's own run proofs are taken from
# the image `main` builds before any release is cut. A commit image is never
# announced.
#
# Building, publishing and attesting hold the run's own token and nothing of the
# caller's secrets; the release App's key reaches only the jobs of `manifest-pin`
# that hold it, which run nothing of the repository's.
#
# The service id is the calling repository's name without `lemonfiber-`
# (ADR-0033 §1), so every image repository calls this with nothing to say:
#
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#   permissions:
#     contents: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: false
#   jobs:
#     release:
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#       uses: lemonfiber/spec/.github/workflows/rust-service-release.yml@<sha> # vX.Y.Z
#       secrets:
#         RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
#
# The concurrency stays with the caller: one publish per ref, never cancelled, and a
# reusable that declared the same group would wait on its own caller.
name: rust-service-release
on:
  workflow_call:
    inputs:
      pins:
        description: >-
          Where the image's pin lives: `manifest`, the repository's own plugin.toml,
          which `manifest-pin` moves; or `bundle`, a table of the bundle's own named for
          the service, which `bundle-image-pin` moves on each commit image and train
          tag, for an image no
          plugin declares, such as the fence's. A `bundle` repository holds no
          plugin.toml.
        type: string
        default: manifest
    secrets:
      RELEASE_APP_KEY:
        description: "Private key of the release App, which is what may write the manifest's pin."
        required: true
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/lemonfiber
  # Pinned by digest like every other image the build runs: the builder that
  # writes the attestations, and the scanner that writes the SBOM.
  BUILDKIT: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  SBOM_SCANNER: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.what.outputs.image }}
      tag: ${{ steps.what.outputs.tag }}
      kind: ${{ steps.what.outputs.kind }}
      service: ${{ steps.what.outputs.service }}
      publish: ${{ steps.what.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
          persist-credentials: false
      - name: A commit on main, or a tag the train cuts on main at the version the crate and its manifest declare
        id: what
        env:
          NAME: ${{ github.ref_name }}
          KIND: ${{ github.ref_type }}
          REPO: ${{ github.event.repository.name }}
          BEFORE: ${{ github.event.before }}
          TOOLING: ${{ github.workspace }}/.spec-tooling
          PINS: ${{ inputs.pins }}
        run: |
          set -euo pipefail
          service="${REPO#lemonfiber-}"
          if [ "$service" = "$REPO" ] || [[ ! "$service" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::'${REPO}' is not named lemonfiber-<service> (ADR-0033 §1)"
            exit 1
          fi
          case "$PINS" in
            manifest)
              if [ ! -f plugin.toml ]; then
                echo "::error::'${REPO}' holds no plugin.toml, which is what pins its image (ADR-0045 §1)"
                exit 1
              fi
              ;;
            bundle)
              if [ -f plugin.toml ]; then
                echo "::error::'${REPO}' is pinned by the bundle and holds a plugin.toml, which would pin it twice"
                exit 1
              fi
              ;;
            *)
              echo "::error::pins is '${PINS}', and an image is pinned by its manifest or by the bundle"
              exit 1
              ;;
          esac
          publish=yes

          # A push, and nothing else: a dispatch could carry the same ref without
          # being what main or the train holds.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$KIND" = branch ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            kind=commit
            tag="main-${GITHUB_SHA:0:12}"
            pins="$(python3 "$TOOLING/scripts/pin_bump.py" pins-only --before "$BEFORE" --after "$GITHUB_SHA")"
            if [ "$pins" = yes ]; then
              publish=no
              echo "::notice::${GITHUB_SHA} changes nothing but a pin, so no image is published from it"
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$KIND" = tag ] && [[ "$GITHUB_REF" = refs/tags/* ]]; then
            kind=tag
            tag="$NAME"
            # `rc` is refused as the train refuses it: ARCH-R43 gives a release
            # candidate a meaning no tag cut here may claim by accident.
            # Matched in the shell rather than piped to `grep -q`, which can exit
            # before its producer finishes and read a match as none under pipefail.
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
              || [[ "$tag" =~ ^v[0-9.]+-rc[0-9]*(\.|$) ]]; then
              echo "::error::'${tag}' is not a tag the train cuts: vX.Y.Z, or vX.Y.Z-<identifier> other than rc"
              exit 1
            fi

            # Nothing is published from a branch but main: the tagged commit is one main holds.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::${tag} points at ${GITHUB_SHA}, which main does not hold"
              exit 1
            fi

            declared="$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
            if [ "v${declared}" != "$tag" ]; then
              echo "::error::the crate declares ${declared}, so it is not tagged ${tag}"
              exit 1
            fi
            if [ "$PINS" = manifest ]; then
              declared="$(python3 -I -c 'import tomllib; print(tomllib.load(open("plugin.toml", "rb"))["plugin"]["version"])')"
              if [ "v${declared}" != "$tag" ]; then
                echo "::error::plugin.toml declares ${declared}, so it is not tagged ${tag}"
                exit 1
              fi
            fi
          else
            echo "::error::a service image is published for a push to main or a pushed tag, not for ${GITHUB_EVENT_NAME} on ${GITHUB_REF}"
            exit 1
          fi

          {
            echo "image=${REGISTRY}/${service}"
            echo "tag=${tag}"
            echo "kind=${kind}"
            echo "service=${service}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          [ "$publish" = no ] || echo "publishing ${REGISTRY}/${service}:${tag}"

  build:
    needs: settle
    if: needs.settle.outputs.publish == 'yes'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build on this platform and push by digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.settle.outputs.image }}
          TAG: ${{ needs.settle.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # The default driver cannot write attestations; this one runs the
          # pinned BuildKit.
          docker buildx create --use --driver docker-container --driver-opt "image=${BUILDKIT}" >/dev/null
          docker buildx build . \
            --platform "$PLATFORM" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance mode=max \
            --attest "type=sbom,generator=${SBOM_SCANNER}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          digest="$(python3 -I -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the build reported no digest: '${digest}'"; exit 1; }
          mkdir -p digests
          touch "digests/${digest#sha256:}"
          echo "${PLATFORM} pushed as ${digest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [settle, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Join the platforms under one index, tagged
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.settle.outputs.image }}
          TAG: ${{ needs.settle.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          sources=()
          for file in digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "$file")")
          done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected two platform digests, got ${#sources[@]}"; exit 1; }
          # A published tag never moves (OPS-R90): a run again for the same commit or
          # tag keeps the index already there, and attests that one.
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} is already published, and a published tag does not move"
          else
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${sources[@]}"
          fi

          docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' > descriptor.json
          digest="$(python3 -I -c 'import json; print(json.load(open("descriptor.json"))["digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the registry named no index digest: '${digest}'"; exit 1; }
          docker buildx imagetools inspect --raw "${IMAGE}@${digest}" > index.json
          # The pin is an index publishing both platforms (E1-R1, F2-R6), and
          # each platform's image manifest is what its SBOM describes.
          python3 -I - "$digest" <<'PY'
          import json, os, sys
          index = json.load(open("index.json"))
          found = {
              f"{m['platform']['os']}/{m['platform']['architecture']}": m["digest"]
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("os") not in (None, "unknown")
          }
          missing = {"linux/amd64", "linux/arm64"} - set(found)
          if missing:
              sys.exit(f"::error::the index does not publish {', '.join(sorted(missing))}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"digest={sys.argv[1]}\n")
              out.write(f"amd64={found['linux/amd64']}\n")
              out.write(f"arm64={found['linux/arm64']}\n")
          PY
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "${IMAGE}:${TAG}" \
              --format "{{ json (index .SBOM \"linux/${arch}\").SPDX }}" > "sbom-${arch}.spdx.json"
          done
          {
            echo "## ${IMAGE}:${TAG}"
            echo
            echo "Index digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published ${IMAGE}:${TAG} as ${digest}"
      - name: Attest the index's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/amd64 image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/arm64 image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

  # The manifest is the bundle's source for this image (ADR-0045 §1, §5).
  # `manifest-pin` puts a commit image on the commit branch and a train tag on the
  # tag branch, with every recording taken again from it.
  manifest:
    needs: [settle, publish]
    if: inputs.pins == 'manifest'
    permissions:
      contents: read
    uses: ./.github/workflows/manifest-pin.yml
    with:
      image: ${{ needs.settle.outputs.image }}
      tag: ${{ needs.settle.outputs.tag }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}

  # An image no plugin declares is pinned in the bundle's own table for its service, and
  # each commit image and train tag moves it there: a commit's between releases, and the
  # tag's, which the core's release requires (ARCH-R363, OPS-R94).
  bundle:
    needs: [settle, publish]
    if: inputs.pins == 'bundle'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/bundle-image-pin.yml
    with:
      service: ${{ needs.settle.outputs.service }}
      image: ${{ needs.settle.outputs.image }}
      tag: ${{ needs.settle.outputs.tag }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
