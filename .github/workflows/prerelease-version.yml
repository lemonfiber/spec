# Publish an in-flight version as a pre-release — OPS-R60..R66.
#
# `execute-version` refuses while a goal is unmet, and that is right: a release
# claims its goals shipped. A pre-release claims nothing of the kind. It carries
# the gate's verdict — every unmet goal, by name — on the artefact itself, so a
# version whose last goal closes on somebody's own hardware can still be
# installed by the person who has that hardware.
#
# It relaxes the goal gate and the bundle pin, and nothing else: a bundle not yet
# pinning each first-party plugin at the tag is recorded as `OPS-R86` unmet
# (OPS-R86). Compatibility, blockers, the declared version and the plugin gate are
# checked exactly as they are before a release tag. The manifest's `status` does not move — a pre-release is not a
# lifecycle transition — and what is written is one `[[prerelease]]` record
# holding the tag, the day, the unmet goals and the pins.
#
# Nothing outside the organisation hears about it: this posts to no public
# channel, and the binary repository's announce path refuses on the pre-release
# flag rather than relying on being unconfigured (OPS-R63).
#
# A pre-release of a version that cuts a repository building one of the stack's
# own images is cut in the same two runs as the release (ADR-0033 §4). The first
# tags those repositories at the pre-release tag and stops. Once the stack pins
# the image each tag published, and the core's submodule embeds that stack, the
# second run checks those pins, records the pre-release and tags everything else.
# A first-party plugin's repository is tagged in neither run: the plugin is built
# against the core's pre-release and tagged at the version by the release. So a
# bundle not pinning each plugin at the tag does not stop a pre-release; it is
# recorded among the unmet goals, as `OPS-R86`.
# `train_step.py` reads which run this is from the repositories themselves.
#
# Maintainer-only; dry_run defaults on.
name: prerelease-version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pre-release, e.g. 0.15.0 — its versions/<v>.toml must be staged, in_progress or releasable."
        required: true
      identifier:
        description: "Pre-release identifier appended to the tag, e.g. pre.1. `rc` is refused — ARCH-R43 already uses it."
        required: true
        default: "pre.1"
      dry_run:
        description: "Run every check and print the verdict, but record and tag nothing."
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  # Every registered plugin riding this version, proved with the candidate build of
  # the core commit this run is about to tag (OPS-R68, OPS-R72). The job tagging it
  # holds its checkout of the core at the commit settled here.
  #
  # Its own job, ahead of the one that mints the release App token, and holding no
  # secret: building the core runs every dependency's build script, which does not
  # belong beside a token that can tag every repository. The build is most of the
  # run's time.
  plugins:
    # The host the core's release builds its Linux archive on, so the candidate
    # links against what the release's binary links against.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      core: ${{ steps.prove.outputs.core }}
    steps:
      - name: Gate to maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          case "$perm" in
            admin|maintain) echo "${ACTOR} is a maintainer (${perm})." ;;
            *) echo "::error::${ACTOR} lacks maintainer permission (${perm})."; exit 1 ;;
          esac

      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every registered plugin, proved with the candidate (OPS-R68, OPS-R72)
        id: prove
        uses: ./.github/actions/prove-plugins
        with:
          version: ${{ inputs.version }}

  prerelease:
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Settle the tag this will cut (OPS-R61)
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          IDENTIFIER: ${{ inputs.identifier }}
        run: |
          set -euo pipefail
          # Both halves against the patterns the rest of the train reads, so a
          # tag this refuses is refused for the same reason `set_status` would
          # refuse to record it rather than for a different one written here.
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from patterns import PRERELEASE_ID, VERSION
          version, identifier = os.environ["VERSION"], os.environ["IDENTIFIER"]
          if not VERSION.match(version):
              sys.exit(f"::error::version must be X.Y.Z, got {version!r}")
          if not PRERELEASE_ID.match(identifier):
              sys.exit(
                  f"::error::{identifier!r} is not a usable pre-release identifier; "
                  "`rc` is reserved by ARCH-R43 for the point schema_version starts binding"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag=v{version}-{identifier}\n")
              out.write(f"declared={version}-{identifier}\n")
          PY

      - name: Mint the release App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Read the manifest and clone its repos
        id: read
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          man="70-operations/versions/${VERSION}.toml"
          [ -f "$man" ] || { echo "::error::no manifest at ${man}"; exit 1; }
          python3 - "$man" "$TAG" <<'PY'
          import datetime, os, sys, tomllib
          sys.path.insert(0, "scripts")
          from patterns import IN_FLIGHT
          data = tomllib.load(open(sys.argv[1], "rb"))
          status = data.get("status")
          if status not in IN_FLIGHT:
              sys.exit(f"::error::{sys.argv[1]} is '{status}', not {'/'.join(IN_FLIGHT)}")
          # A tag already recorded is a run picking up after its record reached
          # main and before every repository carried the tag. That record is not
          # written again: the record step and its wait are passed over, and the
          # record is held to this run's pins before anything is tagged.
          recorded = any(rec.get("tag") == sys.argv[2] for rec in data.get("prerelease", []))
          # The status is carried forward rather than chosen: a pre-release is not
          # a transition, and the record has to be written against whatever the
          # version already is (OPS-R60).
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"status={status}\n")
              out.write(f"today={today}\n")
              out.write(f"recorded={'true' if recorded else 'false'}\n")
          PY
          python3 scripts/manifest_repos.py --version "$VERSION" --for cut > repos.txt
          python3 scripts/manifest_repos.py --version "$VERSION" --for searched > searched.txt
          sort -u repos.txt searched.txt > needed.txt
          while read -r r; do
            [ -n "$r" ] || continue
            git clone --quiet --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "checkouts/${r}"
          done < needed.txt

      - name: Hold the core at the commit its plugins were proved with (OPS-R68)
        env:
          CORE: ${{ needs.plugins.outputs.core }}
        run: |
          set -euo pipefail
          # Every check below, and the tag, reads this checkout. The default branch
          # may have moved since the plugins were proved, and a tag on a commit they
          # were not proved with would carry a verdict about another build.
          if [[ ! "$CORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the plugin gate settled no core commit: '${CORE}'"
            exit 1
          fi
          git -C checkouts/lemonfiber checkout --quiet --detach "$CORE"
          echo "lemonfiber held at ${CORE:0:8}, the commit its plugins were proved with."

      - name: Which step of the train this run is (ADR-0033 §4)
        id: step
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/train_step.py --version "$VERSION" --tag "$TAG"

      # The one check that does not refuse. Its answer is what the pre-release
      # exists to carry, so it is captured rather than acted on — and captured
      # as JSON, because the record keeps the goals by name (OPS-R62, OPS-R65).
      #
      # The bundle pin is part of that answer. A release refuses a core whose
      # embedded bundle does not pin each plugin at its tag; a pre-release is cut
      # so the plugins can be built against it, so in the run that tags the core it
      # records `OPS-R86` among the unmet goals instead (OPS-R86).
      - name: The gate's verdict, recorded rather than enforced (OPS-R62)
        id: verdict
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          STEP: ${{ steps.step.outputs.step }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          args=()
          while read -r r; do [ -n "$r" ] && args+=(--repo "${r}=checkouts/${r}"); done < searched.txt
          # A `run:` block is `bash -e`, and `set -uo pipefail` does not take that
          # off. The gate answering "goals unmet" is exit 1 — the verdict a
          # pre-release exists to carry — so its status is read through `||`,
          # where errexit does not reach, rather than from `$?` on the next line.
          answered=0
          # The binary's Markdown tracker, only while it still keeps one.
          legacy=checkouts/lemonfiber/IMPLEMENTATION-STATUS.md
          if [ -f "$legacy" ]; then args+=(--status "$legacy"); fi
          python3 scripts/gate.py --manifest "70-operations/versions/${VERSION}.toml" "${args[@]}" \
            --format json > verdict.json || answered=$?
          # 0 is releasable and 1 is goals unmet; both are verdicts. 2 is the gate
          # failing to answer at all — an unreadable tracker, a shallow clone, a
          # manifest locking nothing. A pre-release may go out with goals unmet; it
          # may not go out with no verdict, because the verdict is what it publishes.
          if [ "$answered" -ge 2 ]; then
            echo "::error::the gate could not answer for ${VERSION}; a pre-release without a verdict is refused"
            exit 1
          fi
          export BUNDLE=""
          if [ "$STEP" = "streams" ]; then
            python3 scripts/check_bundle_pins.py --version "$VERSION" --tag "$TAG" \
              --core checkouts/lemonfiber --owner "$OWNER" || BUNDLE="OPS-R86"
          fi
          python3 - <<'PY'
          import json, os
          verdict = json.load(open("verdict.json", encoding="utf-8"))
          unmet = [goal["id"] for goal in verdict["goals"] if not (goal["cited"] and goal["done"])]
          if os.environ["BUNDLE"] and os.environ["BUNDLE"] not in unmet:
              unmet.append(os.environ["BUNDLE"])
              print("::warning title=Bundle unpinned::the embedded bundle does not pin each plugin at "
                    f"{os.environ['TAG']}, recorded as {os.environ['BUNDLE']} unmet")
          met = len(verdict["goals"]) - len(unmet)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"unmet={' '.join(unmet)}\n")
              out.write(f"summary={met} of {len(verdict['goals'])} goals satisfied\n")
          print(f"{met} of {len(verdict['goals'])} goals satisfied")
          if unmet:
              print(f"::warning title=Goals unmet::{len(unmet)} unmet and going out anyway: {', '.join(unmet)}")
          PY

      - name: What it locks that is not built, reported not enforced (OPS-R54)
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The same trackers the goal gate reads: each searched repository's
          # status.toml, and the binary's Markdown one while it still keeps it.
          args=()
          while read -r r; do [ -n "$r" ] && args+=(--repo "${r}=checkouts/${r}"); done < searched.txt
          legacy=checkouts/lemonfiber/IMPLEMENTATION-STATUS.md
          if [ -f "$legacy" ]; then args+=(--status "$legacy"); fi
          python3 scripts/check_no_stubs.py --version "$VERSION" "${args[@]}"

      - name: Cross-stream compatibility (OPS-R35, OPS-R66)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C checkouts/lemonfiber submodule update --init --depth 1 assets/media-stack
          stack="checkouts/lemonfiber/assets/media-stack/stack.toml"
          if [ ! -f "$stack" ]; then
            echo "::error::the embedded stack carries no stack.toml"
            exit 1
          fi
          mincli=$(sed -nE 's/^min_cli_version[[:space:]]*=[[:space:]]*"(.*)".*/\1/p' "$stack" | head -1)
          schema=$(sed -nE 's/^schema_version[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$stack" | head -1)
          if [ -z "$mincli" ] || [ -z "$schema" ]; then
            echo "::error::the embedded stack declares no min_cli_version or schema_version"
            exit 1
          fi
          # Compared on the version rather than on the tag. A pre-release
          # identifier orders below the version it precedes, so `sort -V` would
          # call a pre-release of the minimum older than the minimum — which is
          # true of the tag and not of what the binary can do.
          if [ "$(printf '%s\n%s\n' "$mincli" "$VERSION" | sort -V | head -1)" != "$mincli" ]; then
            echo "::error::stack needs cli >= ${mincli}, pre-releasing ${VERSION}"
            exit 1
          fi
          reads=$(sed -nE 's/^pub const SCHEMA_VERSION: u32 = ([0-9]+);.*/\1/p' \
            checkouts/lemonfiber/crates/lemonfiber-manifest/src/lib.rs | head -1)
          if [ -z "$reads" ]; then
            echo "::error::could not read the binary's schema version"
            exit 1
          fi
          if [ "$schema" != "$reads" ]; then
            echo "::error::stack is schema ${schema}, binary reads ${reads}"
            exit 1
          fi
          echo "compat ok: binary ${VERSION} >= min_cli ${mincli}, schema ${schema}"

      - name: The embedded stack pins each image at this tag (ADR-0033 §4, OPS-R66)
        if: ${{ steps.step.outputs.step == 'streams' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/check_image_pins.py --version "$VERSION" --tag "$TAG" \
            --stack checkouts/lemonfiber/assets/media-stack/stack.toml

      # What the artefacts will actually embed, so the record answers "which build
      # of the stack went out with it" from the file alone (OPS-R65).
      #
      # Enumerated from `.gitmodules` rather than named here, which is the lesson
      # `release-finalize` learned the expensive way: it spelled out the one path
      # that existed when it was written and went on recording only that one after
      # a second submodule arrived, so 0.10.0 shipped a record that did not say
      # which build of the web app was in it.
      - name: Read the pins these artefacts will carry (OPS-R65)
        id: pins
        run: |
          set -euo pipefail
          python3 scripts/submodule_pins.py < checkouts/lemonfiber/.gitmodules > modules.tsv
          recorded=()
          while IFS=$'\t' read -r name where; do
            [ -n "$name" ] || continue
            sha=$(git -C checkouts/lemonfiber ls-tree HEAD "$where" | awk '{print $3}')
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
              || { echo "::error::${name}'s pin is not a sha: '${sha}'"; exit 1; }
            recorded+=("${name}=${sha}")
            echo "${name} @ ${sha:0:8}"
          done < modules.tsv
          [ "${#recorded[@]}" -gt 0 ] || { echo "::error::the tag embeds no submodule this could record"; exit 1; }
          echo "pins=${recorded[*]}" >> "$GITHUB_OUTPUT"

      # A record already on main names the build it was written for. The tag
      # goes on only if this run would embed the same one; otherwise the tag
      # and the record would describe two different builds (OPS-R65).
      - name: A record already on main names this build (OPS-R65)
        if: ${{ steps.read.outputs.recorded == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          STEP: ${{ steps.step.outputs.step }}
          PINS: ${{ steps.pins.outputs.pins }}
        run: |
          set -euo pipefail
          python3 - "70-operations/versions/${VERSION}.toml" <<'PY'
          import os, sys, tomllib
          tag = os.environ["TAG"]
          if os.environ["STEP"] != "streams":
              sys.exit(f"::error::{tag} is recorded while an image still lacks it; the record came before its images")
          data = tomllib.load(open(sys.argv[1], "rb"))
          record = next(rec for rec in data["prerelease"] if rec.get("tag") == tag)
          held = dict(record.get("pins", {}))
          embeds = dict(pair.split("=", 1) for pair in os.environ["PINS"].split())
          if held != embeds:
              sys.exit(f"::error::{tag} is recorded with pins {held}, but this run embeds {embeds}; nothing was tagged")
          print(f"{tag} is recorded on main with the pins this run embeds; tagging without recording again.")
          PY

      - name: Check for release blockers (OPS-R44, OPS-R66)
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/in_flight.py blockers --version "$VERSION"

      - name: The repos declare the pre-release being cut (OPS-R66)
        env:
          DECLARED: ${{ steps.tag.outputs.declared }}
        run: |
          set -euo pipefail
          # cargo-dist releases the tag whose version the workspace carries, so a
          # pre-release tag over a workspace declaring the plain version produces a
          # tag nothing will build. The pre-release identifier has to be in the
          # manifest too, which is the whole reason this is checked and not assumed.
          # What is read is every stream still to be tagged, which `train_step.py`
          # wrote.
          mismatched=0
          while read -r r; do
            [ -n "$r" ] || continue
            man="checkouts/${r}/Cargo.toml"
            if [ ! -f "$man" ]; then
              echo "no Cargo.toml in ${r} — nothing to check."
              continue
            fi
            declared=$(python3 - "$man" <<'PY'
          import sys, tomllib
          d = tomllib.load(open(sys.argv[1], "rb"))
          print(d.get("workspace", {}).get("package", {}).get("version")
                or d.get("package", {}).get("version") or "")
          PY
            )
            if [ "$declared" != "$DECLARED" ]; then
              echo "::error::${r} declares ${declared:-nothing}, not ${DECLARED} — merge the version bump before tagging"
              mismatched=$((mismatched + 1))
            else
              echo "${r} declares ${declared}."
            fi
          done < declaring.txt
          [ "$mismatched" -eq 0 ] || exit 1

      - name: Dry run — stop before recording anything
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          STEP: ${{ steps.step.outputs.step }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
          UNMET: ${{ steps.verdict.outputs.unmet }}
        run: |
          echo "::notice title=Dry run::${TAG} would go out with ${SUMMARY}. Unmet: ${UNMET:-none}. This is the ${STEP} step; it would tag $(paste -sd, tagging.txt). Re-run with dry_run=false to record and tag."

      # Recorded before the tag, not after. The binary repository's changelog job
      # reads this record to write the verdict onto the release body, and a tag
      # cut before the record is merged would produce a build with nothing to read.
      # Recorded in the run that tags the core, since its pins are the record's.
      - name: Record it on the manifest (OPS-R65)
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'streams' && steps.read.outputs.recorded != 'true' }}
        uses: ./.github/actions/manifest-transition
        with:
          version: ${{ inputs.version }}
          status: ${{ steps.read.outputs.status }}
          prerelease: ${{ steps.tag.outputs.tag }}
          prerelease_on: ${{ steps.read.outputs.today }}
          unmet: ${{ steps.verdict.outputs.unmet }}
          pins: ${{ steps.pins.outputs.pins }}
          token: ${{ steps.token.outputs.token }}

      # The record has to be *on main* before the tag, not merely opened as a pull
      # request. The binary repository's changelog job reads it to write the verdict
      # onto the release body and refuses a tag it finds no record for (OPS-R62) —
      # so a tag cut while the record is still in review produces a build that fails
      # for a reason that has nothing to do with the build.
      #
      # Bounded rather than open-ended, and the timeout is a refusal rather than a
      # shrug: nothing is tagged, so nothing has to be undone.
      - name: Wait for the record to land on main (OPS-R62, OPS-R65)
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'streams' && steps.read.outputs.recorded != 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The whole record is read before the tag is looked for. `grep -q`
          # exits at the match, `gh` dies of SIGPIPE writing what follows it,
          # and under `pipefail` a record that holds the tag reads as one that
          # does not.
          for _ in $(seq 1 60); do
            recorded="$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${OWNER}/spec/contents/70-operations/versions/${VERSION}.toml?ref=main" \
              2>/dev/null | grep -F "tag = \"${TAG}\"" || true)"
            if [ -n "$recorded" ]; then
              echo "${TAG} is recorded on main."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${TAG}'s record has not reached main after ten minutes; nothing was tagged."
          exit 1

      - name: Tag the target repos
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          while read -r r; do
            [ -n "$r" ] || continue
            sha=$(git -C "checkouts/${r}" rev-parse HEAD)
            # A run that stopped part-way through this loop is finished by running
            # it again: a repository already carrying the tag at this commit is
            # passed over. One carrying it at another commit is refused, since a
            # tag cut twice is two artefacts answering to one name. The lookup lists
            # matching refs, which answers an empty list where there is no tag, so a
            # failed call stops the run rather than reading as a tag held elsewhere.
            held=$(gh api "repos/${OWNER}/${r}/git/matching-refs/tags/${TAG}" \
              --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.sha")
            if [ "$held" = "$sha" ]; then
              echo "${r} already carries ${TAG} @ ${sha:0:8}."
              continue
            fi
            if [ -n "$held" ]; then
              echo "::error::${r} carries ${TAG} at ${held:0:8}, not ${sha:0:8}"
              exit 1
            fi
            gh api --method POST "repos/${OWNER}/${r}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${sha}"
            echo "tagged ${r} @ ${sha:0:8} as ${TAG}"
          done < tagging.txt

      - name: Images tagged — run again once the core embeds them
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'images' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::notice title=Images tagged::$(paste -sd, tagging.txt) carry ${TAG}. Once lemonfiber-media-stack pins the image each tag published and the core's submodule takes that stack, run prerelease-version again with the same identifier: it checks those pins, records the pre-release and tags every other stream."

      - name: Tagged — review and publish to finish
        if: ${{ !inputs.dry_run && steps.step.outputs.step == 'streams' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
          UNMET: ${{ steps.verdict.outputs.unmet }}
        run: |
          echo "::notice title=Pre-released::${TAG} is tagged. The build leaves a draft marked pre-release, carrying ${SUMMARY} and naming what is unmet (${UNMET:-none}). Publishing it announces to the maintainer channel and to nothing public (OPS-R63), and moves no manifest status (OPS-R60)."
