# The verdict on a first-party plugin that carries no code of its own, as one job
# (F3-R9, F5-R13, F10-R3): its manifest as the lemonfiber its `targets.toml` names
# reads it, every claim, proof and contributed check against its recordings with the
# committed `proofs.json` the one that run writes, and every pinned digest.
#
# The reader is plugin-template's `.github/reader/`, at the commit named below, so a
# repository calling this holds no Python of its own and refuses to carry one.
#
# `live` then takes every recording again, against each image the manifest pins run as
# lemonfiber runs it: under its posture, waited on until its health check passes, and
# asked every proof, probe and conformance case (REPO-R93). Where its tree holds a
# Dockerfile, the image built from it stands in for the pin of the service it builds:
# each adapter's where a service fronts one, and the service with the plugin's id where
# no service speaks a contract and that service runs this repository's own image, or,
# before that image's first pin, the very image and digest the Dockerfile's last FROM
# builds on (ARCH-R285). A revision recorded so says it ships nothing, as the job's
# `unpinned` output, a warning and its summary, and every bundle and train tag refuses
# it (`first_pin.py`). A Dockerfile that builds an adapter the manifest does not run yet stands
# in for nothing, and every service runs its pin. It is lemonfiber's own `plugin record --check`, by the lemonfiber the
# `plugin` job built or fetched, handed on rather than built twice.
#
# Both are skipped by a job-level condition where `what changed` found only paths no
# part of the verdict reads (Q-R76), and run wherever that could not be decided.
name: first-party-plugin
on:
  workflow_call:
    inputs:
      directory:
        description: "The plugin's root in the calling repository, from its root."
        type: string
        required: false
        default: "."

permissions:
  contents: read

env:
  READER_REPOSITORY: lemonfiber/plugin-template
  READER_REVISION: 0e37c21fe52af41c950fc29ff42f1934a90ed377
  READER: .github/reader
  # The lemonfiber the `plugin` job built or fetched, handed to `live`.
  BUILT: first-party-plugin-lemonfiber

jobs:
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          DIRECTORY: ${{ inputs.directory }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No commit to compare against, so the plugin is judged."
            exit 0
          fi
          changed="$(git diff --no-renames --name-only "${BASE}" HEAD)"
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | *.md | docs/* | LICENSE | status.toml | .github/ISSUE_TEMPLATE/*) continue ;;
            .github/*) code=true ;;
            *) ;;
            esac
            if [ "${DIRECTORY}" = "." ] || [[ "${path}" == "${DIRECTORY%/}/"* ]]; then
              code=true
            fi
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Nothing the verdict reads changed, so the plugin is not judged again."
          fi

  plugin:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The reader, from plugin-template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.READER_REPOSITORY }}
          ref: ${{ env.READER_REVISION }}
          path: .first-party-reader
          sparse-checkout: ${{ env.READER }}
          sparse-checkout-cone-mode: false
      - name: The reader is this workflow's, and the plugin carries none
        env:
          TAKEN: ${{ github.workspace }}/.first-party-reader
        run: |
          set -euo pipefail
          if [ -e "${READER}" ]; then
            echo "::error::${READER} is in the plugin. A first-party plugin carries no Python of its own; the reader is this workflow's."
            exit 1
          fi
          mkdir -p "$(dirname "${READER}")"
          cp -R "${TAKEN}/${READER}" "${READER}"
          rm -rf "${TAKEN}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The lemonfiber targets.toml names, and what it says of this plugin
        run: python3 .github/reader/reader.py reader
      - name: plugin.toml, as that lemonfiber reads it
        if: ${{ success() || failure() }}
        run: python3 .github/reader/reader.py manifest
      - name: Every claim, proof and contributed check, against its recording
        if: ${{ success() || failure() }}
        run: |
          python3 .github/reader/reader.py proofs
          if ! git ls-files --error-unmatch proofs.json >/dev/null 2>&1; then
            echo "::error::proofs.json is not committed. It is the record the release train reads: commit what the reader writes (F3-R5)."
            exit 1
          fi
          if git diff --exit-code -- proofs.json; then exit 0; fi
          echo "::error::proofs.json is not what this run writes. It is the record the release train reads, so it is generated and committed with the manifest it is about: commit what the reader writes (F3-R5)."
          exit 1
      - name: Every pinned digest, and what vouches for it
        if: ${{ success() || failure() }}
        run: python3 .github/reader/reader.py image
      - name: The lemonfiber it read with, for live
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUILT }}
          path: ${{ inputs.directory }}/.lemonfiber/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  live:
    needs: [scope, plugin]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The reader, from plugin-template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.READER_REPOSITORY }}
          ref: ${{ env.READER_REVISION }}
          path: .first-party-reader
          sparse-checkout: ${{ env.READER }}
          sparse-checkout-cone-mode: false
      - name: The reader in place
        env:
          TAKEN: ${{ github.workspace }}/.first-party-reader
        run: |
          set -euo pipefail
          if [ -e "${READER}" ]; then
            echo "::error::${READER} is in the plugin. A first-party plugin carries no Python of its own; the reader is this workflow's."
            exit 1
          fi
          mkdir -p "$(dirname "${READER}")"
          cp -R "${TAKEN}/${READER}" "${READER}"
          rm -rf "${TAKEN}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Where `plugin` stopped before it had one, the reader builds or fetches it here.
      - name: The lemonfiber the plugin job read with
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BUILT }}
          path: ${{ inputs.directory }}/.lemonfiber/
      - name: The lemonfiber targets.toml names
        id: lemonfiber
        run: |
          set -euo pipefail
          find .lemonfiber -type f -name lemonfiber -exec chmod +x {} + 2>/dev/null || true
          python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); import reader; print("binary=" + str(reader.binary()))' \
            "${READER}" >> "$GITHUB_OUTPUT"
      - name: The workflow's own tooling, at the commit it runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
          sparse-checkout: scripts/first_pin.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The image this tree builds
        id: built
        env:
          OWNER: ${{ github.repository_owner }}
          TOOLING: ${{ github.workspace }}/.spec-tooling
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            rm -rf "${TOOLING}"
            echo "No image is built here, so every service runs the image plugin.toml pins."
            exit 0
          fi
          stands_in="$(python3 -I "${TOOLING}/scripts/first_pin.py" stands-in --owner "${OWNER}")"
          rm -rf "${TOOLING}"
          read -r stands_in unpinned <<< "${stands_in}"
          if [ -n "${unpinned}" ]; then
            echo "unpinned=true" >> "$GITHUB_OUTPUT"
            {
              echo "### This revision ships nothing"
              echo
              echo "Its service of the plugin's id still runs the image its Dockerfile builds on. It is recorded from the image built here, and no bundle or release takes it until the first pin of that image merges."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::recorded from the image built here, which no pin names yet: this revision ships nothing until the first pin of that image merges"
          fi
          if [ -z "${stands_in}" ]; then
            echo "Its own upstream speaks the contracts here, and is recorded from the image plugin.toml pins."
            exit 0
          fi
          docker build -q -t first-party-live-built .
          {
            echo "image=first-party-live-built"
            echo "as=${stands_in}"
          } >> "$GITHUB_OUTPUT"
      - name: Every image the recordings are taken from
        env:
          STANDS_IN: ${{ steps.built.outputs.as }}
        run: |
          set -euo pipefail
          python3 -I -c 'import os, tomllib
          manifest = tomllib.load(open("plugin.toml", "rb"))
          stands_in = os.environ["STANDS_IN"]
          plugin = manifest["plugin"]["id"]
          for one in manifest.get("service", []):
              if stands_in == "adapter" and "fronts" in one:
                  continue
              if stands_in == "built" and one["id"] == plugin:
                  continue
              print(one["image"] + "@" + one["digest"])' | xargs -r -n1 docker pull -q
      - name: Every recording, taken again from them
        env:
          LEMONFIBER: ${{ steps.lemonfiber.outputs.binary }}
          BUILT: ${{ steps.built.outputs.image }}
          STANDS_IN: ${{ steps.built.outputs.as }}
        run: |
          set -euo pipefail
          case "${STANDS_IN}" in
            adapter) "${LEMONFIBER}" plugin record . --check --adapter "${BUILT}" ;;
            built) "${LEMONFIBER}" plugin record . --check --built "${BUILT}" ;;
            *) "${LEMONFIBER}" plugin record . --check ;;
          esac
