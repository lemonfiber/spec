# Reusable: move an image the bundle pins apart from its parts to the one a train tag
# published, on one rolling pull request in lemonfiber-plugins (ARCH-R363, OPS-R87).
#
# The fence is no part: no plugin's manifest declares it, so no plugin's pin moves it.
# Its image is pinned in the bundle's own `[<service>]` table, and the tag that
# published an image moves that table to it here. A commit image is never pinned.
#
# `rust-service-release` calls this for a repository saying `pins: bundle`, once the
# index is published:
#
#   bundle:
#     needs: [settle, publish]
#     uses: ./.github/workflows/bundle-image-pin.yml
#     with:
#       service: fence
#       image: ghcr.io/lemonfiber/fence
#       tag: v0.18.0
#       digest: sha256:…
#     secrets:
#       RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
#
# The job that commits mints the App's token only for a pushed train tag in this
# organisation, judged in its `if:` before any step runs; the token is for
# lemonfiber-plugins alone and can write contents and nothing else. The pull request is
# opened in the next job, with one of its own.
name: bundle-image-pin

on:
  workflow_call:
    inputs:
      service:
        description: "The service id the image runs as, and the bundle table that pins it."
        type: string
        required: true
      image:
        description: "The registry path it was published to, without tag or digest."
        type: string
        required: true
      tag:
        description: "The train tag it was published at."
        type: string
        required: true
      digest:
        description: "The digest of the index published at that tag."
        type: string
        required: true
    secrets:
      RELEASE_APP_KEY:
        description: "The release App's private key, which writes the rolling pin pull request."
        required: true

permissions:
  contents: read

env:
  BUNDLE: plugins
  SCRATCH: .bundle-image-pin
  PINNED: lemonfiber/lemonfiber-plugins

jobs:
  commit:
    if: >-
      github.repository_owner == 'lemonfiber'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    concurrency:
      # Two runs would each move the same branch under the other.
      group: bundle-image-pin-${{ inputs.service }}
      cancel-in-progress: false
    outputs:
      branch: ${{ steps.move.outputs.branch }}
      head: ${{ steps.commit.outputs.head }}
      title: ${{ steps.message.outputs.title }}
      body: ${{ steps.message.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PINNED }}
          ref: main
          path: ${{ env.BUNDLE }}
          persist-credentials: false
      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
          persist-credentials: false
      - name: Move the table
        id: move
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$SCRATCH"
          python3 .spec-tooling/scripts/bundle_image_pin.py apply \
            --bundle "$BUNDLE/bundle/bundle.toml" --service "$SERVICE" --image "$IMAGE" \
            --tag "$TAG" --digest "$DIGEST" --message "$SCRATCH/message.txt" >> "$GITHUB_OUTPUT"
          echo "branch=release/${SERVICE}-image-pin" >> "$GITHUB_OUTPUT"
      - name: The commit message and the pull request
        id: message
        if: steps.move.outputs.moved == 'yes'
        run: |
          set -euo pipefail
          python3 -I - "$SCRATCH/message.txt" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          title, _, body = text.partition("\n\n")
          print(f"title={title}")
          print("body<<BODY_END")
          print(body.rstrip("\n"))
          print("BODY_END")
          PY
      # `main` takes signed commits only, and a commit GitHub makes for the App is signed.
      - name: Mint a token that can commit to the bundle
        id: token
        if: steps.move.outputs.moved == 'yes'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: lemonfiber-plugins
          permission-contents: write
      - name: Put the change on the branch, signed
        id: commit
        if: steps.move.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.move.outputs.branch }}
        run: |
          set -euo pipefail
          head="$(python3 .spec-tooling/scripts/signed_pin_commit.py --repo "$BUNDLE" \
            --slug "$PINNED" --branch "$BRANCH" --message "$SCRATCH/message.txt")"
          echo "head=${head}" >> "$GITHUB_OUTPUT"

  # Opened, or the open one edited, only where it is this pin's own (OPS-R87), and armed
  # to merge once the bundle's required checks pass.
  pull-request:
    needs: commit
    if: needs.commit.outputs.head != ''
    permissions:
      contents: read
    uses: ./.github/workflows/rolling-pull-request.yml
    with:
      branch: ${{ needs.commit.outputs.branch }}
      head: ${{ needs.commit.outputs.head }}
      title: ${{ needs.commit.outputs.title }}
      body: ${{ needs.commit.outputs.body }}
      auto-merge: true
      repository: lemonfiber-plugins
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
