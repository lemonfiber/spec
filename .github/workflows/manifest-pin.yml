# Reusable: propose an image a release published as the image every service of
# the calling repository's plugin.toml running it runs (OPS-R90, OPS-R91).
#
# A train tag's image goes on `release/image-pin` and main's on
# `release/image-commit-pin`, so the two never move each other's pull request.
# The manifest is read from main and written on that rolling branch,
# with every service running the image moved to its digest and tag and nothing
# else touched, and the change opened as that branch's one pull request
# (OPS-R85, OPS-R87). A commit that merges a pin publishes and pins nothing, so a
# pin never pins itself. A manifest with no service running the image pins
# nothing.
#
# Called after the image is published, by `first-party-image` and by
# `rust-service-release` where the repository declares itself in a plugin.toml:
#
#   pin:
#     needs: publish
#     uses: ./.github/workflows/manifest-pin.yml
#     with:
#       image: ghcr.io/lemonfiber/<name>
#       tag: <the tag published>
#       digest: <its index digest>
#     secrets:
#       RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
name: manifest-pin
on:
  workflow_call:
    inputs:
      image:
        description: "The image published, as ghcr.io/lemonfiber/<name>."
        type: string
        required: true
      tag:
        description: "The tag it was published at."
        type: string
        required: true
      digest:
        description: "The digest of the index published at that tag."
        type: string
        required: true
      directory:
        description: "The plugin's root in the calling repository, holding plugin.toml."
        type: string
        required: false
        default: "."
    secrets:
      RELEASE_APP_KEY:
        description: "The release App's private key, which writes the rolling pin pull request."
        required: false

permissions:
  contents: read

env:
  TAG_PIN_BRANCH: release/image-pin
  COMMIT_PIN_BRANCH: release/image-commit-pin

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    outputs:
      branch: ${{ steps.pinned.outputs.branch }}
      head: ${{ steps.pinned.outputs.head }}
      title: ${{ steps.pinned.outputs.title }}
      body: ${{ steps.pinned.outputs.body }}
    steps:
      - name: Mint a token that can write the manifest
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          repositories: ${{ github.event.repository.name }}
      - name: Which rolling branch the pin goes on
        id: branch
        run: |
          set -euo pipefail
          branch="$COMMIT_PIN_BRANCH"
          [ "$GITHUB_REF_TYPE" != tag ] || branch="$TAG_PIN_BRANCH"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      # The rewrite from the commit this workflow was called at, so a caller pinned at
      # a revision runs that revision's. No repository of the caller's is checked out:
      # the manifest arrives through the contents API, into an empty workspace.
      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
          persist-credentials: false
      - name: Put what this tag or commit published on its rolling branch
        id: pinned
        env:
          TOOLING: ${{ github.workspace }}/.spec-tooling
          PIN_BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
          DIRECTORY: ${{ inputs.directory }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          pins="$(gh api "repos/${REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq "map(select(
            .merged_at != null and .merge_commit_sha == \"${GITHUB_SHA}\"
            and (.head.ref == \"${TAG_PIN_BRANCH}\" or .head.ref == \"${COMMIT_PIN_BRANCH}\")
            and .head.repo.full_name == \"${REPOSITORY}\" and .user.login == \"${BOT}\")) | length")"
          if [ "$pins" != "0" ]; then
            echo "::notice::${GITHUB_SHA} merges a pin, so ${TAG} is published and not pinned."
            exit 0
          fi
          manifest="plugin.toml"
          [ "$DIRECTORY" = "." ] || manifest="${DIRECTORY%/}/plugin.toml"
          main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if gh api "repos/${REPOSITORY}/git/ref/heads/${PIN_BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/${PIN_BRANCH}" \
              -f "sha=${main}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f "ref=refs/heads/${PIN_BRANCH}" -f "sha=${main}" >/dev/null
          fi
          gh api "repos/${REPOSITORY}/contents/${manifest}?ref=${PIN_BRANCH}" > held.json
          python3 -I -c 'import base64, json, sys; sys.stdout.buffer.write(base64.b64decode(json.load(open("held.json"))["content"]))' \
            > plugin.toml
          moved="$(python3 "$TOOLING/scripts/plugin_pin.py" --manifest plugin.toml \
            --image "$IMAGE" --tag "${TAG#v}" --digest "$DIGEST")"
          if [ -z "$moved" ]; then
            echo "::notice::no service of the manifest runs ${IMAGE}, so there is nothing to pin"
            exit 0
          fi
          message="$(printf '%s\n\n%s\n%s\n' \
            "chore(manifest): the image at ${TAG}" \
            "Spec: OPS-R90, OPS-R91" \
            "Signed-off-by: lemonfiber release <info@nightworks.io>")"
          head="$(gh api --method PUT "repos/${REPOSITORY}/contents/${manifest}" \
            -f "message=${message}" \
            -f "content=$(base64 -w0 plugin.toml)" \
            -f "sha=$(python3 -I -c 'import json; print(json.load(open("held.json"))["sha"])')" \
            -f "branch=${PIN_BRANCH}" --jq .commit.sha)"
          delimiter="body_$(openssl rand -hex 16)"
          {
            echo "branch=${PIN_BRANCH}"
            echo "head=${head}"
            echo "title=chore(manifest): the image at ${TAG}"
            echo "body<<${delimiter}"
            printf '%s\n\n%s\n%s\n' \
              "Every service of plugin.toml running ${IMAGE} runs the image ${TAG} published, at ${DIGEST}." \
              "Spec: OPS-R90, OPS-R91" \
              "Signed-off-by: lemonfiber release <info@nightworks.io>"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "the manifest's image is proposed at ${TAG}, ${DIGEST}."

  pull-request:
    needs: pin
    if: needs.pin.outputs.head != ''
    permissions:
      contents: read
    uses: ./.github/workflows/rolling-pull-request.yml
    with:
      branch: ${{ needs.pin.outputs.branch }}
      head: ${{ needs.pin.outputs.head }}
      title: ${{ needs.pin.outputs.title }}
      body: ${{ needs.pin.outputs.body }}
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
