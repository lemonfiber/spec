# Gate spec PRs on zero new SonarCloud issues. The scan is SonarCloud Automatic
# Analysis; this reads its summary and enforces the standard the free-plan gate
# cannot (Q-R64), via the shared reusable so the rule has one definition.
name: sonar
on:
  pull_request:
  # A merge queue asks for every context `main` requires again, on its own
  # branch: `main`'s tip with the queued pull requests applied. A context that
  # never reports there is read as a wait, and the queue drops the pull request
  # at the timeout naming nothing. The reusable's `gate` job runs on this
  # event too, and asks there what a batch can be asked: the new-issue count
  # of every pull request in it, and the open count against the project. It
  # never skips to a pass, because a skipped `gate / gate` reports success.
  merge_group:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: ./.github/workflows/sonar-gate.yml
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
