# Spec-side integrity: identifiers resolve, none duplicated, links unbroken.
# The spec is subject to its own rules (GOV-R11). See 50-governance/.
name: integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check spec integrity
        run: python3 scripts/integrity.py
