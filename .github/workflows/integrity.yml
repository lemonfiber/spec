# Spec-side integrity: identifiers resolve, none duplicated, links unbroken.
# The spec is subject to its own rules (GOV-R11). See 50-governance/.
name: integrity

on:
  pull_request:
  # A merge queue asks for every context `main` requires again, on its own
  # branch: `main`'s tip with the queued pull requests applied. A context that
  # never reports there is read as a wait, and the queue drops the pull request
  # at the timeout naming nothing. Nothing here reads the pull request, so on
  # this event the same checks run over the merged batch.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request pushed again cancels the run on its old head, which nobody
  # will read and which holds runners the org shares (Q-R75). Every other event
  # (a push to main, a merge queue, a schedule) is grouped by its own run, so it
  # is never cancelled and never cancels.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Before the scripts are asked to judge anything, since they are what does
      # the judging here and in every repo that calls the reusable workflows.
      - name: Lint the scripts
        # `shared/gates/` too: it is Python that decides whether a merge may
        # happen in six repositories, and it was linted in none of them.
        run: pipx run ruff==0.16.4 check scripts/ shared/gates/
      - name: Check spec integrity
        run: python3 scripts/integrity.py
      - name: Validate feature frontmatter
        run: python3 scripts/check_frontmatter.py
      - name: Nothing is scheduled before what it requires
        run: python3 scripts/check_order.py
      - name: Nothing binding rests on something that is not agreed
        run: python3 scripts/check_binding_order.py
      - name: Every accepted requirement is on the release train
        run: python3 scripts/check_goal_coverage.py
      # The one number here that lives in another repository. `lemonfiber-media-stack`
      # guards its own prose against its own manifest; this is the half the spec was
      # missing, which is why ten pages here said nineteen services through the day a
      # twentieth shipped. Read over the wire rather than from a pin: what each
      # release embedded is already recorded in that version's `[pins]`, and a pin
      # read here would have been green against stale input and red against correct
      # prose.
      - name: The bundled-service count matches the stack
        run: python3 scripts/check_services.py
      # The binary's tracker, read over the wire for the same reason: a feature
      # this repository calls finished has to be ticked whole there, and a change
      # here that adds a requirement to one without reopening it is refused before
      # it merges rather than in the binary's next pull request (OPS-R73).
      - name: A finished feature is ticked whole in the binary's tracker
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o tracker.md \
            https://raw.githubusercontent.com/lemonfiber/lemonfiber/main/IMPLEMENTATION-STATUS.md
          python3 scripts/status_lint.py --status tracker.md --spec . --only reopened
      # `gen_gates.py` reads the reusable workflows and writes `gates.yml`, which
      # takes a YAML reader; the version is the one the coverage job installs.
      - name: Install the YAML reader the gates generator uses
        run: pip install --disable-pip-version-check --only-binary ":all:" pyyaml==6.0.3
      # Every surface a script writes, regenerated and compared against what is
      # committed. `accessibility.md` is why this has to be a gate rather than a
      # convention: the page states that whether the palette meets AA is a
      # computed property of the tokens rather than an opinion, and this is what
      # makes that true of the page itself — a token change nobody regenerated is
      # a red run rather than a page quoting a ratio that stopped being the ratio
      # (DES-R15, DES-R19).
      #
      # One step rather than four, reading one table rather than four pairs of
      # lines. A refusal names the generator that owns the file, the command that
      # rewrites it and the region it owns; a bare diff said a file had moved and
      # left the contributor to work out the rest.
      - name: Every generated file matches what its generator writes
        run: python3 scripts/generated.py
