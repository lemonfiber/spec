# Spec-side integrity: identifiers resolve, none duplicated, links unbroken.
# The spec is subject to its own rules (GOV-R11). See 50-governance/.
name: integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Before the scripts are asked to judge anything, since they are what does
      # the judging here and in every repo that calls the reusable workflows.
      - name: Lint the scripts
        run: pipx run ruff==0.16.4 check scripts/
      - name: Check spec integrity
        run: python3 scripts/integrity.py
      - name: Validate feature frontmatter
        run: python3 scripts/check_frontmatter.py
      - name: The roadmap's version table matches the manifests
        run: |
          python3 scripts/gen_roadmap_table.py
          git diff --exit-code 00-overview/roadmap.md
      - name: Nothing is scheduled before what it requires
        run: python3 scripts/check_order.py
      - name: Nothing binding rests on something that is not agreed
        run: python3 scripts/check_binding_order.py
      - name: Every accepted requirement is on the release train
        run: python3 scripts/check_goal_coverage.py
      - name: Feature board is up to date
        run: |
          python3 scripts/gen_board.py
          git diff --exit-code -- 10-functional/features/index.json 10-functional/features/BOARD.md
      - name: The repository table and diagram match the registry
        run: |
          python3 scripts/gen_repos.py
          git diff --exit-code -- 30-repos/README.md
      # The page states that whether the palette meets AA is a computed property
      # of the tokens rather than an opinion. This is what makes that true of the
      # page itself: the numbers are measured here and diffed, so a token change
      # that nobody regenerated is a red run rather than a page quoting a ratio
      # that stopped being the ratio (DES-R15, DES-R19).
      - name: The contrast table matches the tokens
        run: |
          python3 scripts/gen_contrast.py
          git diff --exit-code -- 60-brand/accessibility.md
