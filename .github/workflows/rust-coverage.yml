# Hold a Rust crate to 100% line coverage, scan it with SonarQube Cloud, and
# gate its pull requests on zero SonarCloud issues (Q-R61, Q-R64).
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
#     cancel-in-progress: true
#   jobs:
#     sonar:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: lemonfiber/spec/.github/workflows/rust-coverage.yml@<sha> # vX.Y.Z
#       with:
#         allowed-open: 0
#       secrets:
#         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#
# The checks it reports are `sonar / coverage`, `sonar / sonar` and
# `sonar / gate / gate`, named after the calling job.
name: rust-coverage
on:
  workflow_call:
    inputs:
      allowed-open:
        description: "Open SonarCloud issues the repository still carries, as sonar-gate.yml reads it: a ceiling that may only fall (Q-R67)."
        type: number
        default: 0
      ignored:
        description: "The files left out of the coverage measure, as cargo llvm-cov's --ignore-filename-regex. The process entry point by default."
        type: string
        default: 'src/main\.rs'
    secrets:
      SONAR_TOKEN:
        description: "The SonarCloud token. A pull request from a fork or Dependabot has none, and the scan says it was skipped."
        required: false
permissions:
  contents: read

# The token never shares a runner with code the repository builds. `coverage`
# compiles and runs every dependency's build script and every test, and a step on
# the same runner can rewrite what a later step runs — the tool cache, a
# downloaded action, `PATH` through `$GITHUB_PATH` — so it holds no secret and
# hands on only its report. `sonar` checks the tree out, reads that report and
# runs the scanner, and runs nothing from the repository. Only `sonar` and the
# gate are given `SONAR_TOKEN`, which is why a Dependabot run may be given it too.
# The report is read as data and nothing else: it lands outside the workspace, is
# refused unless it is the one regular file expected, and reaches the scanner as
# an argument, so it can overwrite nothing the scanner reads and is never run.
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview
      # Its own key: instrumented artifacts are not the ones `check` builds, and a
      # shared key would have each job evicting the other's work.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: llvm-cov
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      # Every line outside the process entry point runs under a test, as in the core.
      - name: Coverage (100% of lines outside what the caller names)
        env:
          IGNORED: ${{ inputs.ignored }}
        run: cargo llvm-cov --locked --ignore-filename-regex "$IGNORED" --fail-under-lines 100 --lcov --output-path lcov.info
      # The report names each file by its absolute path, which is the same path in
      # the scan job's checkout: both run in this repository's workspace.
      - name: Hand the report to the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 1
          if-no-files-found: error

  sonar:
    needs: coverage
    # Runs whatever coverage did, and fails at once when it failed: a skipped job
    # reports as passing, so `sonar` would read green over a coverage gate that was
    # not met. `!cancelled()` rather than `always()`, because a cancelled run is
    # somebody pressing stop.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The coverage gate held
        env:
          RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The coverage job finished with ${RESULT}, so there is no report to scan."
            exit 1
          fi
      # Whole history, so the scanner can tell which lines a pull request changed
      # and blame each one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The scanner reads its configuration out of the tree, and a pull request
      # writes that tree: a `sonar.host.url`, a proxy or a trust store named
      # there would hand the token to somebody else. On a pull request the file
      # is the base branch's, or absent where the base has none, and the host is
      # named on the scanner's command line on every event. On a push the
      # branch's own copy already is the base's.
      - name: The scanner's configuration is the base branch's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CONFIG: sonar-project.properties
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "A push is scanned with the configuration it carries, which is its branch's own."
            exit 0
          fi
          said="${RUNNER_TEMP}/configuration-error"
          find . -path ./.git -prune -o \( -name "$CONFIG" -o -name .sonarcloud.properties \) -print0 | xargs -0 rm -rf --
          if gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${REPO}/contents/${CONFIG}?ref=${BASE_SHA}" > "$CONFIG" 2> "$said"; then
            echo "${CONFIG}: the base branch's copy"
          elif grep -qF "(HTTP 404)" "$said"; then
            rm -f -- "$CONFIG"
            echo "${CONFIG}: the base branch has none, so none is read"
          else
            cat "$said" >&2
            echo "::error::${CONFIG} could not be read at the base branch, so the scan would read the pull request's own."
            exit 1
          fi
      # A sensor that runs a toolchain runs the tree with it: Clippy through
      # cargo would build the crate, its build scripts and its proc macros,
      # beside the token. Clippy is switched off on the scanner's command line,
      # and the toolchain the runner image ships is taken away, so nothing here
      # could build the tree if a sensor asked to.
      - name: No toolchain that could build the tree
        run: |
          set -euo pipefail
          rm -rf -- "${HOME}/.cargo" "${HOME}/.rustup"
          for tool in cargo rustc rustup; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} is still on this runner at $(command -v "$tool"), so a sensor could build the tree beside the token."
              exit 1
            fi
          done
      # Into the runner's temporary directory, never the workspace: the artifact
      # comes from the job that ran the repository's code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov
          path: ${{ runner.temp }}/coverage
      # What was found is reduced to one line of plain characters before it is
      # printed, so a file name cannot read as a workflow command.
      - name: The report is the one file expected
        env:
          DIR: ${{ runner.temp }}/coverage
          EXPECTED: lcov.info
        run: |
          set -euo pipefail
          found=$(find "$DIR" -mindepth 1 -printf '%P:%y,' | tr -c 'A-Za-z0-9._:,/-' '?')
          if [ "$found" != "${EXPECTED}:f," ]; then
            echo "::error::The coverage artifact has to hold ${EXPECTED} as a regular file and nothing else. It held (name:type, f file, l link, d directory): ${found:-nothing}"
            exit 1
          fi
      # A pull request from a fork reads no secret store, and a Dependabot run reads
      # the Dependabot one, so a pull request can arrive without a token.
      - name: Whether a token reached this run
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request without a token skips the scan rather than failing on an empty
      # one. A push to main and a merge group scan whatever they were given, so a
      # missing token there fails here, where it is named, and main's analysis is
      # what every pull request is measured against.
      - name: SonarQube Cloud scan
        id: scan
        if: github.event_name != 'pull_request' || steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # The report's path is given here rather than in `sonar-project.properties`.
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.rust.lcov.reportPaths=${{ runner.temp }}/coverage/lcov.info
      # Runs when the scan failed, and says whether the host was answering: a scanner
      # that cannot reach SonarCloud fails with a trace that reads like a finding.
      # It changes nothing about the run; the scan still failed and the check is red.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage ran in its own job and had to reach 100% either way. Re-run this job once sonarcloud.io is answering — no analysis gated this run."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. No analysis gated this run."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      # A skipped step is missing from the log, which reads the same as one that ran
      # and found nothing, so the skip is said under its own name.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && steps.token.outputs.present != 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: no SONAR_TOKEN reached this run of a pull request opened by ${AUTHOR}. A pull request from a fork reads no secret store, and a Dependabot run reads the Dependabot one. Coverage ran in its own job and still had to reach 100%. No analysis was produced, so none gated this run."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # The shared issue gate, which reads the scan's summary and holds the open
  # count to the allowance. It runs whatever the scan did, because `needs` alone
  # would drop it when the scan fails, and a check that never reports leaves a
  # pull request with no line saying why. `!cancelled()` rather than
  # `always()`, because a cancelled run is somebody pressing stop.
  gate:
    needs: sonar
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/sonar-gate.yml
    with:
      allowed-open: ${{ inputs.allowed-open }}
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
