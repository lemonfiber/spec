# New issues: label needs-triage, assign the covering maintainer from the
# generated CODEOWNERS, and post to the private maintainer channel.
# OPS-R25, OPS-R27.
#
# Spec runs it on its own issues, and every other repository calls it from a
# workflow that declares the trigger, which a reusable cannot declare for it:
#
#   on:
#     issues:
#       types: [opened, reopened]
#   jobs:
#     triage:
#       permissions:
#         contents: read
#         issues: write
#       uses: lemonfiber/spec/.github/workflows/triage.yml@<sha> # vX.Y.Z
#       secrets:
#         DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
name: triage
on:
  issues:
    types: [opened, reopened]
  workflow_call:
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK:
        description: "The private maintainer channel's webhook. Without it the post is skipped."
        required: false
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Label and assign
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --add-label needs-triage || true
          owners=$(awk '/^\* /{for (i=2; i<=NF; i++) print $i}' .github/CODEOWNERS | tr -d '@' | paste -sd, -)
          if [ -n "$owners" ]; then gh issue edit "$NUM" --add-assignee "$owners" || true; fi
  notify:
    needs: triage
    uses: ./.github/workflows/discord-notify.yml
    with:
      title: "📥 Needs triage · ${{ github.event.repository.name }} #${{ github.event.issue.number }}"
      body: ${{ github.event.issue.title }}
      url: ${{ github.event.issue.html_url }}
      color: "15105570"
    secrets:
      webhook: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
