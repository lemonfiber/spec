# Reusable: publish a first-party adapter's image from a tag the release train cut, and
# from every commit on main (ADR-0033 §3, ADR-0042 §7, OPS-R90), and propose the digest
# it published to the plugin's manifest, with every recording taken again from it
# (OPS-R91).
#
# Two things publish. A tag `vX.Y.Z`, or `vX.Y.Z-<identifier>` for a pre-release, on a
# commit `main` holds, publishes under that tag. Every commit on `main` publishes under
# `main-<first 12 of the commit>`; that is a pinned build of `main`, not a release, and
# nothing announces it. A push to `main` whose change from the commit before it is only
# a pin's, at most `plugin.toml`, `proofs.json`, `targets.toml` and what is under
# `recordings/`, publishes nothing, so merging a pin's pull request never starts the
# next one (OPS-R90). Either way each platform is built on a runner of its own
# architecture and pushed by digest; the two are joined under one multi-architecture
# index at the image the manifest's adapter service names,
# `ghcr.io/lemonfiber/<crate>:<tag>`, which carries BuildKit's SBOM and provenance, and
# gets a build-provenance attestation and an SBOM attestation per platform from GitHub.
# A tag already published is kept, never moved.
#
# The manifest names the adapter by digest, so the digest reaches it after the publish:
# `manifest-pin`, called with `pin: adapter`, updates one rolling pull request on the
# calling repository setting the adapter service's `digest` and `tag`, with every
# recording the manifest names taken again from the new image and `proofs.json`
# written from them. A tag's pin is on `release/adapter-pin`, and the bundle in
# lemonfiber-plugins pins the manifest that pull request merges, through
# `first-party-bundle`. A commit's pin is on `release/adapter-commit-pin`, which moves
# the manifest and never the bundle.
#
# Building, publishing and attesting hold the run's own token and nothing of the
# caller's secrets; the release App's key reaches only the jobs of `manifest-pin`
# that hold it, which run nothing of the repository's.
#
#   on:
#     push:
#       tags: ["v*"]
#       branches: [main]
#   permissions:
#     contents: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: false
#   jobs:
#     release:
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#       uses: lemonfiber/spec/.github/workflows/adapter-release.yml@<sha> # vX.Y.Z
#       secrets:
#         RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
name: adapter-release
on:
  workflow_call:
    secrets:
      RELEASE_APP_KEY:
        description: "The release App's private key, which writes the rolling pin pull request."
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/lemonfiber
  BUILDKIT: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  SBOM_SCANNER: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  settle:
    if: github.event_name == 'push' && github.repository_owner == 'lemonfiber'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.what.outputs.image }}
      tag: ${{ steps.what.outputs.tag }}
      publish: ${{ steps.what.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
          persist-credentials: false
      - name: A tag the train cuts, on main, at the version the crate declares; or a commit on main
        id: what
        env:
          KIND: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          TOOLING: ${{ github.workspace }}/.spec-tooling
        run: |
          set -euo pipefail
          PUBLISH=yes
          if [ "$KIND" = branch ]; then
            [ "$REF" = refs/heads/main ] || { echo "::error::${REF} is not main, and no other branch publishes"; exit 1; }
            TAG="main-${GITHUB_SHA:0:12}"
            pins="$(python3 "$TOOLING/scripts/pin_bump.py" pins-only --before "$BEFORE" --after "$GITHUB_SHA")"
            if [ "$pins" = yes ]; then
              PUBLISH=no
              echo "::notice::${GITHUB_SHA} changes nothing but a pin, so no image is published from it"
            fi
          else
            TAG="$NAME"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
              || [[ "$TAG" =~ ^v[0-9.]+-rc[0-9]*(\.|$) ]]; then
              echo "::error::'${TAG}' is not a tag the train cuts: vX.Y.Z, or vX.Y.Z-<identifier> other than rc"
              exit 1
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::${TAG} points at ${GITHUB_SHA}, which main does not hold"
              exit 1
            fi
          fi

          python3 -I - "$TAG" "$REGISTRY" "$KIND" "$PUBLISH" <<'PY'
          import os, sys, tomllib
          tag, registry, kind, publish = sys.argv[1:5]
          crate = tomllib.load(open("Cargo.toml", "rb"))["package"]
          tagged = kind == "tag"
          if tagged and f"v{crate['version']}" != tag:
              sys.exit(f"::error::the crate declares {crate['version']}, so it is not tagged {tag}")
          image = f"{registry}/{crate['name']}"
          manifest = tomllib.load(open("plugin.toml", "rb"))
          adapters = [one for one in manifest.get("service", []) if one.get("speaks")]
          if adapters:
              if tagged and manifest["plugin"]["version"] != crate["version"]:
                  sys.exit(f"::error::the manifest declares {manifest['plugin']['version']}, so it is not tagged {tag}")
              if [one["image"] for one in adapters] != [image]:
                  sys.exit(f"::error::the manifest's adapter service does not name {image}")
          else:
              print(f"::notice::plugin.toml declares no adapter service yet, so nothing will pin {image}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"image={image}\ntag={tag}\npublish={publish}\n")
          if publish == "yes":
              print(f"publishing {image}:{tag}")
          PY

  build:
    needs: settle
    if: needs.settle.outputs.publish == 'yes'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build on this platform and push by digest
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.settle.outputs.image }}
          TAG: ${{ needs.settle.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx create --use --driver docker-container --driver-opt "image=${BUILDKIT}" >/dev/null
          docker buildx build . \
            --platform "$PLATFORM" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance mode=max \
            --attest "type=sbom,generator=${SBOM_SCANNER}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          digest="$(python3 -I -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the build reported no digest: '${digest}'"; exit 1; }
          mkdir -p digests
          touch "digests/${digest#sha256:}"
          echo "${PLATFORM} pushed as ${digest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [settle, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Join the platforms under one index, tagged
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.settle.outputs.image }}
          TAG: ${{ needs.settle.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          sources=()
          for file in digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "$file")")
          done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected two platform digests, got ${#sources[@]}"; exit 1; }
          # A published tag never moves (OPS-R90): a run again for the same commit or
          # tag keeps the index already there, and attests that one.
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} is already published, and a published tag does not move"
          else
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${sources[@]}"
          fi

          docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' > descriptor.json
          digest="$(python3 -I -c 'import json; print(json.load(open("descriptor.json"))["digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the registry named no index digest: '${digest}'"; exit 1; }
          docker buildx imagetools inspect --raw "${IMAGE}@${digest}" > index.json
          python3 -I - "$digest" <<'PY'
          import json, os, sys
          index = json.load(open("index.json"))
          found = {
              f"{m['platform']['os']}/{m['platform']['architecture']}": m["digest"]
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("os") not in (None, "unknown")
          }
          missing = {"linux/amd64", "linux/arm64"} - set(found)
          if missing:
              sys.exit(f"::error::the index does not publish {', '.join(sorted(missing))}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"digest={sys.argv[1]}\n")
              out.write(f"amd64={found['linux/amd64']}\n")
              out.write(f"arm64={found['linux/arm64']}\n")
          PY
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "${IMAGE}:${TAG}" \
              --format "{{ json (index .SBOM \"linux/${arch}\").SPDX }}" > "sbom-${arch}.spdx.json"
          done
          {
            echo "## ${IMAGE}:${TAG}"
            echo
            echo "Index digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published ${IMAGE}:${TAG} as ${digest}"
      - name: Attest the index's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/amd64 image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/arm64 image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/amd64 image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/arm64 image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.settle.outputs.image }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

  # `manifest-pin` puts a commit image on the adapter's commit branch and a train tag on
  # its tag branch, with every recording taken again from it. A manifest declaring no
  # adapter service yet runs nothing of the image, and is left as it is.
  manifest:
    needs: [settle, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/manifest-pin.yml
    with:
      image: ${{ needs.settle.outputs.image }}
      tag: ${{ needs.settle.outputs.tag }}
      digest: ${{ needs.publish.outputs.digest }}
      pin: adapter
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
