# Reusable PR goal automations — OPS-R39, OPS-R40, OPS-R42.
#
# Called by each implementation repo on pull_request. Classifies the PR's cited
# requirement IDs against whichever version is staged and then: labels an
# in-scope PR with its version, puts it in that version's milestone, and posts a
# self-updating goal-advance comment; flags a PR that cites only out-of-scope
# requirements with `scope:next`. No-ops when nothing is staged. Same-repo PRs
# only — a fork PR's token cannot label.
#
# The milestone is created where it does not exist rather than kept in step by
# hand. OPS-R39 asks for two things and this workflow did one of them: it minted
# the label and touched no milestone, and no repository in the org had a
# milestone for any version at all — so the half that was implemented had nothing
# to be half of. A milestone list maintained beside the version manifests is a
# second copy of the release train; read from the manifest and made on demand, it
# is the same list.
name: goal-automations

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  # A milestone is an issues-API object even when it is put on a pull request,
  # so `pull-requests: write` alone cannot create one or apply one. A caller
  # granting less than this gets the label and no milestone.
  issues: write

jobs:
  classify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
      - name: Gather the PR text
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$PR_BODY"
            gh api "repos/${REPO}/pulls/${PR}/commits" --jq '.[].commit.message'
          } > pr.txt
      - name: Classify and act
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/pr_goals.py --pr-text pr.txt > result.json
          cat result.json
          python3 - <<'PY'
          import json, os, subprocess

          r = json.load(open("result.json"))
          repo, pr = os.environ["REPO"], os.environ["PR"]
          MARK = "<!-- goal-automations -->"

          def gh(*args):
              subprocess.run(["gh", *args], check=False)

          def read(*args):
              return subprocess.run(["gh", *args], capture_output=True,
                                    text=True, check=False).stdout.strip()

          def milestone(version, delivers):
              """This version's milestone number, made if the repository has none.

              Looked up by title over every state, because a version's milestone is
              closed when the version ships and a hotfix citing one of its goals
              afterwards must land in the same milestone rather than mint a second
              one beside it.

              Made rather than expected. No repository in the org has ever had a
              milestone for a version, so a workflow that only applied existing ones
              would go on doing nothing and reporting success — and a list of
              milestones kept by hand is the version manifests written out twice.
              The description is the manifest's own `delivers`, carried through the
              classifier for the same reason.
              """
              title = f"v{version}"
              found = read("api", f"repos/{repo}/milestones", "-X", "GET",
                           "-f", "state=all", "--jq",
                           f'[.[] | select(.title == "{title}") | .number] | first // empty')
              if found:
                  return found
              return read("api", "--method", "POST", f"repos/{repo}/milestones",
                          "-f", f"title={title}", "-f", f"description={delivers}",
                          "--jq", ".number // empty")

          if not r.get("staged"):
              raise SystemExit(0)
          version = r["staged"]

          if r["in_scope"]:
              label = f"v{version}"
              gh("label", "create", label, "--repo", repo, "--force",
                 "--color", "0e8a16", "--description", f"Targets release {version}")
              gh("pr", "edit", pr, "--repo", repo, "--add-label", label)
              at = milestone(version, r.get("delivers", ""))
              if at:
                  # Sent as a number rather than a string: the field is an integer
                  # and the API refuses the quoted form `-f` would produce.
                  gh("api", "--method", "PATCH", f"repos/{repo}/issues/{pr}",
                     "-F", f"milestone={at}")
              else:
                  print(f"::warning::no milestone v{version} in {repo} and none could "
                        "be made, so this PR carries the label without one (OPS-R39)")
              goals = ", ".join(f"`{g}`" for g in r["in_scope"])
              body = f"{MARK}\n🎯 Advances **{version}** — {goals}."
          elif r["advisory"]:
              gh("pr", "edit", pr, "--repo", repo, "--add-label", "scope:next")
              out = ", ".join(f"`{g}`" for g in r["out_of_scope"])
              body = f"{MARK}\nℹ️ Cites requirements outside the staged **{version}** scope ({out}); routed to the next version."
          else:
              raise SystemExit(0)

          find = subprocess.run(
              ["gh", "api", f"repos/{repo}/issues/{pr}/comments", "--jq",
               f'[.[] | select(.body | startswith("{MARK}")) | .id] | first // empty'],
              capture_output=True, text=True)
          existing = find.stdout.strip()
          if existing:
              gh("api", "--method", "PATCH", f"repos/{repo}/issues/comments/{existing}",
                 "-f", f"body={body}")
          else:
              gh("api", "--method", "POST", f"repos/{repo}/issues/{pr}/comments",
                 "-f", f"body={body}")
          PY
