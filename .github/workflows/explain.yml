# Post the explainers for the two checks that surprise a first-time contributor
# anywhere in this organisation (GOV-R33) — the citation gate, which closes a
# pull request rather than only failing it, and the DCO check, which skips merge
# and bot commits. A detect job decides whether the advice is needed at all; the
# explainer is posted only then, and removed once the pull request becomes
# compliant. Advice where it helps, not noise where it doesn't.
#
# Both checks run in every repository in the org, so the explanation is called
# from every repository too:
#
#     explain:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: lemonfiber/spec/.github/workflows/explain.yml@<sha> # main
#
# `pull-requests: write` is what lets it post and delete the comment. A caller
# granting less than a reusable workflow asks for fails the whole run before any
# job starts, so the block is not optional.
#
# The two jobs below reach `explain-check.yml` by relative path, which resolves
# against this repository at the revision the caller pinned — not against the
# calling repository, which has no copy of it and needs none.
name: explain
on:
  pull_request:
  workflow_call:
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      citation: ${{ steps.d.outputs.citation }}
      dco: ${{ steps.d.outputs.dco }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A Spec: trailer in the body or any commit means the citation is done.
          text=$( { printf '%s\n' "$PR_BODY"; git log --format=%B "${BASE}..${HEAD}" 2>/dev/null || true; } )
          # Counted rather than `grep -q`: the text is the body and every commit
          # message, which can take more than one write, and a `grep -q` that
          # exits at the first trailer leaves `printf` to die of SIGPIPE, which
          # `pipefail` turns into "no trailer".
          cited=$(printf '%s' "$text" | grep -ciE '^[[:space:]]*Spec:[[:space:]]*[A-Za-z]' || true)
          if [ "${cited:-0}" -gt 0 ]; then
            echo "citation=satisfied" >> "$GITHUB_OUTPUT"
          else
            echo "citation=needed" >> "$GITHUB_OUTPUT"
          fi
          # The DCO exemption is only worth explaining if a merge or bot commit
          # is actually present in the range.
          merges=$(git rev-list --merges --count "${BASE}..${HEAD}" 2>/dev/null || echo 0)
          bots=$(git log --format='%an' "${BASE}..${HEAD}" 2>/dev/null | grep -c '\[bot\]$' || true)
          if [ "${merges:-0}" -gt 0 ] || [ "${bots:-0}" -gt 0 ]; then
            echo "dco=relevant" >> "$GITHUB_OUTPUT"
          else
            echo "dco=not-relevant" >> "$GITHUB_OUTPUT"
          fi
  citation:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: citation-gate
      needed: ${{ needs.detect.outputs.citation == 'needed' && 'true' || 'false' }}
      title: "📎 Why this repo needs a `Spec:` citation"
      body: |
        This project is spec-led: every change cites a spec identifier that already
        exists on `main`, and `spec-check` fails without one — not to reject the
        work, but to sequence it. Add a `Spec:` trailer to a commit **or** the PR
        body, on its own line, e.g. `Spec: OPS-R1`. Routine maintenance
        (dependencies, formatting, CI) cites `GOV-R12`. Changing behaviour? Open the
        spec PR first, then cite the new identifier. See 50-governance/contributing.md.
  dco:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: dco-exemption
      needed: ${{ needs.detect.outputs.dco == 'relevant' && 'true' || 'false' }}
      title: "✍️ DCO sign-off — and what is exempt"
      body: |
        Every human commit needs a `Signed-off-by:` line matching its author — add
        it with `git commit -s`. Merge commits and bot commits are skipped, because
        GitHub authors them (branch updates, auto-merges) and there is no human to
        attest. So if the DCO check passes with an unsigned merge commit in the
        range, that is by design, not a gap. See 50-governance/dco.md.
