# Post the explainers for the two checks that surprise a first-time contributor
# anywhere in this organisation (GOV-R33) — the citation gate, which closes a
# pull request rather than only failing it, and the DCO check, which skips merge
# and bot commits — and the advice `scripts/assist.py` gives: the citation that
# fits a first-time contributor's change, where to edit a page a site mirrors,
# and which cited goals the tracker has not caught up with. A detect job decides
# whether each is needed at all; each explainer is posted only then, and removed
# once the pull request no longer needs it. Advice where it helps, not noise
# where it doesn't.
#
# The pull request's code is never run. The checkout is read as data — the
# changed paths, the tracker and `mirrors.json` — and the rules are spec's own
# script, checked out from spec's main beside it.
#
# Both checks run in every repository in the org, so the explanation is called
# from every repository too:
#
#     explain:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: lemonfiber/spec/.github/workflows/explain.yml@<sha> # main
#
# `pull-requests: write` is what lets it post and delete the comment. A caller
# granting less than a reusable workflow asks for fails the whole run before any
# job starts, so the block is not optional.
#
# The two jobs below reach `explain-check.yml` by relative path, which resolves
# against this repository at the revision the caller pinned — not against the
# calling repository, which has no copy of it and needs none.
name: explain
on:
  pull_request:
  workflow_call:
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      citation: ${{ steps.d.outputs.citation }}
      dco: ${{ steps.d.outputs.dco }}
      suggest: ${{ steps.a.outputs.suggest }}
      mirrors: ${{ steps.a.outputs.mirrors }}
      status: ${{ steps.a.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # spec's scripts at the commit this workflow was called at, so a caller
      # pinned at a revision runs that revision's scripts. What they read stays
      # the canonical spec below.
      - name: Check out spec's scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lemonfiber/spec
          ref: ${{ job.workflow_sha }}
          path: .spec-tooling
      # The spec the advice reads: spec's main for another repository. Here the
      # workflow itself comes from the pull request, so it is read from the same
      # tree rather than from a main it may not yet be on.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: ${{ github.repository == 'lemonfiber/spec' && github.sha || 'main' }}
          path: .spec-canonical
          persist-credentials: false
      - id: d
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A Spec: trailer in the body or any commit means the citation is done.
          text=$( { printf '%s\n' "$PR_BODY"; git log --format=%B "${BASE}..${HEAD}" 2>/dev/null || true; } )
          # Counted rather than `grep -q`: the text is the body and every commit
          # message, which can take more than one write, and a `grep -q` that
          # exits at the first trailer leaves `printf` to die of SIGPIPE, which
          # `pipefail` turns into "no trailer".
          cited=$(printf '%s' "$text" | grep -ciE '^[[:space:]]*Spec:[[:space:]]*[A-Za-z]' || true)
          if [ "${cited:-0}" -gt 0 ]; then
            echo "citation=satisfied" >> "$GITHUB_OUTPUT"
          else
            echo "citation=needed" >> "$GITHUB_OUTPUT"
          fi
          # The DCO exemption is only worth explaining if a merge or bot commit
          # is actually present in the range.
          merges=$(git rev-list --merges --count "${BASE}..${HEAD}" 2>/dev/null || echo 0)
          bots=$(git log --format='%an' "${BASE}..${HEAD}" 2>/dev/null | grep -c '\[bot\]$' || true)
          if [ "${merges:-0}" -gt 0 ] || [ "${bots:-0}" -gt 0 ]; then
            echo "dco=relevant" >> "$GITHUB_OUTPUT"
          else
            echo "dco=not-relevant" >> "$GITHUB_OUTPUT"
          fi
      - id: a
        name: The advice assist.py gives
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE}...${HEAD}" > paths.txt
          { printf '%s\n' "$PR_BODY"; git log --format=%B "${BASE}..${HEAD}"; } > text.txt
          assist() { python3 -E -s .spec-tooling/scripts/assist.py "$@"; }
          # Each answer can run to several lines, so each is written between
          # delimiters no answer can contain.
          emit() {
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_OUTPUT"
          }
          # Assigned before they are emitted, so a rule that could not answer
          # fails the step rather than reading as one with nothing to say.
          suggest=$(assist citation --paths paths.txt --text text.txt --association "$ASSOCIATION")
          mirrors=""
          if [ -f mirrors.json ]; then
            mirrors=$(assist mirrors --paths paths.txt --mirrors mirrors.json --association "$ASSOCIATION")
          fi
          status=$(assist status --paths paths.txt --text text.txt --spec .spec-canonical --repo-root . --repo "$REPO")
          emit suggest "$suggest"
          emit mirrors "$mirrors"
          emit status "$status"
  citation:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: citation-gate
      needed: ${{ needs.detect.outputs.citation == 'needed' && 'true' || 'false' }}
      title: "📎 Why this repo needs a `Spec:` citation"
      body: |
        This project is spec-led: every change cites a spec identifier that already
        exists on `main`, and `spec-check` fails without one — not to reject the
        work, but to sequence it. Add a `Spec:` line to the PR body, on its own
        line, e.g. `Spec: OPS-R1`: the squash merge writes the body to `main`.
        Routine maintenance (dependencies, formatting, CI) cites `GOV-R12`.
        Changing behaviour? Open the spec PR first, then cite the new identifier.
        See 50-governance/contributing.md.

        ${{ needs.detect.outputs.suggest }}
  dco:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: dco-exemption
      needed: ${{ needs.detect.outputs.dco == 'relevant' && 'true' || 'false' }}
      title: "✍️ DCO sign-off — and what is exempt"
      body: |
        Every human commit needs a `Signed-off-by:` line matching its author — add
        it with `git commit -s`. Merge commits and bot commits are skipped, because
        GitHub authors them (branch updates, auto-merges) and there is no human to
        attest. So if the DCO check passes with an unsigned merge commit in the
        range, that is by design, not a gap. See 50-governance/dco.md.
  mirror:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: mirrored-page
      needed: ${{ needs.detect.outputs.mirrors != '' && 'true' || 'false' }}
      title: "🪞 This page lives in another repository"
      body: ${{ needs.detect.outputs.mirrors }}
  status:
    needs: detect
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/explain-check.yml
    with:
      check: status-reminder
      needed: ${{ needs.detect.outputs.status != '' && 'true' || 'false' }}
      title: "📋 The tracker and this pull request's goals"
      body: ${{ needs.detect.outputs.status }}
