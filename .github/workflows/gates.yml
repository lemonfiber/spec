    - name: 'security / osv-scanner: actions/checkout'
      id: security--osv-scanner--0
      if: ${{ ((steps.plan.outputs.security == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'security / osv-scanner: OSV-Scanner'
      id: security--osv-scanner--1
      if: ${{ ((steps.plan.outputs.security == 'true')) && (steps.security--osv-scanner--0.outcome != 'failure') }}
      uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
      with:
