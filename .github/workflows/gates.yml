        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 20
    - name: 'explain / detect: Check out the spec'
      id: explain--detect--1
      if: ${{ ((steps.plan.outputs.explain == 'true')) && (steps.explain--detect--0.outcome != 'failure') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lemonfiber/spec
