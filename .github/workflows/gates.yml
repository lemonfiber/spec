      with:
        persist-credentials: false
        repository: lemonfiber/spec
        ref: main
      continue-on-error: true
      timeout-minutes: 10
    - name: 'goals / classify: Gather the PR text'
      id: goals--classify--1
      if: ${{ ((needs.gates.outputs.plan--goals == 'true') && (github.event.pull_request.head.repo.full_name == github.repository)) && (steps.goals--classify--0.outcome != 'failure') }}
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
