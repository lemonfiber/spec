    - name: 'commitlint / commitlint: Lint commit subjects'
      id: commitlint--commitlint--3
      if: ${{ ((steps.plan.outputs.commitlint == 'true')) && (steps.commitlint--commitlint--0.outcome != 'failure') && (steps.commitlint--commitlint--1.outcome != 'failure') && (steps.commitlint--commitlint--2.outcome != 'failure') }}
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
