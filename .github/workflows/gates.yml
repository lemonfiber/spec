# The shared checks as one job. GENERATED by scripts/gen_gates.py from the
# reusable workflows each check names below; do not edit this file. Change the
# reusable, then run `python3 scripts/gen_gates.py`. generated.py refuses a
# copy that has drifted (Q-R82).
#
# A caller lists the checks it runs, by group, and skips any of them for an
# event:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened, ready_for_review]
#   jobs:
#     gates:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#       uses: lemonfiber/spec/.github/workflows/gates.yml@<sha>
#       with:
#         checks: spec-check hygiene workflow-pins security dco attribution commitlint squash-message explain labeler goals refs cap
#
# `gates` holds no write permission and runs every check's steps, each check in
# an empty workspace, each step only where the steps before it in the same check
# succeeded. It lists each verdict in the run's summary and fails when one
# failed, so a branch requires `gates / gates` alone, and a pull request from a
# fork runs it as it is. `report` closes, labels, classifies and posts and
# removes the comments; it judges nothing, runs no third-party tool, and starts
# for no pull request from a fork.
name: gates
on:
  workflow_call:
    inputs:
      checks:
        description: The checks this caller runs, by group, separated by spaces.
        type: string
        default: spec-check hygiene workflow-pins security dco attribution commitlint squash-message explain labeler goals refs cap
      skip:
        description: Checks to skip for this event, separated by spaces.
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan--spec-check: ${{ steps.plan.outputs.spec-check }}
      plan--hygiene: ${{ steps.plan.outputs.hygiene }}
      plan--workflow-pins: ${{ steps.plan.outputs.workflow-pins }}
      plan--security: ${{ steps.plan.outputs.security }}
      plan--dco: ${{ steps.plan.outputs.dco }}
      plan--attribution: ${{ steps.plan.outputs.attribution }}
      plan--commitlint: ${{ steps.plan.outputs.commitlint }}
      plan--squash-message: ${{ steps.plan.outputs.squash-message }}
      plan--explain: ${{ steps.plan.outputs.explain }}
      plan--labeler: ${{ steps.plan.outputs.labeler }}
      plan--goals: ${{ steps.plan.outputs.goals }}
      plan--refs: ${{ steps.plan.outputs.refs }}
      plan--cap: ${{ steps.plan.outputs.cap }}
      spec-check--spec-check--citation--outputs--reason: ${{ steps.spec-check--spec-check--citation.outputs.reason }}
      spec-check--spec-check--citation--outputs--status: ${{ steps.spec-check--spec-check--citation.outputs.status }}
      spec-check--spec-check--reached-6: ${{ (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') && (steps.spec-check--spec-check--4.outcome != 'failure') }}
      squash-message--squash-message--out--needed: ${{ steps.squash-message--squash-message--check.outputs.needed }}
      squash-message--squash-message--out--said: ${{ steps.squash-message--squash-message--check.outputs.said }}
      explain--detect--out--citation: ${{ steps.explain--detect--d.outputs.citation }}
      explain--detect--out--dco: ${{ steps.explain--detect--d.outputs.dco }}
      explain--detect--out--suggest: ${{ steps.explain--detect--a.outputs.suggest }}
      explain--detect--out--mirrors: ${{ steps.explain--detect--a.outputs.mirrors }}
      explain--detect--out--status: ${{ steps.explain--detect--a.outputs.status }}
    steps:
    - name: Which checks this caller runs
      id: plan
      env:
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        KNOWN: spec-check hygiene workflow-pins security dco attribution commitlint squash-message explain labeler goals refs cap
        CHECKS: ${{ inputs.checks }}
        SKIP: ${{ inputs.skip }}
      run: |
        set -euo pipefail
        # The checks run the canonical copies of spec's scripts, from its `main`. In the
        # spec repository a step chooses the pull request's own copy instead, and that
        # copy would share this runner with every other check, so spec's pull requests
        # test their scripts in spec's own jobs and never call this. A
        # `pull_request_target` caller would hand the checks a base-branch context over
        # a pull request's files; this is called from `pull_request`, `merge_group` and
        # `push` only.
        if [ "${REPO}" = "lemonfiber/spec" ]; then
          echo "::error::lemonfiber/spec runs its gates as its own workflows, so its pull requests' scripts never share a runner with another check's verdict."
          exit 1
        fi
        case "${EVENT}" in
        pull_request | merge_group | push) ;;
        *)
          echo "::error::The shared gates are called from pull_request, merge_group or push, not ${EVENT}."
          exit 1
          ;;
        esac
        # A check runs when the caller lists it and does not skip it. The lists are
        # words separated by spaces, and a word that names no check is refused, so a
        # misspelt name cannot quietly run nothing.
        known=" ${KNOWN} "
        for word in ${CHECKS} ${SKIP}; do
          case "$known" in
          *" ${word} "*) ;;
          *)
            echo "::error::${word} is not one of the shared gates. They are:${known% }"
            exit 1
            ;;
          esac
        done
        for group in ${KNOWN}; do
          case " ${CHECKS} " in
          *" ${group} "*)
            case " ${SKIP} " in
            *" ${group} "*) echo "${group}=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "${group}=true" >>"$GITHUB_OUTPUT" ;;
            esac
            ;;
          *) echo "${group}=false" >>"$GITHUB_OUTPUT" ;;
          esac
        done
    - name: 'spec-check / spec-check: an empty workspace, as its own runner had'
      id: spec-check--spec-check--fresh
      if: ${{ (steps.plan.outputs.spec-check == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'spec-check / spec-check: Check out the calling repo (the pull request, or the queue''s branch)'
      id: spec-check--spec-check--0
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: Check out the canonical spec'
      id: spec-check--spec-check--1
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: lemonfiber/spec
        ref: main
        path: .spec-canonical
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: Gather the text this event carries'
      id: spec-check--spec-check--2
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') }}
      env:
        EVENT: ${{ github.event_name }}
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: |
        {
          # Only a pull request has one, and `printf` on an empty variable
          # would put a blank line at the top of the text either way — this is
          # about saying which event was read, not about the byte.
          if [ "$EVENT" = "pull_request" ]; then
            printf '%s\n' "$PR_BODY"
          fi
          if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
             && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            # A failure here must be loud. Swallowed, it leaves the body as the
            # only text searched, and the gate then reports a missing citation
            # for a pull request whose commits carry one.
            git log --format='%B' "${BASE_SHA}..${HEAD_SHA}" \
              || { echo "::error::Could not read commit messages for ${BASE_SHA}..${HEAD_SHA}. Nothing else was searched: on a merge group the commits are the only text there is, and on a pull request the body alone is not the rule." >&2; exit 1; }
          else
            echo "::error::base or head is not a commit SHA on a ${EVENT} event, so no commit message was read." >&2
            exit 1
          fi
        } > .pr-text.txt
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: Gather what this change writes into a file'
      id: spec-check--spec-check--3
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') }}
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: |
        if printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
           && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
          # Loud, like the log above it. A diff that silently came out empty
          # turns this half of the rule off in every repo, and nothing on the
          # green tick would say so.
          git diff --no-color "${BASE_SHA}" "${HEAD_SHA}" > .pr-diff.txt \
            || { echo "::error::Could not read the diff for ${BASE_SHA}..${HEAD_SHA}. Identifiers written into files were not checked, and a pass here would have said they were." >&2; exit 1; }
        else
          echo "::error::base or head is not a commit SHA on a ${EVENT} event, so no diff was read." >&2
          exit 1
        fi
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: Set up Python'
      id: spec-check--spec-check--4
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: Verify citation'
      id: spec-check--spec-check--citation
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') && (steps.spec-check--spec-check--4.outcome != 'failure') }}
      env:
        EVENT: ${{ github.event_name }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set +e

        # `--citation-optional` on a merge group, and only there.
        #
        # GOV-R2 allows the citation to live in the pull request body, and the
        # Dependabot allowance keys on the author GitHub records for the pull
        # request. A merge group has neither, so requiring a trailer of the
        # commits alone would refuse a batch for carrying its citation exactly
        # where the rule permits it, and would refuse every dependency update
        # outright. GOV-R3 is untouched: whatever the batch cites is still
        # resolved, which is the half a queue can change while a pull request
        # waits in it.
        #
        # Keyed on the event, which comes from GitHub's payload rather than
        # from anything a contributor writes. See `spec_check.py` for what
        # widening that would cost.
        optional=()
        if [ "$EVENT" = "merge_group" ]; then
          optional+=(--citation-optional)
        fi

        python3 .spec-canonical/scripts/spec_check.py \
          --spec-dir .spec-canonical \
          --text-file .pr-text.txt \
          --diff-file .pr-diff.txt \
          --pr-author "$PR_AUTHOR" \
          "${optional[@]}" 2>&1 | tee .citation-output.txt
        status=${PIPESTATUS[0]}
        {
          echo "status=${status}"
          echo "reason<<REASON"
          grep -F '::error::' .citation-output.txt | sed 's/^::error:://' || true
          echo "REASON"
        } >> "$GITHUB_OUTPUT"
        exit 0
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: The citation decides whether this may merge'
      id: spec-check--spec-check--7
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') && (steps.spec-check--spec-check--4.outcome != 'failure') && (steps.spec-check--spec-check--citation.outputs.status != '0') }}
      env:
        STATUS: ${{ steps.spec-check--spec-check--citation.outputs.status }}
        REASON: ${{ steps.spec-check--spec-check--citation.outputs.reason }}
      run: |
        if [ "$STATUS" = "2" ]; then
          echo "::error::spec-check could not run: ${REASON}. Nothing was closed — this is a fault on the gate's side, not the pull request's." >&2
        else
          echo "::error::${REASON}" >&2
        fi
        exit 1
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: What a merge group was, and was not, asked'
      id: spec-check--spec-check--8
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') && (steps.spec-check--spec-check--4.outcome != 'failure') && (steps.spec-check--spec-check--7.outcome != 'failure') && (github.event_name == 'merge_group') }}
      run: |
        set -euo pipefail
        said="This ran on a merge group, which carries no pull request: no body to read a citation from and no author to cite on behalf of. So GOV-R2 — that a citation is present — was not re-asked here. It was asked of every pull request in this batch before the queue accepted it, and a merge group does not rewrite a commit message. What did run is GOV-R3: every identifier the batch's commits cite was resolved against spec@main as it stands now, which is the one answer that can have changed while a pull request waited in the queue."
        echo "::notice::${said}"
        printf '### spec-check on a merge group\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      continue-on-error: true
      timeout-minutes: 10
    - name: 'spec-check / spec-check: The tracker claims only what the spec and the tree back'
      id: spec-check--spec-check--9
      if: ${{ ((steps.plan.outputs.spec-check == 'true')) && (steps.spec-check--spec-check--0.outcome != 'failure') && (steps.spec-check--spec-check--1.outcome != 'failure') && (steps.spec-check--spec-check--2.outcome != 'failure') && (steps.spec-check--spec-check--3.outcome != 'failure') && (steps.spec-check--spec-check--4.outcome != 'failure') && (steps.spec-check--spec-check--7.outcome != 'failure') && (steps.spec-check--spec-check--8.outcome != 'failure') }}
      run: |
        set -euo pipefail
        python3 .spec-canonical/scripts/status_check.py check \
          --spec .spec-canonical --repo-root .
        if [ -f IMPLEMENTATION-STATUS.md ]; then
          python3 .spec-canonical/scripts/status_lint.py \
            --status IMPLEMENTATION-STATUS.md \
            --spec .spec-canonical
        fi
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / actionlint: an empty workspace, as its own runner had'
      id: hygiene--actionlint--fresh
      if: ${{ (steps.plan.outputs.hygiene == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'hygiene / actionlint: actions/checkout'
      id: hygiene--actionlint--0
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / actionlint: actionlint'
      id: hygiene--actionlint--1
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) && (steps.hygiene--actionlint--0.outcome != 'failure') }}
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / pins: an empty workspace, as its own runner had'
      id: hygiene--pins--fresh
      if: ${{ (steps.plan.outputs.hygiene == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'hygiene / pins: actions/checkout'
      id: hygiene--pins--0
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / pins: Compare each pinned shared workflow against the one maintained'
      id: hygiene--pins--1
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) && (steps.hygiene--pins--0.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        STALE_DAYS: '30'
        STALE_COMMITS: '75'
      run: |
        set -euo pipefail

        # The workflow name is kept, not only the revision. A pin is asked two
        # questions below that a count cannot answer: which shared workflows
        # this repository actually runs, and whether any of them changed in the
        # commits the pin has not taken.
        pairs=$(grep -rhoE "lemonfiber/spec/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}" \
          .github/workflows/ 2>/dev/null | sed "s|lemonfiber/spec/\.github/workflows/||" | sort -u || true)
        pins=$(printf "%s" "$pairs" | grep -oE "[0-9a-f]{40}$" | sort -u || true)

        if [ -z "$pins" ]; then
          echo "This repository pins no shared workflow."
          exit 0
        fi

        faults=0
        for pin in $pins; do
          answer=$(gh api "repos/lemonfiber/spec/compare/${pin}...main" \
            --jq '"\(.status) \(.ahead_by) \(.base_commit.commit.committer.date) \([(.files // [])[].filename] | join(","))"' 2>/dev/null || true)
          status=$(echo "$answer" | cut -d" " -f1)
          ahead=$(echo "$answer" | cut -d" " -f2)
          dated=$(echo "$answer" | cut -d" " -f3)
          changed=$(echo "$answer" | cut -d" " -f4)

          # gh prints its own error body on stdout, so a revision that does not
          # exist arrives here looking like a status. Only the words the API
          # documents are believed.
          case "$status" in
          identical | ahead | behind | diverged) ;;
          *)
            echo "::error::${pin} is not a revision of lemonfiber/spec. A pin naming nothing runs nothing that was reviewed."
            faults=$((faults + 1))
            continue
            ;;
          esac

          case "$status" in
          identical)
            echo "${pin:0:8} is current."
            continue
            ;;
          ahead)
            # `main` is ahead of the pin: the ordinary case, and the one that ages.
            ;;
          *)
            echo "::error::${pin:0:8} is not on lemonfiber/spec main (${status}). It names a revision that was never merged, or a branch rewritten under it."
            faults=$((faults + 1))
            continue
            ;;
          esac

          age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))

          # Both questions are asked, and both are named in the answer. A pin
          # can be stale by either without being stale by the other, and which
          # one fired is what tells a reader whether the pin was forgotten or
          # merely outrun.
          # Which of the shared workflows this repository runs changed in the
          # commits this pin has not taken.
          #
          # "23 commits behind" is a number nobody acts on. "the link check you
          # run was fixed in one of them" is a sentence somebody does something
          # about — and that was the difference on the day SonarCloud answered
          # 503 for half an hour: `hygiene.yml` had gained the fix that morning,
          # every repository was inside both thresholds, and the count said
          # nothing about which commit any of them needed.
          #
          # It is said and not gated, deliberately. Failing the moment a shared
          # workflow lands would redden nine repositories on every change here,
          # which is the check people route around. `website-docs` draws the
          # same line between how far a pin is behind and what it is behind
          # *on*, and reports both rather than gating either (Q-R68).
          runs=$(printf "%s" "$pairs" | grep -F "@${pin}" | cut -d@ -f1 | sort -u || true)
          touched=""
          for name in $runs; do
            case ",${changed}," in
            *",.github/workflows/${name},"*)
              touched="${touched:+${touched}, }${name}"
              ;;
            esac
          done

          if [ -n "$touched" ]; then
            reads="${touched} changed in them"
          else
            reads="none of them touched a workflow this repository runs"
          fi

          broke=""
          if [ "$age" -gt "$STALE_DAYS" ]; then
            broke="more than ${STALE_DAYS} days old"
          fi
          if [ "$ahead" -gt "$STALE_COMMITS" ]; then
            if [ -n "$broke" ]; then
              broke="${broke}, and "
            fi
            broke="${broke}more than ${STALE_COMMITS} commits behind"
          fi

          if [ -n "$broke" ]; then
            echo "::error::${pin:0:8} is ${ahead} commits and ${age} days behind lemonfiber/spec main, which is ${broke}, and ${reads}. Bump it: whatever has been fixed there has not reached this repository."
            faults=$((faults + 1))
          else
            echo "::notice::${pin:0:8} is ${ahead} commits behind lemonfiber/spec main (${age} days), and ${reads}. Bump it when convenient."
          fi
        done

        if [ "$faults" -gt 0 ]; then
          echo "${faults} pin(s) need attention."
          exit 1
        fi
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / typos: an empty workspace, as its own runner had'
      id: hygiene--typos--fresh
      if: ${{ (steps.plan.outputs.hygiene == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'hygiene / typos: actions/checkout'
      id: hygiene--typos--0
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / typos: typos'
      id: hygiene--typos--1
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) && (steps.hygiene--typos--0.outcome != 'failure') }}
      uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / links: an empty workspace, as its own runner had'
      id: hygiene--links--fresh
      if: ${{ (steps.plan.outputs.hygiene == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'hygiene / links: actions/checkout'
      id: hygiene--links--0
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'hygiene / links: An accept list in the caller''s config is not the one that runs'
      id: hygiene--links--1
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) && (steps.hygiene--links--0.outcome != 'failure') }}
      run: |
        set -euo pipefail

        if [ ! -f lychee.toml ]; then
          echo "No lychee.toml here; the list below is the only one."
          exit 0
        fi

        if ! grep -qE "^[[:space:]]*accept[[:space:]]*=" lychee.toml; then
          echo "lychee.toml declares no accept list, which is right: the one that runs is below."
          exit 0
        fi

        said="lychee.toml declares an \`accept\` list. The step below passes --accept on the command line and that beats a config file, so this list has never been consulted — and somebody editing it to fix a failing link check would watch it keep failing with no idea why. Take it out. The list that runs is in lemonfiber/spec's hygiene.yml, with the reasoning for each code beside it."
