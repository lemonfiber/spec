    - name: 'security / gitleaks: an empty workspace, as its own runner had'
      id: security--gitleaks--fresh
      if: ${{ (steps.plan.outputs.security == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'security / gitleaks: actions/checkout'
      id: security--gitleaks--0
      if: ${{ ((steps.plan.outputs.security == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
      env:
        GITLEAKS_VERSION: 8.30.1
      continue-on-error: true
      timeout-minutes: 10
    - name: 'security / gitleaks: gitleaks (CLI)'
      id: security--gitleaks--1
      if: ${{ ((steps.plan.outputs.security == 'true')) && (steps.security--gitleaks--0.outcome != 'failure') }}
      run: |
        set -euo pipefail
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

        # Downloaded to a file rather than piped into tar, and retried.
        #
        # `curl | tar xz` reports the wrong thing when the network blips: tar
        # receives a truncated stream and says `gzip: stdin: unexpected end of
        # file`, which reads as a corrupt release. It is not — the release is
        # fine and the transfer was not. A security gate that fails with a
        # message pointing at the wrong cause is one somebody re-runs until it
        # passes, which is the habit this whole job exists to avoid.
        #
        # `--retry-all-errors` is needed alongside `--retry`: without it curl
        # retries only what it considers transient, and a connection reset
        # mid-body is not on that list.
        curl -sSfL --proto '=https' --tlsv1.2 \
          --retry 3 --retry-delay 2 --retry-all-errors \
          -o gitleaks.tar.gz "$url"

        tar xzf gitleaks.tar.gz gitleaks
        rm -f gitleaks.tar.gz

        ./gitleaks git --no-banner --redact --exit-code 1 .
      env:
        GITLEAKS_VERSION: 8.30.1
      continue-on-error: true
      timeout-minutes: 10
    - name: 'security / gitleaks: The pinned gitleaks is not far behind the latest release'
      id: security--gitleaks--2
      if: ${{ ((steps.plan.outputs.security == 'true')) && (steps.security--gitleaks--0.outcome != 'failure') && (steps.security--gitleaks--1.outcome != 'failure') }}
      env:
        GITLEAKS_VERSION: 8.30.1
        GH_TOKEN: ${{ github.token }}
        STALE_DAYS: '30'
      run: |
        set -euo pipefail

        # `gh` prints its own error body on stdout, so a failed call arrives
        # here looking like an answer. Only a release tag with a date is
        # believed. Three attempts, because this reddens a security gate in
        # every repository and one blocked API call is not staleness.
        tag=""
        dated=""
        for attempt in 1 2 3; do
          answer=$(gh api repos/gitleaks/gitleaks/releases/latest \
            --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null || true)
          tag=$(echo "$answer" | cut -d" " -f1)
          dated=$(echo "$answer" | cut -d" " -f2)
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [[ "$dated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            break
          fi
          tag=""
          if [ "$attempt" -lt 3 ]; then
            sleep "$((attempt * 5))"
          fi
        done

        if [ -z "$tag" ]; then
          echo "::error::Could not read the latest gitleaks release in three attempts, so this run does not know whether it scanned with a current scanner."
          exit 1
        fi

        if [ "$tag" = "v${GITLEAKS_VERSION}" ]; then
          echo "gitleaks ${GITLEAKS_VERSION} is the current release."
          exit 0
        fi

        age=$(( ( $(date -u +%s) - $(date -u -d "$dated" +%s) ) / 86400 ))
        if [ "$age" -gt "$STALE_DAYS" ]; then
          echo "::error::This scanned with gitleaks ${GITLEAKS_VERSION}; ${tag} has been out ${age} days. Raise GITLEAKS_VERSION in lemonfiber/spec .github/workflows/security.yml — rules published since ${GITLEAKS_VERSION} are not being applied to any repository."
          exit 1
        fi
        echo "::notice::gitleaks ${tag} is ${age} days old; this scanned with ${GITLEAKS_VERSION}. Raise GITLEAKS_VERSION in lemonfiber/spec .github/workflows/security.yml when convenient."
      continue-on-error: true
      timeout-minutes: 10
    - name: 'security / osv-scanner: an empty workspace, as its own runner had'
      id: security--osv-scanner--fresh
      if: ${{ (steps.plan.outputs.security == 'true') }}
