        path: .spec-canonical
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 5
    - name: 'cap / comment: Write the comment, or nothing'
      id: cap--comment--1
      if: ${{ ((needs.gates.outputs.plan--cap == 'true') && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && (steps.cap--comment--0.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate --slurp \
          | jq 'add // []' > pulls.json
        python3 .spec-canonical/scripts/pr_cap.py --pulls pulls.json --number "$PR" > comment.md
      continue-on-error: true
      timeout-minutes: 5
    - name: 'cap / comment: Upsert or remove the sticky comment'
      id: cap--comment--2
      if: ${{ ((needs.gates.outputs.plan--cap == 'true') && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && (steps.cap--comment--0.outcome != 'failure') && (steps.cap--comment--1.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
               --jq 'map(select(.body | startswith("<!-- pr-cap -->"))) | .[0].id // empty')
        if [ -s comment.md ]; then
          if [ -n "$id" ]; then
            jq -Rs '{body: .}' comment.md | gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --input - >/dev/null
            echo "updated the cap comment $id"
          else
            jq -Rs '{body: .}' comment.md | gh api -X POST "repos/$GH_REPO/issues/$PR/comments" --input - >/dev/null
            echo "commented: the repository is over the cap"
          fi
        elif [ -n "$id" ]; then
          gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" >/dev/null
          echo "removed the cap comment $id: within the cap"
        else
          echo "within the cap; nothing to say"
        fi
      continue-on-error: true
      timeout-minutes: 5
    - name: 'squash-message / explain: Post the explainer'
      id: squash-message--explain--0
      if: ${{ (needs.gates.outputs.plan--squash-message == 'true') && (github.event_name == 'pull_request') && (!cancelled() && needs.gates.outputs.squash-message--squash-message--out--needed != '' && github.event.pull_request.head.repo.full_name == github.repository) }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        CHECK: squash-message
        TITLE: What the squash commit on `main` needs
        BODY: ${{ needs.gates.outputs.squash-message--squash-message--out--said }}
        NEEDED: ${{ needs.gates.outputs.squash-message--squash-message--out--needed }}
      run: |
        set -euo pipefail
        marker="<!-- explain:${CHECK} -->"
        id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
          --jq "[.[] | select(.body | contains(\"${marker}\"))] | last | .id // empty" || true)
        if [ "$NEEDED" != "true" ]; then
          # The contributor already satisfies this check — remove any stale
          # explainer and post nothing.
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" >/dev/null || true
          fi
          echo "'${CHECK}' already satisfied — no explainer needed"
          exit 0
        fi
        printf '%s\n\n### %s\n\n%s\n' "$marker" "$TITLE" "$BODY" > explain.md
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@explain.md >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@explain.md >/dev/null
        fi
        echo "explainer posted for '${CHECK}'"
      continue-on-error: true
      timeout-minutes: 10
    - name: 'explain / citation: Post the explainer'
      id: explain--citation--0
      if: ${{ (needs.gates.outputs.plan--explain == 'true') && (github.event_name == 'pull_request') }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        CHECK: citation-gate
        TITLE: 📎 Why this repo needs a `Spec:` citation
        BODY: |-
          This project is spec-led: every change cites a spec identifier that already
          exists on `main`, and `spec-check` fails without one — not to reject the
          work, but to sequence it. Add a `Spec:` line to the PR body, on its own
          line, e.g. `Spec: OPS-R1`: the squash merge writes the body to `main`.
          Routine maintenance (dependencies, formatting, CI) cites `GOV-R12`.
          Changing behaviour? Open the spec PR first, then cite the new identifier.
          See 50-governance/contributing.md.

          ${{ needs.gates.outputs.explain--detect--out--suggest }}
        NEEDED: ${{ needs.gates.outputs.explain--detect--out--citation == 'needed' && 'true' || 'false' }}
      run: |
