    - name: 'hygiene / invite: The community is addressed by name, not by invite code'
      id: hygiene--invite--1
      if: ${{ ((steps.plan.outputs.hygiene == 'true')) && (steps.hygiene--invite--0.outcome != 'failure') }}
      env:
        INVITE: discord\.gg/|discord(app)?\.com/invite/
      run: |
