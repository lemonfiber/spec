        path: .spec-canonical
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 20
    - name: 'explain / detect: step 3'
      id: explain--detect--d
      if: ${{ ((steps.plan.outputs.explain == 'true')) && (steps.explain--detect--0.outcome != 'failure') && (steps.explain--detect--1.outcome != 'failure') }}
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        # A Spec: trailer in the body or any commit means the citation is done.
        text=$( { printf '%s\n' "$PR_BODY"; git log --format=%B "${BASE}..${HEAD}" 2>/dev/null || true; } )
        # Counted rather than `grep -q`: the text is the body and every commit
