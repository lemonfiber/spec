    - name: 'dco / dco: an empty workspace, as its own runner had'
      id: dco--dco--fresh
      if: ${{ (steps.plan.outputs.dco == 'true') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'dco / dco: actions/checkout'
      id: dco--dco--0
      if: ${{ ((steps.plan.outputs.dco == 'true')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
      continue-on-error: true
      timeout-minutes: 10
    - name: 'dco / dco: actions/checkout'
      id: dco--dco--1
      if: ${{ ((steps.plan.outputs.dco == 'true')) && (steps.dco--dco--0.outcome != 'failure') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: lemonfiber/spec
        ref: main
        path: .spec-canonical
      continue-on-error: true
      timeout-minutes: 10
    - name: 'dco / dco: actions/setup-python'
      id: dco--dco--2
      if: ${{ ((steps.plan.outputs.dco == 'true')) && (steps.dco--dco--0.outcome != 'failure') && (steps.dco--dco--1.outcome != 'failure') }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
      continue-on-error: true
      timeout-minutes: 10
    - name: 'dco / dco: Check sign-off'
      id: dco--dco--3
      if: ${{ ((steps.plan.outputs.dco == 'true')) && (steps.dco--dco--0.outcome != 'failure') && (steps.dco--dco--1.outcome != 'failure') && (steps.dco--dco--2.outcome != 'failure') }}
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
