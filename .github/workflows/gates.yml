        fi
        echo "explainer posted for '${CHECK}'"
      continue-on-error: true
      timeout-minutes: 10
    - name: 'explain / dco: Post the explainer'
      id: explain--dco--0
      if: ${{ (needs.gates.outputs.plan--explain == 'true') && (github.event_name == 'pull_request') }}
      env:
        GH_TOKEN: ${{ github.token }}
