      run: |
        set -euo pipefail

        if [ ! -f lychee.toml ]; then
          echo "No lychee.toml here; the list below is the only one."
          exit 0
        fi

        if ! grep -qE "^[[:space:]]*accept[[:space:]]*=" lychee.toml; then
          echo "lychee.toml declares no accept list, which is right: the one that runs is below."
          exit 0
        fi

        said="lychee.toml declares an \`accept\` list. The step below passes --accept on the command line and that beats a config file, so this list has never been consulted — and somebody editing it to fix a failing link check would watch it keep failing with no idea why. Take it out. The list that runs is in lemonfiber/spec's hygiene.yml, with the reasoning for each code beside it."
        echo "::error file=lychee.toml::${said}"
        printf '### An accept list that does not run\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
        exit 1
