      timeout-minutes: 10
    - name: 'goals / classify: Classify and act'
      id: goals--classify--2
      if: ${{ ((needs.gates.outputs.plan--goals == 'true') && (github.event.pull_request.head.repo.full_name == github.repository)) && (steps.goals--classify--0.outcome != 'failure') && (steps.goals--classify--1.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        python3 scripts/pr_goals.py --pr-text pr.txt > result.json
        cat result.json
        python3 - <<'PY'
        import json, os, subprocess

        r = json.load(open("result.json"))
        repo, pr = os.environ["REPO"], os.environ["PR"]
        MARK = "<!-- goal-automations -->"

        def gh(*args):
            subprocess.run(["gh", *args], check=False)

        def read(*args):
            return subprocess.run(["gh", *args], capture_output=True,
                                  text=True, check=False).stdout.strip()

        def milestone(version, delivers):
            """This version's milestone number, made if the repository has none.

            Looked up by title over every state, because a version's milestone is
            closed when the version ships and a hotfix citing one of its goals
            afterwards must land in the same milestone rather than mint a second
            one beside it.

            Made rather than expected. No repository in the org has ever had a
            milestone for a version, so a workflow that only applied existing ones
            would go on doing nothing and reporting success — and a list of
            milestones kept by hand is the version manifests written out twice.
            The description is the manifest's own `delivers`, carried through the
            classifier for the same reason.
            """
            title = f"v{version}"
            found = read("api", f"repos/{repo}/milestones", "-X", "GET",
                         "-f", "state=all", "--jq",
                         f'[.[] | select(.title == "{title}") | .number] | first // empty')
            if found:
                return found
            return read("api", "--method", "POST", f"repos/{repo}/milestones",
                        "-f", f"title={title}", "-f", f"description={delivers}",
                        "--jq", ".number // empty")

        if not r.get("staged"):
            raise SystemExit(0)
        version = r["staged"]

        if r["in_scope"]:
            label = f"v{version}"
            gh("label", "create", label, "--repo", repo, "--force",
               "--color", "0e8a16", "--description", f"Targets release {version}")
            gh("pr", "edit", pr, "--repo", repo, "--add-label", label)
            at = milestone(version, r.get("delivers", ""))
            if at:
                # Sent as a number rather than a string: the field is an integer
                # and the API refuses the quoted form `-f` would produce.
                gh("api", "--method", "PATCH", f"repos/{repo}/issues/{pr}",
                   "-F", f"milestone={at}")
            else:
                print(f"::warning::no milestone v{version} in {repo} and none could "
                      "be made, so this PR carries the label without one (OPS-R39)")
            goals = ", ".join(f"`{g}`" for g in r["in_scope"])
            body = f"{MARK}\n🎯 Advances **{version}** — {goals}."
        elif r["advisory"]:
            gh("pr", "edit", pr, "--repo", repo, "--add-label", "scope:next")
            out = ", ".join(f"`{g}`" for g in r["out_of_scope"])
            body = f"{MARK}\nℹ️ Cites requirements outside the staged **{version}** scope ({out}); routed to the next version."
        else:
            raise SystemExit(0)

        find = subprocess.run(
            ["gh", "api", f"repos/{repo}/issues/{pr}/comments", "--jq",
             f'[.[] | select(.body | startswith("{MARK}")) | .id] | first // empty'],
            capture_output=True, text=True)
        existing = find.stdout.strip()
        if existing:
            gh("api", "--method", "PATCH", f"repos/{repo}/issues/comments/{existing}",
               "-f", f"body={body}")
        else:
            gh("api", "--method", "POST", f"repos/{repo}/issues/{pr}/comments",
               "-f", f"body={body}")
        PY
      continue-on-error: true
      timeout-minutes: 10
    - name: 'refs / comment: an empty workspace, as its own runner had'
      id: refs--comment--fresh
      if: ${{ (needs.gates.outputs.plan--refs == 'true') && (github.event.pull_request.head.repo.full_name == github.repository) }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'refs / comment: Check out the spec'
      id: refs--comment--0
      if: ${{ ((needs.gates.outputs.plan--refs == 'true') && (github.event.pull_request.head.repo.full_name == github.repository)) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lemonfiber/spec
        ref: main
        path: .spec-canonical
        persist-credentials: false
      continue-on-error: true
      timeout-minutes: 10
    - name: 'refs / comment: Build the comment'
      id: refs--comment--1
      if: ${{ ((needs.gates.outputs.plan--refs == 'true') && (github.event.pull_request.head.repo.full_name == github.repository)) && (steps.refs--comment--0.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BODY: ${{ github.event.pull_request.body }}
      run: |
        {
          printf '%s\n' "$BODY"
          gh pr view "$PR" --repo "$GH_REPO" --json commits \
            --jq '.commits[] | .messageHeadline, .messageBody'
        } > .pr-text.txt
        python3 .spec-canonical/scripts/spec_refs.py \
          --spec-dir .spec-canonical --text-file .pr-text.txt \
          --spec-url https://github.com/lemonfiber/spec/blob/main > comment.md
      continue-on-error: true
      timeout-minutes: 10
    - name: 'refs / comment: Upsert the sticky comment'
      id: refs--comment--2
      if: ${{ ((needs.gates.outputs.plan--refs == 'true') && (github.event.pull_request.head.repo.full_name == github.repository)) && (steps.refs--comment--0.outcome != 'failure') && (steps.refs--comment--1.outcome != 'failure') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
               --jq 'map(select(.body | startswith("<!-- spec-references -->"))) | .[0].id // empty')
        if [ -n "$id" ]; then
          jq -Rs '{body: .}' comment.md | gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --input - >/dev/null
          echo "updated spec-references comment $id"
        else
          jq -Rs '{body: .}' comment.md | gh api -X POST "repos/$GH_REPO/issues/$PR/comments" --input - >/dev/null
          echo "created spec-references comment"
        fi
      continue-on-error: true
      timeout-minutes: 10
    - name: 'cap / comment: an empty workspace, as its own runner had'
      id: cap--comment--fresh
      if: ${{ (needs.gates.outputs.plan--cap == 'true') && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot') }}
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: 'cap / comment: Check out the spec'
      id: cap--comment--0
      if: ${{ ((needs.gates.outputs.plan--cap == 'true') && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lemonfiber/spec
