        for key in failed:
            print(f"::error::{key.replace('--', ' / ')} failed. Its steps above say why.")
        raise SystemExit(1 if failed else 0)
        PY
  report:
    needs: gates
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    - name: 'spec-check / spec-check: Close the pull request, naming what it cited'
      id: spec-check--spec-check--6
      if: ${{ ((needs.gates.outputs.plan--spec-check == 'true')) && (needs.gates.outputs.spec-check--spec-check--reached-6 == 'true') && (needs.gates.outputs.spec-check--spec-check--citation--outputs--status == '1' && github.event_name == 'pull_request') }}
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        REASON: ${{ needs.gates.outputs.spec-check--spec-check--citation--outputs--reason }}
