# Reusable label sync. Upserts the canonical label set (70-operations/labels.yml
# in the spec repo) into the calling repo, so every repo carries the same labels
# without hand-editing. Additive: it never deletes labels it doesn't know about.
# OPS-R12.
name: label-sync

on:
  workflow_call:

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upsert labels from the spec registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -sfL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/lemonfiber/spec/main/70-operations/labels.yml -o labels.yml
          # `--only-binary :all:` refuses a source distribution, which is what
          # keeps this from running a package's own `setup.py` on a runner
          # holding `GH_TOKEN`. The sibling step in `coverage.yml` has said so
          # since it was written; this one did not, and a pinned version is not
          # the same protection — a pin says *which* code, and this says the
          # code does not get to run at install time.
          python3 -m pip install --quiet --only-binary :all: "pyyaml==6.0.2"
          python3 - <<'PY'
          import subprocess, yaml
          for l in yaml.safe_load(open("labels.yml")):
              subprocess.run(
                  ["gh", "label", "create", l["name"],
                   "--color", str(l["color"]),
                   "--description", l.get("description", ""),
                   "--force"],
                  check=False)
          PY
