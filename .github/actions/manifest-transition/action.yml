# Flip a version manifest's status via an auto-merged, verified PR — OPS-R32,
# carrying the generated files that have to move with it.
# Shared by stage/track/finalize and the pre-release lane, so the signed-commit
# dance lives in one place.
# The commit is made through the contents API, which marks it verified (so it
# satisfies the signed-commits rule on main) and fills author/committer from the
# App token — a [bot] identity, so it's DCO-exempt and needs no sign-off. An
# installation token has no user behind it, so we never call /user.
name: manifest-transition
description: Record a version manifest transition through an auto-merged verified PR.
inputs:
  version:
    description: Version whose manifest to transition, e.g. 0.2.0.
    required: true
  status:
    description: New status (staged | releasable | released | yanked).
    required: true
  pins:
    description: Space-separated name=sha pairs to embed, e.g. "lemonfiber-media-stack=abc123".
    required: false
    default: ""
  released_on:
    description: UTC date the release was published, YYYY-MM-DD. Only a transition to released carries one.
    required: false
    default: ""
  released_as:
    description: The tag the goals actually shipped under, where it is not this version's own — a patch finishing a minor. Empty otherwise.
    required: false
    default: ""
  prerelease:
    description: A pre-release tag to record against this version, e.g. v0.15.0-pre.1. The status is left where it is (OPS-R60).
    required: false
    default: ""
  prerelease_on:
    description: UTC date the pre-release was tagged, YYYY-MM-DD. Required with `prerelease`.
    required: false
    default: ""
  unmet:
    description: Space-separated goal IDs the gate called unmet when the pre-release was cut.
    required: false
    default: ""
  token:
    description: The release App installation token.
    required: true
runs:
  using: composite
  steps:
    - name: Write the transition and what is generated from it
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ github.repository_owner }}
        VERSION: ${{ inputs.version }}
        STATUS: ${{ inputs.status }}
        PINS: ${{ inputs.pins }}
        RELEASED_ON: ${{ inputs.released_on }}
        RELEASED_AS: ${{ inputs.released_as }}
        PRERELEASE: ${{ inputs.prerelease }}
        PRERELEASE_ON: ${{ inputs.prerelease_on }}
        UNMET: ${{ inputs.unmet }}
      run: |
        set -euo pipefail
        man="70-operations/versions/${VERSION}.toml"
        pinargs=()
        read -ra parts <<< "$PINS"
        for p in "${parts[@]}"; do [ -n "$p" ] && pinargs+=(--pin "$p"); done
        dateargs=()
        if [ -n "$RELEASED_ON" ]; then
          dateargs+=(--released-on "$RELEASED_ON")
        fi
        # The tag a patch finished this line under. Passed only where there is
        # one, so an ordinary release is not handed an empty argument to reject.
        if [ -n "$RELEASED_AS" ]; then
          dateargs+=(--released-as "$RELEASED_AS")
        fi
        # A pre-release is not a transition: the status passed is whatever the
        # manifest already holds, and what this writes is one more `[[prerelease]]`
        # record beside it (OPS-R60, OPS-R65).
        prearg=()
        if [ -n "$PRERELEASE" ]; then
          prearg+=(--prerelease "$PRERELEASE" --prerelease-on "$PRERELEASE_ON")
          read -ra goals <<< "$UNMET"
          for g in "${goals[@]}"; do [ -n "$g" ] && prearg+=(--unmet "$g"); done
        fi
        python3 scripts/set_status.py --version "$VERSION" --status "$STATUS" \
          "${dateargs[@]}" "${prearg[@]}" "${pinargs[@]}" > "${man}.new"
        mv "${man}.new" "$man"
        # The roadmap table and the feature board are generated from the manifests,
        # so a status change that does not carry them is a change integrity will
        # reject — which it did for every transition this action opened until it
        # regenerated them here. The board is also what the website's roadmap
        # reads, so leaving it behind would publish a status that no longer holds.
        python3 scripts/gen_roadmap_table.py
        python3 scripts/gen_board.py

    # A step of its own so the branch handling can be run apart from the
    # generators, against a stubbed `gh`.
    - name: Open the record on a branch rebuilt from main
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ github.repository_owner }}
        VERSION: ${{ inputs.version }}
        STATUS: ${{ inputs.status }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        man="70-operations/versions/${VERSION}.toml"
        # Named for what is being recorded rather than for the status, because a
        # pre-release leaves the status where it was: two of them against one
        # staged version would otherwise want the same branch.
        what="$STATUS"
        if [ -n "$PRERELEASE" ]; then
          what="prerelease-${PRERELEASE#v}"
        fi
        branch="release/${VERSION}-${what}"
        # A branch left by an earlier run is deleted rather than written onto. It
        # is behind main by whatever merged since, and its pull request may still
        # be open when that run stopped waiting for it, so creating either again
        # would refuse and a re-run could never get past this step. Deleting the
        # branch closes that pull request; resetting it to main's head instead
        # would leave GitHub calling the pull request merged.
        if gh api "repos/${OWNER}/spec/git/ref/heads/${branch}" --silent 2>/dev/null; then
          gh api --method DELETE "repos/${OWNER}/spec/git/refs/heads/${branch}"
          echo "deleted the ${branch} an earlier run left."
        fi
        base=$(gh api "repos/${OWNER}/spec/git/ref/heads/main" --jq '.object.sha')
        gh api --method POST "repos/${OWNER}/spec/git/refs" -f ref="refs/heads/${branch}" -f sha="$base" --silent
        # Author/committer omitted: GitHub fills them from the token (the App bot,
        # DCO-exempt) and marks the commit verified.
        if [ -n "$PRERELEASE" ]; then
          msg=$(printf 'chore(release): %s went out as %s\n\nRecorded by the release train.\n\nSpec: OPS-R65' "$VERSION" "$PRERELEASE")
          title="chore(release): ${VERSION} went out as ${PRERELEASE}"
          body="Automated pre-release record. Spec: OPS-R65"
        else
          msg=$(printf 'chore(release): %s → %s\n\nRecorded by the release train.\n\nSpec: OPS-R32' "$VERSION" "$STATUS")
          title="chore(release): ${VERSION} → ${STATUS}"
          body="Automated manifest transition. Spec: OPS-R32"
        fi
        # One commit per file, collapsed by the squash merge. The contents API
        # writes one path at a time; a file the generators left unchanged is
        # skipped, so an unchanged board does not produce an empty commit.
        for path in "$man" 00-overview/roadmap.md 10-functional/features/index.json 10-functional/features/*/board.json; do
          remote=$(gh api "repos/${OWNER}/spec/contents/${path}?ref=${branch}" --jq '.content' | tr -d '\n')
          local=$(base64 < "$path" | tr -d '\n')
          [ "$remote" = "$local" ] && { echo "${path} is unchanged."; continue; }
          blob=$(gh api "repos/${OWNER}/spec/contents/${path}?ref=${branch}" --jq '.sha')
          gh api --method PUT "repos/${OWNER}/spec/contents/${path}" \
            -f message="$msg" -f branch="$branch" -f sha="$blob" -f content="$local"
          echo "wrote ${path}."
        done
        url=$(gh pr create --repo "${OWNER}/spec" --base main --head "$branch" \
          --title "$title" --body "$body")
        gh pr merge "$url" --auto --squash
