# ── In the organisation, outside the map above ───────────────────────────────
#
# The table, the diagram and the sentence counting them are the repositories
# this specification governs, which README.md says plainly is not the same set
# as the organisation. A plugin repository is the org's and not the map's: where
# a plugin comes from is the reviewed catalogue's to answer (`F5-R1`). A
# first-party plugin is the exception, in the map above, because the bundle the
# core embeds pins it (ADR-0045).
#
# They are named here anyway, because something else needs the other set. Every
# repository below calls the shared reusable workflows, so `shared/adoption.toml`
# has to hold a row for it — and a register reading the map above as the org
# refused three repositories as unknown while offering no row they could be
# given. One file, two questions: `gen_repos.py` reads `[[repo]]` and renders the
# map; `check_shared_files.py` and the pin fan-out read both and get the org.
#
# A repository here carries no `spec`, `node`, `label` or `order`: it is in no
# diagram and no table, and a field nothing renders is a field that goes stale.

[[ungoverned]]
name = "plugin-template"
note = "The plugin an author copies; the catalogue lists it, this map does not"

