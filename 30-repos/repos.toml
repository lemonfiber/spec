# Every repository in the org — the single source of truth.
#
# Two tables, because two different questions are asked of it. `[[repo]]` is the
# map this specification governs: the table in README.md, the diagram and the
# sentence counting them are GENERATED from it by scripts/gen_repos.py. Never
# edit either by hand; add the repo here and run the generator. `integrity.py`
# fails when they disagree, which is what stops the drift this file exists to
# end: the count read "eleven" for as long as it took somebody to create a
# twelfth repository and notice.
#
# `[[ungoverned]]`, at the foot, is the rest of the organisation — in it, and
# outside the map. Nothing renders it; `shared/adoption.toml` is held to it, and
# the pin fan-out bumps its pins as it does the map's.
#
# order : the order the README lists them in. Not alphabetical — it runs from
#         the specification outward through the surfaces to the things that
#         exist only so a tool works, which is the order a newcomer needs.
# spec  : the pages under 30-repos/ describing it, in reading order. Empty where
#         the repository has no page of its own.
# lang  : what a contributor will be writing.
# note  : the one thing about it that is not true of its neighbours.
# service: the stack service whose image the repository builds, which makes it
#         `lemonfiber-<service>` (ADR-0033 §1). The train tags a repository
#         carrying it before the core, and the core once the embedded stack pins
#         what that tag published (ADR-0033 §4). Absent everywhere else.
# plugin: the first-party plugin the repository publishes, which makes it
#         `plugin-<id>`, its id the id of the stack service it takes the place of
#         (ADR-0045). Every bundled part has one. Drawn as one node between them in
#         the diagram. Absent everywhere else.
# image : on a repository carrying `plugin`, and required there: whether it builds
#         an image. One that does is a stream the train cuts: every version that
#         cuts the core cuts it, tags it before the core, and tags the core once the
#         bundle it embeds pins that tag's release (OPS-R86). One that does not is
#         never tagged; the bundle pins it by revision and tree digest.

