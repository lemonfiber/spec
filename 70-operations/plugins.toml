# The plugins the release train gates on — OPS-R67.
#
# Not a release stream. OPS-R59 keeps the plugin catalogue off the train and
# nothing here changes that: a repository named below is an *input* to the gate,
# never an artefact the gate tags. No version manifest names any of them, and a
# contribution to one moves no version number in this organisation.
#
# Why the lemonfiber version is pinned here and not in the plugin's own manifest:
# `plugin.toml` deliberately has no `min_lemonfiber_version`, because F3-R21
# refuses an unmet requirement by naming the capability rather than a version.
# That is right for an operator installing a plugin. It is not enough for the
# train, which has to say what it gated against — so the plugin pins the manifest
# generation it is written in (`schema_version`, in its own file) and this pins
# the version of lemonfiber the train holds it to.
#
# `from` is the first version a plugin rides. Below it the plugin is not gated at
# all, which is how 0.15.0 releases without waiting on a plugin that targets the
# version introducing plugins. At or above it, everything about the plugin is
# required to be there: a repository that cannot be reached, a manifest that is
# absent, a schema that has moved, or a proof report that is missing or does not
# say passed, each fails the run by name. A gate that skips what it cannot find
# reports success about the part it could read.

schema = 1

[[plugin]]
id = "komga"
repo = "plugin-komga"
manifest = "plugin.toml"
report = "proofs.json"
ref = "main"
from = "0.16.0"
schema_version = 1

[[plugin]]
id = "uptime-kuma"
repo = "plugin-uptime-kuma"
manifest = "plugin.toml"
report = "proofs.json"
ref = "main"
from = "0.16.0"
schema_version = 1
