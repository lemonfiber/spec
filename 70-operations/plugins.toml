# The plugins the release train gates on — OPS-R67.
#
# Not a release stream. OPS-R59 keeps the plugin catalogue off the train and
# nothing here changes that: a repository named below is an *input* to the gate,
# never an artefact the gate tags. No version manifest names any of them, and a
# contribution to one moves no version number in this organisation.
#
# This file holds **where to look and nothing else**. Every number the gate
# compares is the plugin's own declaration, read out of the plugin's own files:
#
#   plugin.toml   `schema_version` — the manifest generation it is written in
#   targets.toml  `lemonfiber`     — the release it is validated and proved against
#   proofs.json   what its own CI left when it last ran everything it declares
#
# That split is not tidiness. A version pinned here as well would be a second
# statement of the same fact, and the two would disagree on the day one of them
# was edited — which is the failure this organisation keeps finding in numbers a
# person maintains. The plugin says what it targets; this says where to read it.
#
# `targets.lemonfiber` is also what decides when a plugin starts being gated. A
# release below it is not this plugin's business and the plugin is not cloned; at
# or above it, nothing about the plugin may be missing — a repository that cannot
# be reached, a manifest that is absent, a schema that has moved, or a proof
# report that is missing or does not say passed, each fails the run by name. A
# gate that skips what it cannot find reports success about the part it read.
#
# Why `lemonfiber` is pinned in the plugin rather than in `plugin.toml`: ARCH-R89
# forbids a manifest carrying a minimum lemonfiber version, because F3-R21
# requires an unmet requirement to be refused by naming the capability that is
# missing rather than a number that cannot say which one. What the train needs is
# a different fact — which release it gated against — and `targets.toml` is where
# each plugin states it.

schema = 1

[[plugin]]
# The template F10-R7 asks for, and the first entry here whose failure is a
# failure of the *format* rather than of one plugin. It is required to validate
# and prove unmodified, so a release that breaks it has broken what every author
# starts from — and the train should stop for that before it stops for anything
# built on top of it.
#
# It is also where `.github/interim/` is written; the other two carry byte-identical
# copies and each fails when its copy drifts from this one.
id = "template"
repo = "plugin-template"
manifest = "plugin.toml"
targets = "targets.toml"
report = "proofs.json"
ref = "main"

[[plugin]]
id = "komga"
repo = "plugin-komga"
manifest = "plugin.toml"
targets = "targets.toml"
report = "proofs.json"
ref = "main"

[[plugin]]
id = "uptime-kuma"
repo = "plugin-uptime-kuma"
manifest = "plugin.toml"
targets = "targets.toml"
report = "proofs.json"
ref = "main"
