# Plugins, part two — what the bundled stack can do, where a plugin comes from.
#
# F9 gives all twenty bundled services their capabilities and their probes. That is the
# larger half of the capability work and the smaller half of its thinking, and it is what
# makes substituting a plugin for a *bundled* service possible rather than merely
# describable. It is work in the stack repository as much as in this one.
#
# The wiring conversion F9-R4 asks for is 0.16.0's, because F4-R1, F4-R9, F4-R10, F4-R11
# and F4-R12 cannot be built while every wiring still names a service.
#
# With it, the catalogue and its provenance (F5). F5-R3 requires catalogue releases to be
# signed and no artefact-signing mechanism exists yet — L1-R2 owes one at 1.0.0, which is
# after this. ADR-0023 decides signing is one capability with two consumers and the
# earlier consumer sets its date, so it has to land here.
#
# The catalogue is a repository this organisation has, and `satisfied_in` names it. F5
# describes the catalogue itself and five of its goals are already cited there; a list
# without it reports those unmet for a reason that is not about the work, which is what
# OPS-R58 asks this field to prevent. It stays out of `repos`: naming it there would tag
# it, and OPS-R59 keeps the catalogue off the train.
#
# The three registered plugins are not named here and must not be. OPS-R67 makes a
# registered plugin an input to the gate rather than a stream, and a plugin citing a
# requirement declares that it complies with one, not that lemonfiber implements it —
# so searching those repositories would mark an unbuilt requirement cited.
#
# G9 stays: a mobile client is handed a stack it did not configure, which is the same
# question this version answers for a plugin.
#
# `D1-R22` to `D1-R26` are NZBHydra2's authentication, turned on by seed: without it the
# service hands its whole configuration, the indexer accounts and their keys among it, to
# anything that can reach it, and the indexer.search claim (`F9-R2`) could not be proven
# honestly. Its claim is recorded off a fresh container seeded this way.
#
# `ARCH-R154` and `ARCH-R155` are the networks a plugin's service joins when it stands in
# for one of the stack's: only where it is the settled filler of what the stack service
# fills, never a network kept for a link by name, and moved with the choice that settles
# it. Without them a stand-in for `F9-R6` either cannot be reached or reaches further than
# the service it replaced.
# 76 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
#
# Thirty-six of them were added after staging, each reviewed as a goal change (OPS-R31).
#
# `E1-R1` went out with 0.14.0 unmet: every image in the stack is still named by tag,
# and the requirement forbids resolving one that way. It is locked here with the
# digest pinning that meets it, and 0.14.0's manifest records why it no longer claims it.
#
# `B1-R16`, `B1-R17` and `B1-R18` are what the companion reads to show a partial stack as
# the forms that brought it (N18): the forms behind each running service, what an active
# form filtered out and why, and the footprint the stack estimates for a form.
#
# `B1-R19` and `B1-R20` keep that partial stack from reading as partial: the stack's
# condition is counted over what the active forms hold, and a service a form filtered
# out is reported as filtered rather than listed as absent.
#
# `F10-R12` to `F10-R16` let a proof or a contributed check declare a recording it fails
# on, with the reason, for an assertion whose passing state cannot be recorded without an
# account nobody holds. Failing there is reported as failing as declared, never as passed,
# and passing there fails the run. They supersede `F10-R11`, which reported that failure
# as a pass, and `F5-R13` supersedes `F5-R2` so the catalogue's CI reads the same verdict
# (OPS-R31).
#
# `G5-R14`, `D6-R15` and `D6-R16` are the decline address: an invitation carries the
# household front door and an address to refuse it at, a service the stack keeps running
# beside the front door serves the refusal, and the core reports a refused invitation as
# `declined`, apart from one that lapsed. Their siblings are locked by released versions,
# so this is the first version that can hold them.
#
# `N1-R18`, `N1-R47` to `N1-R49`, `N1-R62` and `C6-R19` are the stack's side of pairing a
# companion. On an operator's request, from a surface they are already admitted to, the
# stack produces pairing material. That material carries the address to reach, the SHA-256
# digest of the certificate that address will present, and an identifier that is the
# stack's own and survives re-issue. It carries no credential and expires. The certificate
# is announced before it is replaced. Without them the companion refuses every real stack,
# because it pins a certificate and the stack presents none (ADR-0017, ADR-0018, ADR-0025).
#
# `N1-R73` and `N1-R74` are the typed half of the same act. The companion asks a person
# who typed the material to compare a short code against what the stack shows, so the
# stack shows that code beside the material, folded the way the companion folds it.
# Without them typed pairing asks for a comparison against nothing (OPS-R31).
#
# `G9-R13` and `N1-R76` keep the hand-off and the pairing material in words every surface
# can show. Both are produced once and shown by the terminal, the web interface and the
# companion alike, and both named terminal commands the companion cannot carry out. The
# next step now travels as a remedy each surface renders in its own way (OPS-R31).
#
# `C6-R21` closes Jellyfin's cross-origin reads to the household front door. It is the
# fourth requirement ADR-0029 decided, beside `D6-R15`, `D6-R16` and `G5-R14`: the decline
# address is served from the front door's origin, and Jellyfin answers every origin until
# its allow-list names that one. It ships with them (OPS-R31).
#
# `C6-R20`, `C6-R22` to `C6-R25` and `D1-R19` to `D1-R21` are ADR-0032's request gate.
# `C6-R20` keeps an administrative credential on another service to the one
# household-tier service ADR-0029 confines for the decline address. Seerr is household
# tier and holds Sonarr's, Radarr's and Jellyfin's, because `D1-R17` registers each \*arr
# with it by that \*arr's key and `D1-R7` initialises it through Jellyfin's administrator.
# The gate holds those credentials instead and hands Seerr a token per route, answers a
# fixed list of calls it builds itself, forwards a removal one id at a time and records
# it, and refuses the rest. The decline service and the gate are the two confined
# services the household tier reaches the stack through, so they ship together
# (OPS-R31). Each is its own repository building its own image (ADR-0033), so both are
# streams this version cuts: they are tagged first, the stack pins the images those tags
# publish, and the core that embeds the stack is tagged after.
#
# `ARCH-R4` and `ARCH-R27` are refusals the platform and the manifest owe from their
# first version and nothing makes. A stack declaring a `min_cli_version` above the
# running binary is read as though it declared none, and Linux with Docker Desktop is
# read as native Linux, so the service user is asked for where ownership is cosmetic and
# the autostart check asks a service manager Docker Desktop does not use. Both are
# locked here rather than later because this version hands the bundled stack to plugins
# and catalogues that move at their own pace (OPS-R31).
version = "0.17.0"
