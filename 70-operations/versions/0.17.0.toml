# Plugins, part two — what the bundled stack can do, where a plugin comes from.
#
# F9 gives all twenty bundled services their capabilities and their probes. That is the
# larger half of the capability work and the smaller half of its thinking, and it is what
# makes substituting a plugin for a *bundled* service possible rather than merely
# describable. It is work in the stack repository as much as in this one.
#
# The wiring conversion F9-R4 asks for is 0.16.0's, because F4-R1, F4-R9, F4-R10, F4-R11
# and F4-R12 cannot be built while every wiring still names a service.
#
# With it, the catalogue and its provenance (F5). F5-R3 requires catalogue releases to be
# signed and no artefact-signing mechanism exists yet — L1-R2 owes one at 1.0.0, which is
# after this. ADR-0023 decides signing is one capability with two consumers and the
# earlier consumer sets its date, so it has to land here.
#
# The catalogue is a repository this organisation has, and `satisfied_in` names it. F5
# describes the catalogue itself and five of its goals are already cited there; a list
# without it reports those unmet for a reason that is not about the work, which is what
# OPS-R58 asks this field to prevent. It stays out of `repos`: naming it there would tag
# it, and OPS-R59 keeps the catalogue off the train.
#
# The three registered plugins are not named here and must not be. OPS-R67 makes a
# registered plugin an input to the gate rather than a stream, and a plugin citing a
# requirement declares that it complies with one, not that lemonfiber implements it —
# so searching those repositories would mark an unbuilt requirement cited.
#
# G9 stays: a mobile client is handed a stack it did not configure, which is the same
# question this version answers for a plugin.
#
# 30 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
#
# One of them was added after staging, reviewed as a goal change (OPS-R31).
#
# `E1-R1` went out with 0.14.0 unmet: every image in the stack is still named by tag,
# and the requirement forbids resolving one that way. It is locked here with the
# digest pinning that meets it, and 0.14.0's manifest records why it no longer claims it.
version = "0.17.0"
milestone = "M14"   # The platform
delivers  = "Plugins — what the bundled stack can do, and where a plugin comes from"
status  = "staged"
repos   = ["lemonfiber"]
satisfied_in = ["lemonfiber", "lemonfiber-media-stack", "lemonfiber-web", "sdk-ts", "sdk-php", "lemonfiber-plugins"]
goals   = [
    "F9-R1",
    "F9-R2",
    "F9-R3",
    "F9-R5",
    "F9-R6",
    "F5-R1",
    "F5-R2",
    "F5-R3",
