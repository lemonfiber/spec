# Plugins, part two — where one comes from, and what vouches for it.
#
# The catalogue, the operator's own source on the same technical terms, and the
# provenance that says which of the two an installed plugin came from.
#
# F5-R3 requires catalogue releases to be signed, and no artefact-signing mechanism
# exists yet — L1-R2 owes one at 1.0.0, which is after this. ADR-0023 decides that
# signing is one capability with two consumers and the earlier consumer sets its date;
# the capability has to land here rather than at 1.0.0.
#
# The catalogue is a repository this organisation does not yet have. It is named in
# neither repos nor satisfied_in until it exists, or the goal gate searches a checkout
# that cannot be made.
#
# G9 stays: a mobile client is handed a stack it did not configure, which is the same
# question this version answers for a plugin.
#
# 24 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
version = "0.17.0"
milestone = "M14"   # The platform
delivers  = "Plugins — where they come from, and what vouches for one"
status  = "planned"
repos   = ["lemonfiber"]
satisfied_in = ["lemonfiber", "lemonfiber-web", "sdk-ts", "sdk-php"]
goals   = [
    "F5-R1",
    "F5-R2",
    "F5-R3",
    "F5-R4",
    "F5-R5",
    "F5-R6",
    "F5-R7",
