# Plugins, part one — what a plugin is, installing one, and what that leaves readable.
#
# Re-sliced twice, and the second time is worth recording. The first cut put the manifest
# alone here, which ships a plugin format with no way to install a plugin — close to the
# stub OPS-R54 exists to refuse. The second put capabilities behind it and check_order
# refused it: F6 requires F4.
#
# It requires the *vocabulary*, which is why F4 was split. F4 is now the model and its
# rules; F9 is the nineteen bundled services declaring in it and the wiring converted to
# ask. Reading F6's five capability references shows three are the host-feature sense of
# F3-R21 rather than F4's at all, and the two that are F4's are satisfiable between two
# plugins. So the vocabulary ships here and the declarations ship in 0.17.0.
#
# What that means for the operator, said plainly: a plugin adds a service here, and can
# take over a capability another *plugin* was filling. Standing in for a bundled service
# needs F9 and waits for 0.17.0.
#
# F3-R15, R16, R19, R20 are absent because they were withdrawn to F8; F4-R5 because it
# was withdrawn to F9. OPS-R30 forbids a Withdrawn requirement being a goal.
#
# 59 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
