# Plugins, part one — the whole plugin system except the recipes.
#
# Re-sliced, and not as first drafted. The first cut put the manifest alone here and the
# lifecycle behind it, which would have shipped a plugin format with no way to install a
# plugin — close to the stub OPS-R54 exists to refuse. The second cut kept capabilities
# back to 0.17.0 and did not survive check_order: F6 requires F4, because its rehearsal
# states which capability would change hands and F6-R11 is about one left unfilled. So
# the substitution vocabulary comes with the lifecycle that uses it.
#
# What is held back is recipes (F8), which is the split that was actually load-bearing:
# a recipe runs with lemonfiber's own authority on behalf of a stranger's manifest, and
# it is the riskiest mechanism in the design. It does not belong in the same version as
# the first plugin anything.
#
# F3-R15, R16, R19 and R20 are absent because they were withdrawn to F8 (GOV-R8 keeps
# the numbers dead); OPS-R30 forbids a Withdrawn requirement being a goal.
#
# 60 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
version = "0.16.0"
milestone = "M14"   # The platform
delivers  = "Plugins — what one is, what it may stand in for, and what installing one leaves readable"
status  = "planned"
repos   = ["lemonfiber"]
satisfied_in = ["lemonfiber", "lemonfiber-media-stack", "lemonfiber-web", "sdk-ts", "sdk-php"]
