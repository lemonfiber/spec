# Plugins, part one — what a plugin is, installing one, and what that leaves readable.
#
# Re-sliced twice, and the second time is worth recording. The first cut put the manifest
# alone here, which ships a plugin format with no way to install a plugin — close to the
# stub OPS-R54 exists to refuse. The second put capabilities behind it and check_order
# refused it: F6 requires F4.
#
# It requires the *vocabulary*, which is why F4 was split. F4 is now the model and its
# rules; F9 is the twenty bundled services declaring in it and the wiring converted to
# ask. Reading F6's five capability references shows three are the host-feature sense of
# F3-R21 rather than F4's at all, and the two that are F4's are satisfiable between two
# plugins. So the vocabulary ships here and the declarations ship in 0.17.0.
#
# What that means for the operator, said plainly: a plugin adds a service here, and can
# take over a capability another *plugin* was filling. Standing in for a bundled service
# needs F9 and waits for 0.17.0.
#
# F3-R15, R16, R19, R20 are absent because they were withdrawn to F8; F4-R5 because it
# was withdrawn to F9. OPS-R30 forbids a Withdrawn requirement being a goal.
#
# A plugin here also extends lemonfiber itself, and that did not re-slice anything.
# F3-R26..R30 and F4-R15..R17 let a manifest contribute a doctor check and the remedy
# it carries. They need no feature this version does not already lock: the engine is
# C1's, shipped in 0.8.0, and the wording is G4's, shipped in 0.5.0, so check_order is
# satisfied by features six versions old. The two contributions an operator will ask
# for and not get are named in F3 with their reasons — a dashboard panel, because the
# renderer has no panel vocabulary to declare into, and a command, because the command
# surface is generated from the types the binary parses. The third, a repair that acts,
# is a recipe and arrives with F8 in 0.18.0; overriding a bundled check is F9's and
# waits for 0.17.0 with the rest of standing-in.
#
# The three artefacts were the thing this version was missing and nobody had written
# down as missing. F4-R2 has required a published vocabulary since it was accepted,
# ARCH-R92 a generated schema, F4-R15 the extension points — and the two plugins
# published against this format namespace every capability they claim, because there
# was no core name to claim, which makes every one of them inert. Both install a
# container and wire nothing. F4-R18..R24 and F3-R33..R35 are those three artefacts
# and the manifest surface that uses them, which is what turns a plugin that can be
# read into one that can be useful.
#
# The architecture numbers are goals here for the first time since 0.10.0, and the
# reason is the same one: what those three artefacts must be is settled in the
# contracts rather than in the feature. A feature says a vocabulary is published;
# `ARCH-R106..R110` say what is in it, that `declared_by` is read off the stack
# rather than written, and that a probe asks what the service does. `ARCH-R111..R115`
# and `R118` do the same for the points, `R116` and `R117` for the manifest surface,
# `R92` and `R93` for the generated schema, and `R119` for what a probe may assume the
# operator has. Leaving them out of every version was why an implementation could mark
# them done and be told the spec did not back the claim.
#
# F10 is here rather than unscheduled, and it is here because it was being built
# against while it was still Draft — which is the one thing the status vocabulary
# says a Draft may not be. The template it asks for exists, the schema it is
# written around is generated and published, and the three sets an author may name
# are answerable from the binary. A feature whose requirements are being satisfied
# is not proposed; it is late being said so.
#
# 106 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
