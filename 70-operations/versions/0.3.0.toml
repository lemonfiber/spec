# 0.3.0 — M4, first slice: backup & restore.
#
# The maintenance capability M4 owes: backup and restore (E3) — quiesced
# captures, never a live SQLite copy — which is what turns a configured stack
# from precious into reproducible now that seeding already rebuilds the wiring.
# Auto-wiring & seed, M4's other half, is 0.4.0.
#
# Homepage widget-key injection is another M4 deliverable, but it has no
# requirement of its own: it extends the existing seed (D1-R1 reads each key,
# D1-R4 reads it back), already satisfied for the *arrs, to write Homepage's
# config too. It is scope, not a new goal; a future session that wants it tracked
# should add a dedicated D1 requirement before staging. Bindery via Torznab
# (D1-R15) stays deferred — its API cannot be pinned without live verification.
#
# The read-only ratatui dashboard (B3) that this version once also opened has
# moved to 0.6.0 (M6). Every B3 requirement is a display requirement — "the
# dashboard MUST show…", "visually distinct", "rendered as…" — none satisfiable
# without the ratatui surface, so shipping them here would have released a
# dashboard nothing draws. The whole of B3 — the already-built read-model and the
# render loop over it — lands with the rest of the TUI in 0.6.0 instead. This was
# an OPS-R31 change to a staged version's locked goals.
#
# Staged: the goals below are now frozen (OPS-R31) — changing the set needs review
# and a maintainer-channel notice. A release/0.3.0 branch is cut in lemonfiber
# (OPS-R33), and execute-version ships once the tracker sees every goal satisfied.
version = "0.3.0"
epoch   = "v1"
milestone = "M4"   # Seed & backup
status  = "released"
repos   = ["lemonfiber"]
goals   = [
    # M4 — backup & restore (E3), the maintenance capability that makes a
    # configured stack reproducible from an archive. E3-R5 (a backup taken
    # automatically before an update, adoption or removal) is not here: those
    # operations are M9 (0.9.0), so the auto-backup that hooks them ships with
    # them, not before they exist.
    "E3-R1", "E3-R2", "E3-R3", "E3-R4", "E3-R6", "E3-R7",
    "E3-R8", "E3-R9", "E3-R10", "E3-R11", "E3-R12", "E3-R13", "E3-R14",
]

[pins]
media-stack = "aaabfbbbfd77bbbbcfd74c3cc171ae9a83fdbe9b"
