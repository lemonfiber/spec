# The household's library — what a member can find, ask for and play.
#
# A member's own search and ask, answered under their limits (D4); and a member's
# display name and the default member the operator previews (D6). The grant, the guarded
# front door and the reads a member plays from are 0.18.0's (D11).
#
# `G10-R4`, `G10-R7` and `G10-R8` are the web's member view of those reads: asking,
# playing, and a player that holds no second copy of what a member may watch. They are
# the web surface's, so `lemonfiber-web` is searched; it is not tagged.
#
# `N2-R28` is the operator's side of what the household plays: every session the media
# server is playing, as the `playing` read and event carry it. It is the companion's, so
# `lemonfiber-companion` is searched; it is not tagged.
#
# `ARCH-R279` to `ARCH-R282` are what the companion's notifications are built on
# (ADR-0047): the closed list of notification kinds every alert names, the kinds a stack
# raises on the alerts read, the alerts a resumed stream replays, and the UnifiedPush
# endpoints a phone registers to be woken. They are the core's. The companion's side is
# `N27-R17` and `N27-R26`, each stack's kinds offered as switches on the notification page with
# a floor for problems kept on the phone, and `N4-R25` to `N4-R27`, `N4-R29` and `N4-R30`,
# waking without Apple's or Google's push and through UnifiedPush where Android has a
# distributor, stack by stack; scheduled here beside the core's by the maintainer's decisions
# of 2026-10-31 (OPS-R31).
#
# `B5-R1`, released in 0.5.0, is amended in place: a new request and an answered invitation
# reach the operator's phone as the `request` and `member` kinds, never a household member,
# and the core's refusal of every request and household event narrows to refusing one
# addressed to a member. It ships with `ARCH-R279`. Amended by the maintainer's decision of
# 2026-10-12 (OPS-R31).
#
# `ARCH-R288` and `ARCH-R289` are what the companion's N30 sends: a disruptive finding that
# says what it disturbs, its bound and how to run it, and a `space` agreement narrowed to the
# categories of the offer. They are the core's. `N30-R4`, `N30-R5`, `N30-R9` and `N30-R12`
# are the companion's side of `ARCH-R289`: the room that costs nothing given back one
# category at a time, against the stack's named offer, each confirmed once and answered
# without a path; scheduled here by the maintainer's decisions of 2026-10-31 (OPS-R31).
#
# `ARCH-R290` is what the companion's N31 reads: a trace that says a search would settle it
# and what the search spends. It is the core's; N31 itself is the companion's.
#
# `D11-R11` to `D11-R13`, with `ARCH-R291` and `ARCH-R292`, are live TV at the guarded
# front door: the core opens a channel's live stream on the member's behalf and answers a
# pass, and the door asks the core about that pass on every request for its bytes. They
# are the core's and the door's, by the maintainer's decision of 2026-10-12.
#
# `D11-R14` to `D11-R16`, `G10-R14`, `ARCH-R417` to `ARCH-R421` are what live TV and the
# browser play on: the channels a member may watch, `tune` and `untune` over `media.serve`,
# a transcoded live stream read from its one query parameter, an item pass sealing a
# session on the member's own account for a browser, the playlist the guard writes the
# pass into, and the reads and actions that answer them. `D11-R11` to `D11-R13` and
# `ARCH-R314` are amended in place. They are the core's, the door's, the media servers'
# adapters' and the web surface's, by the maintainer's decisions of 2026-11-13 (OPS-R31).
# `lemonfiber-door` is searched for `D11-R13`, `D11-R15`, `D11-R16`, `ARCH-R292`,
# `ARCH-R417` and `ARCH-R418`.
#
# `A5-R15` keeps an import from handing the key of the operator's other stack to anything
# but the first-party adapter lemonfiber already runs for that service. It is the core's.
#
# `F14-R31` proves every capability 0.18.0's `F14-R14` does not name by a substitute of its
# own, end to end. Added by the maintainer's decision of 2026-10-29 (OPS-R31).
#
# `ARCH-R416` lets a member read the front door, narrowed to the services facing the
# household, each saying whether its address answers from where the member is. It is the
# core's side of `G10-R12`, `G10-R13` and `N9-R10`; added by the maintainer's decision of
# 2026-11-13 (OPS-R31).
#
# 136 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
# [pins] is written by release-finalize at publish (OPS-R35); left out while planned.
#
version = "0.19.0"
