# `N21-R1` to `N21-R11`, `N3-R1` to `N3-R26` but for the three earlier versions lock,
# `N1-R77`, `G2-R14`, `G2-R15`, `G10-R12` and `G10-R13` are the rest of features
# 0.18.0 touches, which no version locked. A version touching a feature with a
# requirement no version locks is refused (OPS-R54), so each is locked in the version
# after the one that touches it, by the maintainer's decision of 2026-10-11. They are
# the companion's and the web surface's, so `lemonfiber-companion` and `lemonfiber-web`
# are searched.
# `B8-R15` and `B8-R16` keep what the post-boot verification came to and serve it at
# `GET /api/boot`, the read the companion's `N16-R7` draws, by the maintainer's decision of
# 2026-11-07.
# `C7-R16` and `ARCH-R389` let the operator have lemonfiber act once on each stuck item,
# through `library.curate@1`'s `unqueue` and `grab` from minor 2, by the maintainer's
# decision of 2026-11-08.
# `K2-R15`, `K2-R16` and `ARCH-R390` make the outside watcher a capability the core
# provisions and reads (ADR-0061), so the companion's N16 page draws it; `K2-R3`, `K2-R4`,
# `K2-R5`, `K2-R7`, `K2-R8`, `K2-R10` and `K2-R12` move here from 0.23.0 with it, by the
# maintainer's decision of 2026-11-08.
# `H5-R1` to `H5-R15` move here from 0.21.0, and `H5-R16` and `ARCH-R391` join them: the queue
# heals by strikes over the curator and the client, and its read is the one the companion's
# N16 page draws (ADR-0063), by the maintainer's decision of 2026-11-08; `ARCH-R392` joins
# them, `library.curate@1` minor 3 naming each downloading entry's queue id, by the
# maintainer's decision of 2026-11-08.
# `ARCH-R393` lets a first-party plugin provide a capability whose contract the build speaks
# before a bundled service declares it, so the outside watcher's bundled declarer can be
# built, by the maintainer's decision of 2026-11-08.
# `ARCH-R394` pins a first-party plugin the stack does not ship as `[[offered]]`, so a second
# filler of a capability a part fills installs as first-party from the tree the build carries,
# by the maintainer's decision of 2026-11-08.
# `D4-R22`, `D4-R23`, `D7-R16`, `ARCH-R395` and `ARCH-R396` let a member ask for music and
# books through the core, over `music.curate@1` and `books.curate@1`, under the household's
# own policy, so the lidarr and bindery arms of `F14-R14` carry a household request, by the
# maintainer's decision of 2026-11-08.
# `F1-R15` answers one read of how the stack runs without lemonfiber, so the companion can
# show it under N19, by the maintainer's decision of 2026-11-09.
# `D4-R24`, `D4-R25` and `D4-R26` answer which kinds a member may ask for, serve music and book
# covers, and report kept asks as arrived, so the companion's music and books pages can be
# built, by the maintainer's decision of 2026-11-09.
