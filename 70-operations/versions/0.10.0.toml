# The front door and what guards it — the web UI's security and binding policy, the entry surface, and the privacy stance.
#
# 61 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
#
# C6-R1, C6-R3, C6-R6, C6-R10 and C6-R12 moved to 0.9.0 (ADR-0011).
#
# G5-R6, G5-R7 and G8-R13 moved to 0.11.0, and G8-R4 and G8-R10 to 0.14.0
# (OPS-R31). Each names a subject this milestone does not build: G5-R6 and
# G5-R7 want an address carried in an invitation, and G8-R13 wants a household
# member told what the operator can see — invitations and household identity are
# D6, which 0.11.0 delivers. G8-R4 and G8-R10 constrain an update check that
# transmits nothing and gives up quietly; there is no updater, `install-updater`
# is false, and nothing here asks any version endpoint anything. E2 is 0.14.0's.
#
# They were seeded from this milestone rather than chosen for it, and a goal
# whose subject does not exist cannot be met — only ticked, which is the defect
# these gates exist to catch. What holds them meanwhile is unchanged: a version
# endpoint arriving in the source is red against the host list, and one arriving
# in the outbound enumeration must declare what it sends.
version = "0.10.0"
epoch   = "v1"
milestone = "M7"   # Web surface & UX
delivers  = "The front door, its security, and the privacy stance"
status  = "released"
released_on = "2026-08-27"
repos   = ["lemonfiber"]
# Five repositories satisfy these goals and this version cuts one of them.
# `ARCH-R55` is cited in `lemonfiber-web`, and C6 and G5 both reach that surface;
# `ARCH-R58` and `ARCH-R67` are the SDKs' own, and `ARCH-R60`, `R65` and `R66`
# are rules about generation that only an SDK can be held to; `C6-R2` and
# `C6-R17` are about which interface the stack publishes on, and are cited
# where that is declared.
satisfied_in = ["lemonfiber", "lemonfiber-web", "sdk-ts", "sdk-php", "lemonfiber-media-stack"]
