# **The dashboard.** `lemonfiber` with no subcommand opens a live view of the stack — the capability the whole of v1 has been building toward, and the reason this is 1.0.0 rather than another minor. Released through the signed, multi-platform pipeline on all three platforms.
#
# 49 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
# `N1-R2` and `N1-R5` are the companion's parity with every other surface, in what it
# offers and in what it lets an operator set; `N25-R15` is that parity for proving a
# plugin again, `N25-R16` to `N25-R20` for running a plugin's demand recipe,
# `N30-R10` and `N30-R11` for running every check or a group of them, and `N25-R21`
# to `N25-R24` with `N9-R12` for a third-party plugin's grants. They are cited in
# `lemonfiber-companion`, which is searched and not tagged.
# `N3-R42` to `N3-R44` are that parity for a member signing in by a code, `N3-R45` and
# `N1-R79` the requirements that excuse the app from `play` and from replacing the
# pairing certificate, by the maintainer's decisions of 2026-11-19.
# `ARCH-R447` and `ARCH-R448` serve what a stop would interrupt and how the surface is
# served to a remote caller, `N1-R81` and `N2-R42` are the companion's operator screens
# for them, and `N1-R80` excuses it from the kinds the core answers only to its command
# line or to the web surface itself, by the maintainer's decisions of 2026-11-20.
# `ARCH-R449` lists every decision setup makes on the `config` read, `N1-R82` is the
# companion's screen for changing each, and `N1-R83` keeps credentials and autostart at
# the machine, by the maintainer's decisions of 2026-11-21.
# `ARCH-R453` lists each area declared unmanaged on the `config` read, with what it
# covers now, and `N19-R5` is the companion showing each, by the maintainer's decision
# of 2026-11-22.
# `ARCH-R454` has every SDK hand its caller every field an envelope carries beside `data`,
# checked in each SDK's CI, by the maintainer's decision of 2026-11-23. The four SDKs are
# searched for it.
# `ARCH-R455` has a resumed stream hand back the newest `start` and `pull` line of each item
# beside the records it keeps, by the maintainer's decision of 2026-11-24.
