# **The dashboard.** `lemonfiber` with no subcommand opens a live view of the stack — the capability the whole of v1 has been building toward, and the reason this is 1.0.0 rather than another minor. Released through the signed, multi-platform pipeline on all three platforms.
#
# 32 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
# `N1-R2` and `N1-R5` are the companion's parity with every other surface, in what it
# offers and in what it lets an operator set; `N25-R15` is that parity for proving a
# plugin again, `N25-R16` to `N25-R20` for running a plugin's demand recipe,
# `N30-R10` and `N30-R11` for running every check or a group of them, and `N25-R21`
# to `N25-R24` with `N9-R12` for a third-party plugin's grants. They are cited in
# `lemonfiber-companion`, which is searched and not tagged.
