# Away from the keyboard — remote control, autostart, customisation and the
# service catalogue.
#
# 72 goals: 71 seeded from the roadmap milestone this version serves, and one
# reaching it from an earlier feature;
# frozen at stage-version (OPS-R30).
#
# B10 joins B8 here because the two answer the same operator question — what keeps
# running when nobody is watching — and a reader looking for one will look where the
# other is. Its subject is older than this version: the two long-running commands it
# hosts shipped in 0.6.0 and 0.12.0, so the work satisfying these goals lands before
# the version does, the way G8-R4 and G8-R10 reach 0.14.0 from 0.10.0 (OPS-R31).
#
# B2-R16 arrives from 0.8.0 for the same reason. It asks every operation to say,
# before it acts, whether what it takes away is bounded — naming that bound — or
# open-ended. The disturbing doctor checks have said so since the killswitch made
# the case; the verbs that start and stop services never have, and no manifest in
# the train locked the goal, so nothing was ever going to ask. It is a constraint
# on operations this version already touches rather than a subject of its own, and
# it is met by those operations behaving.
version = "0.15.0"
milestone = "M9"   # Lifecycle & maintenance
delivers  = "Away from the keyboard — remote control, autostart, customisation"
status  = "released"
released_on = "2026-09-15"
repos   = ["lemonfiber"]
# Where the gate reads citations, which is not where this version cuts (OPS-R58).
# Two of these goals are satisfied in the stack repository and can be satisfied
# nowhere else: F1-R5 is the promise that a service is added without a lemonfiber
# change or release, and F2-R6 is the promise that every bundled image is native on
# both architectures. Both are properties of the stack description, so the commits
# advancing them are the stack's, and searching only what this version *tags* calls
# them unmet for a reason that is not about the work. Naming the repository here
# tags nothing.
satisfied_in = ["lemonfiber", "lemonfiber-media-stack"]
