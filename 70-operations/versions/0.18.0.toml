# `ARCH-R337` to `ARCH-R342` take the last part names out of the core (`F14-R2`): a
# plugin's setting and secret name the environment key an earlier release kept them
# under, a service names the paths a backup leaves out, an adapter may share its
# upstream's configuration directory (amending `ARCH-R227`), a request service names the
# key it mints for itself, an upstream may need a restart for what it is applied, and the
# core's own environment keys are named for what they hold. Added by the maintainer's
# decision of 2026-10-27 (OPS-R31). `ARCH-R342` names every credential the stack records
# for the capability it reaches, reversing `ARCH-R273`'s service-id names, and
# `ARCH-R347` gives an ordinal where two services would take one name, both by the same
# decision.

# `G5-R15` judges what a service is to the household by the contract the adapter in front
# of it speaks, and tells a shelf from the library by the media types a `media.serve`
# adapter declares; `G5-R2` and `G5-R3` are amended in place to name the contract rather
# than Seerr and Jellyfin. The request service and the media server leave the stack for
# their plugins in this version, so the door that named them ships with the moves. Added
# by the maintainer's decision of 2026-10-26 (OPS-R31).

# `G11-R1` to `G11-R5` are the web console's side of the grant `ARCH-R322` to `ARCH-R325`
# build: a switch per grant on install and update, the grants each plugin holds and every
# grant on the credentials panel, a revoke read before it runs, and none of it shown to a
# member. G1 puts every action on every surface, and the console is where an operator at a
# browser approves and ends a grant, so they ship with the grant. They are built in
# `lemonfiber-web`, which is searched and not tagged. Added by the maintainer's decision of
# 2026-10-24 (OPS-R31).

# `ARCH-R326` and the `--check` and `--adapter` options of `ARCH-R285` and `ARCH-R296` let
# a plugin's pull request prove the adapter it built against the live upstream with the
# core's recorder alone: the recorder stands in for every party the cases point the upstream
# at, so no plugin seeds an upstream or keeps a recorder of its own. The adapters' moves
# are recorded this way, so they ship with the moves. Added by the maintainer's decision of
# 2026-10-24 (OPS-R31).

# `ARCH-R327` scrubs a credential the upstream issues that no later case reads, such as the
# media server's session token, by the contract naming where its answer holds one. The
# media server's move is recorded with it, so it ships with the moves. Added by the
# maintainer's decision of 2026-10-24 (OPS-R31).

# `ARCH-R328` to `ARCH-R334` move the Usenet indexer aggregator, the listening server and
# the curator of books behind adapters: two facets the core asks of every provider, and
# `unsupported` for what an upstream cannot do. The three moves ship in 0.18.0, so these
# do too. Added by the maintainer's decision of 2026-10-25 (OPS-R31).

# `ARCH-R322` to `ARCH-R325` build `F14-R20`'s grant: a third-party plugin's crossing
# secret names the capability it is `for`, one per capability; the install or update offer
# names each credential that would cross as `<setting>@<plugin>` and the act takes it as
# an approval, every update asking again; `lemonfiber credentials revoke` and the
# `credentials-revoke` action end one, restarting what read it; the credentials read lists
# every grant. `F14-R20` ships in 0.18.0 and these are how. Added by the maintainer's
# decision of 2026-10-23 (OPS-R31).

# `ARCH-R320` and `ARCH-R321` let a curator of films or music be recorded doing what it
# does: `library.curate`'s kind-bound cases are asked once per media type, of the media
# types the upstream files, and the cases register a download client the curator keeps.
# The moves of the film and music curators cannot be recorded without them, so they ship
# with the moves. Added by the maintainer's decision of 2026-10-23 (OPS-R31).

# `ARCH-R319` adds `establish` to `request.intake@1`, the step that gives a fresh request
# service an owner through the identity source so it answers the key lemonfiber minted for
# it. The request service's move out of the core cannot be recorded without it, so it ships
# with the moves. Added by the maintainer's decision of 2026-10-23 (OPS-R31).

# `ARCH-R315` to `ARCH-R318` give an upstream an adapter fronts the credential lemonfiber
# mints for it: made at install, seeded through the service's environment or a starting
# file, handed to the adapter through the `upstream.json` fields its `upstream` names, and
# replaced in every place it was written. A bundled part's manifest names `api` until its
# move, and the move needs a credential the core holds without reading the service's
# configuration, so they ship with ADR-0045 §9's goal that no manifest names `api`.
# `ARCH-R302` is amended in place. Added by the maintainer's decision of 2026-10-23
# (OPS-R31).

# `ARCH-R291` moves here from 0.19.0, and `ARCH-R314` joins it: the network `ARCH-R312`
# puts the pass service on and the address `ARCH-R303` hands the guard both name the pass
# service, so the service, its key, the pass it confirms and the image it runs ship in the
# same version. Issuing a pass for a live stream (`D11-R11` to `D11-R13`) stays in 0.19.0.
# By the maintainer's decision of 2026-10-23 (OPS-R31).

# `ARCH-R313` lets a `[[wiring]]` name the line and the icon beside its service's dashboard
# entry, so the panel list the core applies to `dashboard.show` (`ARCH-R308`) shows the
# stack's own parts as its page does today, and a plugin naming neither shows its
# manifest's description and `<service id>.png`. Added by the maintainer's decision of
# 2026-10-23 (OPS-R31).

# `ARCH-R311` tells each download client its completed folder per category, shared by both
# under `/data/downloads/complete/<category>`, over `download.usenet`'s and
# `download.torrent`'s `file_under` and `filed`, and the extractor is handed the folder read
# back, so one curator's downloads land in the one folder the extractor is told;
# `ARCH-R312` puts the core's pass service on one network beside the guard, since the core
# joins no network of the project (ADR-0052). `ARCH-R240`, `ARCH-R241`, `ARCH-R242`, `ARCH-R249`,
# `ARCH-R263`, `ARCH-R275`, `ARCH-R291`, `ARCH-R299`, `ARCH-R303`, `ARCH-R306`,
# `ARCH-R308` and `ARCH-R310` are amended in place. Added by the maintainer's decision of
# 2026-10-22 (OPS-R31).

# `ARCH-R310` names the subnet of every network of the project, a `/29` of `10.80.0.0/16`
# chosen from the network's name, because a default engine's pools hold fewer networks
# than one stack's asks come to and a start failed on that. `F1-R1` is amended in place:
# plain Compose operability is held by the project lemonfiber writes and the `.env` beside
# it. Added by the maintainer's decision of 2026-10-21 (OPS-R31).

# `ARCH-R295` to `ARCH-R297` record every recording a manifest names again from its pin
# (ADR-0049): `lemonfiber plugin record` asks one fresh container per service after the
# first run its adapter performs, records an adapter's conformance cases in front of it,
# scrubs every credential, and writes a service whole or not at all. `ARCH-R285` is
# amended in place to name them. A first-party plugin's upstream pins cannot move once
# the media stack is frozen without them. Added after staging by the maintainer's
# decision of 2026-10-13 (OPS-R31).
#
# `ARCH-R303` to `ARCH-R309` say what the seven contracts `F14-R8` names carry (ADR-0050):
# the stream guard's envelope and the refusals the media server declares, the gate's routes
# with their credentials and token hashes, decline's key and invitations, the extractor's
# curators, the dashboard's panel list and widgets, and quality sync's probe as a run of its
# own program. `ARCH-R109`, `ARCH-R136`, `ARCH-R206`, `ARCH-R207`, `ARCH-R251` and
# `ARCH-R283` are amended in place.
# Added by the maintainer's decision of 2026-10-20 (OPS-R31).
#
# `ARCH-R302` refuses a manifest whose claim binds a probe asked as the operator for a
# capability a service an adapter fronts provides, the one case `ARCH-R295` could not
# record: lemonfiber holds only the adapter's key there. Added by the maintainer's decision of 2026-10-20
# (OPS-R31).
#
# `ARCH-R298` to `ARCH-R301` install a part the bundle pins `installed` (ADR-0045 §3):
# the `up` of a form holding its profile offers installing it from the embedded tree,
# `lemonfiber update` offers a stack running it as its own service the move in place,
# a declined move keeps the stack's service with what its adapter filled unfilled,
# first-party trust reads the tree digest too, and links by name and the occupied checks
# reach the replacing service. Added after staging by the maintainer's decision of
# 2026-10-13 (OPS-R31).
#
# `ARCH-R283` to `ARCH-R287` prove a part with no network surface live (ADR-0048): a
# `[[proof]]` may run its image's own program in a container of its own, with no network,
# bounded and recorded by the same run, judged wherever a proof is and by the doctor on
# its own cadence. Quality sync is such a part, and the media stack's move to its plugins
# needs every part proved. Added after staging by the maintainer's decision of 2026-10-12
# (OPS-R31).
#
# `ARCH-R275` to `ARCH-R278` settle what the settings and secret stores hold (ADR-0046): an
# assembled part keeps its plugin's `[[secret]]`; the journal keeps a secret's fingerprint,
# never its value, and undo restores the store's one previous value only while the
# fingerprints match; a crossing credential is read where it is held, never copied; and the
# core settings are a closed list, every other `LEMONFIBER_*` key staying
# `lemonfiber config`'s. `ARCH-R249` and `ARCH-R257` are amended in place, filing the
# environment file once at the cutover and sending the `settings` event to the operator
# alone. Added after staging by the maintainer's decision of 2026-10-12 (OPS-R31).
#
# `ARCH-R274` writes every instant the web API carries as one integer, whole seconds since
# the Unix epoch, in bodies, events and the links the core builds, so the companion and
# every SDK read one form. It ships with this version because keys, claims, sessions and
# the record are on the wire here. Added after staging by the maintainer's decision of
# 2026-10-11 (OPS-R31).

# `ARCH-R263` to `ARCH-R273` give every bundled part its repository before its adapter
# (ADR-0045): the stack the core ships is assembled from the bundle at `schema = 2`, which
# declares the profiles, forms, removed services, choices of filler and links by name and
# pins each first-party plugin by revision and tree digest, assembled or installed, with
# the profile it sits in; the register of reserved ids reads the whole bundle; and the
# plugin manifest gains the errand, starting files, an assembled part's `api` and a moved
# part's credential names. `ARCH-R171` is superseded by `ARCH-R263` and `ARCH-R264` and
# is not a goal. Added after staging by the maintainer's decision of 2026-10-11
# (OPS-R31).

# `C10-R18` to `C10-R22` mint a key as a claim, a link collected once within ten minutes
# and drawn as a code, which the core serves; `C10-R23` to `C10-R31` and `ARCH-R258` to
# `ARCH-R262` let a phone prove the operator with a device key in its secure hardware, over
# a challenge the core issues, in place of the password (ADR-0044); `N29-R1` to `N29-R10`
# are the companion's keys screen built on both. Added after staging by the maintainer's
# decision of 2026-10-11 (OPS-R31); `C10-R18` to `C10-R22` move here from 0.19.0, where the
# programs that collect a claim (`F12-R14`, `F13-R15`) stay.
# The companion's N1 rows that 0.17.0 does not carry are locked here, where the companion
# is searched, `N1-R29` to `N1-R31` among them because the capability set they read is
# `ARCH-R78`'s, served in this version. `N1-R2` and `N1-R5` are parity, every action and
# every setting another surface offers, which is claimed when the interfaces stop moving:
# 1.0.0.
# [pins] is written by release-finalize at publish (OPS-R35); left out while planned.
