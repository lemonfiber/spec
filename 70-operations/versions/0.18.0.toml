# Plugins, part three — the calls that configure what a plugin installed.
#
# Recipes last, and deliberately so. A manifest describes a container whose reach
# lemonfiber fixes (ADR-0021), so the worst one can do is fail to parse. A recipe runs
# with lemonfiber's own authority — the credential store, every service in the stack on
# its loopback port, and the open internet — on behalf of a manifest a stranger wrote.
# It is the riskiest mechanism in this design, and it arrives after two versions of
# operating the simplest plugin there is.
#
# It also completes the substitution story. 0.17.0 makes a plugin able to stand in for a
# bundled service; the first-run flows that some substitutions need — creating an
# account, claiming a server, reading a token back — are these.
#
# `F6-R14` to `F6-R16` and `F4-R26` to `F4-R28` put what 0.16.0 built at the command
# line on the web API: what is installed, installing, updating and removing a plugin and
# rehearsing each; what the stack wires to what; and choosing which service fills a
# capability, a contested one included, with the choice read back as the operator's.
# The contract publishes `plugins`, `wiring` and `substitution`, and no route or action
# produces any of them. The companion reaches a stack only over the web API (N1-R16),
# so its N5 and N25 cannot be answered until the core serves these.
#
# `F4-R29` gives that choice an optional reason, taken alike by `lemonfiber wiring fill`
# and the web API action and read back as the choice's `why`. The command takes no
# reason and records every operator's choice with none, so N5's "with their reason if
# they gave one" has nothing to show. It changes the command and the API together
# (ARCH-R48), so it ships with `F4-R27`.
#
# `F6-R17` and `F4-R30` make the yes to each of those writes the offer its rehearsal
# answered, so a manifest, a version or a wiring that moved between what the operator
# read and what they agreed to is refused by name (ADR-0031).
#
# `G10-R1` to `G10-R3`, `G10-R5`, `G10-R6` and `G10-R9` to `G10-R11` are the household's
# web surface that the core already answers for: signing in decides what is drawn, what
# a member may do and may watch is read from the core, approval and allowance are
# stated before a member asks, refusals read as refusals, and a member removed from
# the household is signed out at the next refused call. The rest of G10 waits on the
# core. `G10-R4`, `G10-R7` and `G10-R8` need playback, which 0.19.0 locks once the web
# builds on the reads this version serves (D11). `G10-R12` and `G10-R13` need the core to say which service
# faces a member and whether it answers from where they are. The web surface is where
# these are built, so `lemonfiber-web` is searched; it is not tagged.
#
# `B2-R17` to `B2-R19`, `D6-R17`, `D6-R18`, `A5-R13`, `A5-R14`, `C9-R16`, `D2-R13` to
# `D2-R15`, `ARCH-R131` and `ARCH-R132` are what the web API has to carry for accepted
# companion requirements to be answerable. Each is a field or an argument the core does
# not serve: a fetch with no entry in what the status reading says it disturbs and no
# progress on the event stream; start lines that name no job; no way to ask an action
# for a rehearsal, so a rehearsal cannot be told from an unconfirmed reading; a
# household member's removal, a replacement and a full reset that take a bare `confirm`
# rather than the offer their reading answered, which `D6-R17`, `A5-R13` and `C9-R16`
# settle by the rule ADR-0031 sets for the plugin writes; a guard released and one let
# go that answer alike; a removal that says nothing of watch history; a survey that
# names no configuration or library; and a quality reading that offers no presets, says
# nothing about future acquisitions and states no upgrade's cost. The companion reaches
# a stack only over the web API (N1-R16), and this version is the one putting the rest
# of what it reaches there on the wire, so they ship with it.
#
# `A7-R15`, `C1-R15`, `C4-R15`, `C6-R18`, `E3-R16`, `G7-R14` and `G8-R15` to `G8-R18`
# each joined a feature whose other goals a released version locks, and no version held
# them. `C4-R15` records installed plugins in the support bundle, and `G7-R14` puts an
# acknowledgement on what the health summary carries, which changes the contract.
# `A7-R15` needs this specification to say how a rotated credential reaches a plugin.
# `G8-R15` to `G8-R18` bind recipes, which F8 makes run.
#
# `A2-R16` and `D3-R14` are two more the companion needs on the wire (N15): what setup
# settled, read as facts on a read that offers no setup, and a walkthrough's steps each
# naming the job they belong to.
#
# `ARCH-R173` to `ARCH-R177` publish the rest of what the contract knows beside the
# artefact (D24, D25, D26): the event stream with its schemas and heartbeat, an example
# of every kind, read and action from golden fixtures, the code registry as
# `contract/codes.json` with the reference page generated from it, a diff against the
# previous release, and an OpenAPI document. `F8-R19` lists each recipe input a plugin
# asks for in the plugin reading, so the web console's install (F6) collects it before
# the yes.
#
# `ARCH-R178` puts what is playing on the operator's stream, so the Home Assistant
# integration (F12) follows it rather than polling, and `ARCH-R179` has the capabilities
# answer say the credential's scope, which the MCP server's member wording (F13-R3) and
# F12's entry handling read rather than infer.
#
# `A2-R17` makes setup's wire step normative: after the stack starts, setup wires it as
# `seed` does and reports each connection before it finishes, so a fresh install is one
# stack rather than containers that cannot find each other.
#
# `ARCH-R133` and `ARCH-R134` put what a request carries in the contract beside what an
# answer carries: the bodies the setup routes take, and every action with its arguments
# and the consent it asks for, generated so that an SDK generates them too. Without them
# setup from the web (`G1-R14`) is built against the server's source, and a client meets
# an action the core added only when a new kind arrives with it.
#
# `ARCH-R138` and `ARCH-R139` give every refusal a code that says why, listed in the
# contract so that an SDK generates the list. Four refusals shared `403` and a sentence,
# and a client could tell a session the stack no longer admits from an account that may
# not ask only by parsing English, so the companion read an ended session as a refusal of
# entitlement and never offered to sign in again. `N1-R75` and `N3-R17` are the
# companion's reading of those codes; `ARCH-R77` now asks the code, not the status, to
# say whether sending something else would help.
#
# The architecture rows are here because `check_goal_coverage` reads `20-architecture/`
# too, and a row no version locks is reached by no gate. Those it exempts are the
# principles, the restatements and the dormant ones; the rest are locked here, and
# `ARCH-R78` to `ARCH-R82` among them are the capability set a client reads (N1). Where
# each stands is for the trackers to say, where the release gate reads it.
#
# `ARCH-R38`, `ARCH-R40` and `ARCH-R41` are the brand's, so `brand` is searched, and
# `ARCH-R81`, `ARCH-R99` and `ARCH-R129` bind a client, so the two SDKs are. None of the
# three is tagged: the brand releases on its own clock, and the SDKs take the contract
# a release attaches.
#
# `ARCH-R135` gives work that found other work holding the stack its own status. The core
# serialises lifecycle operations (B6-R8) and answers the one that waited its turn in vain
# with `500`, which a client can only word as a failure of the machine; B6 asks it to say
# another operation is in progress instead. It is a status on the web API, so it ships
# with the rest of what this version puts there.
#
# `B2-R20` and `B2-R21` are what a start that failed owes the operator. A start whose
# command failed read back no service at all, so a companion asked to name what did not
# come back (N16-R6) was told nothing fell short; and a service left created behind a
# dependency that never became ready read as stopped, which dropped the form the operator
# had just started from what the stack counts as brought.
#
# `ARCH-R136` and `ARCH-R137` are the contract `F9-R2` and `F9-R5` are built on. A
# bundled service declared its capabilities in `provides` with nothing binding a probe
# to a request and a recording, so there was no evidence to judge and no gate to refuse
# a pin that lost one. They give the stack manifest the claim a plugin already carries,
# and put every bundled claim through its recordings before a stack change merges and
# before a tag.
#
# `F5-R14` is what installing a plugin by its name rests on. `F5-R3` signs a catalogue
# release and refuses a signature that does not verify, and says nothing about what an
# install by name may resolve through; without this an unsigned index, or a revision
# other than the one reviewed, would satisfy the letter of it (ADR-0034). `F5-R15` holds
# an install by name to the newest index this machine has verified, so a release the
# catalogue replaced still verifies and is still refused.
#
# `C1-R16` and `C4-R16` are what the Health screens and a support bundle need to name a
# finding. A finding carried its service's identifier and no name, so a phone could only
# print `gluetun` where the operator knows Gluetun, and the core's own titles did the
# same; and a bundle's findings gave no code, which is what somebody helping searches by.
#
# `C1-R17`, `ARCH-R140` and `ARCH-R141` are what the companion's *What's new* (N27-R19 to
# N27-R21) is read from. A problem had no order on the wire, so nothing could say one was
# newer than the last one seen; the stack already keeps when each condition began, for
# notifications, and C1-R17 puts that onset on every wrong check it reports. ARCH-R140 is
# the one read that lists what can be new, and ARCH-R141 names the newest of each kind on
# the event stream, so a phone can mark a tab without reading every stack on every frame.
#
# `ARCH-R142` lists among the artefact's refusals the codes a repair, a restore and a
# replacement end with when the offer they were given has moved (`N2-R6`, `A5-R13`). The
# companion re-offers on that refusal and reports any other, and it could only tell the two
# apart by the sentence, which `ARCH-R138` forbids.
#
# `B1-R21` has a form's introspection name the services it would start that are already
# running. The companion drew every service of a form as one a start would bring up, right
# under the outcome of a start that brought them all up (`N18-R10`).
#
# `N3-R18` lets a member sign in from the app with their household account. The core
# admits a name and a password and the web surface already offers both, but the
# companion sent a password only, so a member could not sign in from the phone at all.
#
# `G2-R16`, `G4-R16` and `D7-R15` are the household spoken to in its own words: no
# service, size, address or state of the stack on any member's surface, a household
# sentence and remedy beside every refusal the core answers to a member, and an
# allowance stated as what it leaves room for. The core's member notices, the ones it
# places where the household asks, and the refusals `G10` and `N3-R17` render are all
# core text, so they ship with the household's web surface.
# `F10-R17` has the template plugin's manifest name, as a `#:schema` line, the manifest
# schema of the lemonfiber its `targets.toml` names, and its CI refuse the two
# disagreeing, so an author's editor checks the manifest against what that build
# reads. The work is in `plugin-template`, which no version searches, so its row is in
# the binary's tracker beside `F10-R7`'s.
# `F10-R18`, `F10-R19` and `OPS-R88` let a plugin's `targets.toml` name a commit of the
# core's `main` before a release carries what the plugin needs: its reader builds that
# commit the way the train's gate builds its candidate and proves against it, and the
# gate proves a plugin naming one with the candidate like any other. `OPS-R89` lets the
# bundle pin a revision naming a commit only where the core commit the release tags
# holds it. `plugin-jellyfin`, which this version cuts and bundles, needs what only
# `main` has, and no release or pre-release is cut to give a plugin something to build
# against. Added after staging by the maintainer's decision of 2026-10-11 (OPS-R31).
# `OPS-R90` and `OPS-R91` publish a first-party plugin's adapter image from every commit
# on its `main`, tagged by the commit, and move the manifest's pin to it through one
# rolling pull request, so `plugin-jellyfin` pins a real build of its adapter before any
# release carries it. A commit image is not a release and never moves the bundle.
# Added after staging by the maintainer's decision of 2026-10-11 (OPS-R31).
# `C10-R1` to `C10-R14` give a program that runs beside the stack its own credential: a
# named key with one scope, minted at the command line or over the web API with the
# password given again, shown once beside the stack's address and pin, and revoked by name
# (ADR-0037). `F12-R1` to `F12-R13` are the first program to hold one, Home Assistant,
# through `sdk-python`; both repositories are searched, neither is tagged. `L3-R1` to
# `L3-R8` are the image of lemonfiber a NAS installs from a template, built by the release
# with the templates under `packaging/` (ADR-0038). `F13-R1` to `F13-R11` are an MCP
# server over the same keys, its tools generated from the contract, its writes rehearsed
# with the offer as the yes; `C10-R15` to `C10-R17` let a member mint their own key once the
# operator allows it, and give every key a declared purpose. `integration-mcp` is searched,
# not tagged. Its member tools grow with this version's reads (D11).
# `D10-R15` and `D10-R16` pause and resume every download client in one request, and keep a
# pause until somebody resumes it; the pair is on the list of actions a key may call.
# `F8-R14` and `F8-R15` say when a recipe runs: on install, during an install and an
# update, or on demand, through `plugin run` with approvals of its own. `F8-R16` keeps a
# credential lemonfiber holds going back only to the service it belongs to, and holds every
# value a service answered with to that service by where it came from, not what it holds;
# `F8-R18` lets a pair release one elsewhere only with a reason the operator approves at
# consent, and `F8-R17` holds every value to where it may go again at each call.
# `G4-R17` has the problem a failed recipe ends with carry what every step came to as
# data, beside the sentence, so a client reads what landed without parsing it.
#
# `ARCH-R156` to `ARCH-R158` are what Home Assistant reads that the core did not serve:
# what the media server is playing, for the operator every session and for a member their
# own, and a stream a member is admitted to, carrying their household row, their held shelf
# and what they are playing and nothing of the operator's. `F12-R5` asks for active streams,
# `F12-R9` for what a member is playing and `F12-R7` for state that follows the stream, and
# the core refused every member the stream, so this version holds the three with them.
#
# `ARCH-R159` and `ARCH-R160` put in the artefact what the MCP server generates its tools
# from: every read the surface serves, with its path, its parameters and the kind it
# answers with, and whether repeating each action a key may call is safe. Without them
# `F13-R2` would generate from a list somebody wrote, and `F13-R5` could not state whether a
# write is idempotent.
#
# `ARCH-R162` sends each alert down the stream at onset and at resolution, with an
# identity pairing the two, which is what `F12-R6` fires a Home Assistant event from; read
# off the dashboard's list instead, an onset and its resolution could only be matched by
# their wording.
#
# `ARCH-R165` to `ARCH-R169` make the core honour the `Idempotency-Key` each SDK already
# sends with an action: the same key sent again is answered with the first send's answer
# and the action runs once, so a client that heard nothing back can send it again. How
# long and how many are remembered are two settings, and `A4-R13` holds them to a range
# when they are set.
#
# `ARCH-R161` gives each of a member's requests what their own screen shows it by: the
# kind of title, its year, when it arrived and the identifier their shelf names it by, so
# `F12-R9` can show a member's requests without asking the stack anything more.
#
# `ARCH-R170` binds the SDKs' generators: the contract is a directory whose definitions
# are reached by a path to their own file, and a reference a generator cannot resolve is
# refused rather than described as a field that accepts anything.
#
# `ARCH-R172` has each release carry JSON schemas of the bundle and, while a `--stack-dir`
# stack is read, of the root manifest and of a service's file, generated from the types
# the core reads them into, so a fork's CI can check one without the binary; a claim's
# definition is the plugin manifest's own.
# `B3-R16` puts the free space of both volumes a stack fills on the dashboard, the data
# volume and the services' own, so `F12-R5` can provide disk free per mount from the
# stream rather than from a read it would poll.
# `ARCH-R163` has the capabilities answer say which stack is answering, by the identifier
# pairing material already carries, to every credential a member's key included. Home
# Assistant keys a config entry and its device by it, which neither the address nor the
# certificate pin can be, so it lands before the integration's member slice (`F12-R2`,
# `F12-R9`).
# `B3-R17` puts each download client's paused state on the dashboard, so the pause and
# resume switch `F12-R8` provides shows what the clients say rather than what it last
# asked, without calling an action to find out.
# `ARCH-R164` has the rehearsal of each rehearsable action a key may call answer an offer,
# and a call carrying it refused where the stack moved since, as the plugin writes are;
# a call carrying none acts as before. Home Assistant's controls rehearse and then act
# (`F12-R8`), so what they carry out is what they were shown.
# `D11-R1` to `D11-R9` are ADR-0027's member grant and guarded front door: the grant a
# member's client plays on, the door that asks the media server about every byte, where
# each title's artwork and stream are served with the fingerprint the door presents, a
# title's details, what a member was part-way through, the progress a player reports
# back, and the pictures a browser reads from the core. The companion's player (N3-R14 to N3-R16) is built on them.
# `ARCH-R224` to `ARCH-R253` are the one service model every Compose entry is written
# from (ADR-0043): the stack's own services and every plugin's, generated as one project,
# with typed ports, mounts, environment and secrets, settings in the core's store, user
# mode, posture, shapes, storage, networks derived from asks with no shared default, the
# forwarded port passed contract to contract, and the operator's own overlay. A part moves
# into its first-party plugin (F14, ADR-0042) only where the plugin's entry says what the
# part's says, so the model ships with the plugins rather than after them. It takes the
# place of the single shape: `ARCH-R86`, `ARCH-R87`, `ARCH-R88` and `ARCH-R101` are
# superseded and are not goals, a change to a staged version's goals made under
# `goals-change` review (OPS-R31), and `F14-R23`, `F14-R27` and `B1-R14` say what the
# model writes. `ARCH-R254` to `ARCH-R257` put the settings the model reads on the web
# API, operator-only and never reading a secret back, and `N25-R12` to `N25-R14` are the
# companion's screens for them, because a setting the model writes has to be changeable
# from every surface (`ARCH-R248`). `REPO-R93` has each first-party plugin's CI run its
# images under the posture its manifest declares, which this version is the first to
# write them with.
# `ARCH-R336` is how a service that needs an operator's credential to start is held to it:
# the recorder runs it with declared stand-ins rather than skipping it, a goal locked
# beside `REPO-R93` under `goals-change` review (OPS-R31).
# `ARCH-R343` gives a service that speaks a contract a contract port apart from the port
# the household or another service reaches it on, published on loopback alone, so the
# decline service's page and the request gate's routes never carry its contract routes.
# `ARCH-R344` lets a service that speaks a contract be its own upstream, with no `fronts`,
# recorded against its own pin, which is how the decline service and the request gate speak
# `invite.decline` and `request.gate`: both goals locked under `goals-change` review (OPS-R31).
# `ARCH-R345` has every service the core hands a media server credential reach the media
# server only at an internal TLS port, pinned to the certificate the core makes for it
# (ADR-0054), so the decline service's and the request gate's Jellyfin keys never cross a
# network in cleartext. `ARCH-R346` is how the media server comes to serve that port and
# how the core knows each holder reaches it with a new certificate, the adapter saying the
# port is served now only where a handshake already presents the certificate's SHA-256.
# `ARCH-R353` replaces the certificate where it no longer names the media server's service,
# and `ARCH-R354` lets the operator replace it from the command line, the web API and the
# companion alike: all four goals locked under `goals-change` review (OPS-R31).
# `OPS-R93` publishes the images `plugin-caddy` and `plugin-door` run as their upstreams
# from repositories of their own, `lemonfiber-caddy` and `lemonfiber-door`, each moving its
# plugin's pin on a rolling pull request in the plugin's repository and never tagged by
# the train: a goal locked under `goals-change` review (OPS-R31). The guarded door's is a
# Rust service of its own (ADR-0056).
# `ARCH-R348` to `ARCH-R352` and `A2-R18` let a setting name the values its service accepts
# and what each needs (ADR-0055), so the core refuses a wrong value and holds a service
# back by name rather than leaving it restarting in a loop, and setup asks for the VPN
# type and then a provider the egress guard runs: goals locked under `goals-change`
# review (OPS-R31).
# `ARCH-R355` has the core look at every mount source from a configuration directory or a
# mount tree just before anything starts, and start nothing where one is reached through
# a link, the data root left to the operator: a goal locked under `goals-change` review
# (OPS-R31).
# 596 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
# `ARCH-R145` to `ARCH-R152` are those routes and actions as the web API states them:
# the two reads, the five writes taking the offer, a recipe's pairs and steps agreed to as
# themselves, and a git source fetched only from a public host (ADR-0036). With them the
# companion's N5, N20 and N25 can be answered, so every row of the three is a goal here too.
#
# `D6-R21` has the decline service take back an invitation whose window closes: it removes
# an account nobody was seen in, under guards read just before the call, and switches off
# a reset. Without it a lapsed invitation stays claimable at Jellyfin until a lemonfiber
# process next reads the household. The decline service is its own repository (ADR-0033),
# so this version cuts it, before the core.
# `F13-R12` to `F13-R14` and `ARCH-R185` to `ARCH-R198` give the MCP server's HTTP mode its
# certificate, and the assistant's reading of a tool result its boundary. An assistant whose
# provider makes the connection accepts only a publicly trusted chain, and an operator who wants
# nothing of a company outside the house still needs a way in, so the certificate comes one of
# four ways: the operator's files, ACME from any authority, a root lemonfiber makes and
# constrains to the server's names, or a certificate of its own pinned by fingerprint, which is
# what it serves unless told otherwise. The certificates contract writes the settings, state and
# renewal once, so the core's remote access offers the same four when it comes.
# `F14-R1` to `F14-R15` make every part of the stack a plugin and every plugin able to work
# as the part it replaces (ADR-0041). This is the version that closes plugin work, so the
# substitution story is finished here rather than carried: capabilities become contracts the
# core speaks, every bundled part moves to a first-party plugin built on the adapter kit, the
# guards and the parts that offered nothing get capabilities of their own, a substitution
# replaces what it stands in for, and each capability is proved by a real substitute. Added
# after staging by the maintainer's decision of 2026-10-09 (OPS-R31).
# `ARCH-R199` to `ARCH-R214` are the contracts themselves: generated per capability, spoken
# over keyed HTTP with every answer held to its schema, the media server's declared guard
# and locations, and conformance judged from recordings and a live pass.
# `D6-R22` to `D6-R26`, `N3-R27` to `N3-R30`, `N1-R78`, `N21-R12`, `G1-R15` and
# `ARCH-R218` to `ARCH-R220` give the household member a way in from the companion
# (`N3-R26`): every invitation carries a `lemonfiber://join` link with what the app needs to
# reach the house and know it, and a claim token that sets the first password through the
# core. `G1-R15` offers every address, link and key a surface shows as a QR code beside its
# text. Added after staging by the maintainer's decision of 2026-10-10 (OPS-R31).
# `plugin-caddy` is cut by every version that cuts the core, because it builds the image
# of the adapter in front of the proxy (ADR-0045, OPS-R86). Added after staging by the
# maintainer's decision of 2026-10-11 (OPS-R31). `plugin-door` builds no image, the guarded
# door's coming from `lemonfiber-door` (ADR-0056, OPS-R93), so no version cuts it and the
# bundle pins its revision. `plugin-prowlarr`,
# `plugin-sabnzbd`, `plugin-qbittorrent`, `plugin-sonarr`, `plugin-radarr`,
# `plugin-lidarr`, `plugin-bazarr`, `plugin-seerr`, `plugin-nzbhydra2`, `plugin-bindery`
# and `plugin-audiobookshelf` are cut by every version that cuts the core too, because
# each builds the image of the adapter in front of its upstream (OPS-R86, OPS-R90).
# Added after staging by the maintainer's decision of 2026-10-25
# (OPS-R31). The other bundled parts' repositories build no image and are pinned by
# revision, so no version cuts them.
# `F14-R2`, `F14-R6`, `F14-R11`, `F14-R13` and `F14-R14` are amended in place by the
# maintainer's decision of 2026-10-29 (OPS-R31): a name an earlier release or its service
# wrote may stay where only a journalled migration or an upgrading stack reads it; an
# install or update refuses an adapter whose recordings leave a case failing or
# unrecorded, or that lists a release they were not taken from, and the core does not
# build while a first-party adapter the bundle pins does either; a substitution journals
# its choice, keeps the replaced part's configuration and data, and its rehearsal reads
# what does not carry over from the contract; and the substitutes proved end to end are
# those of the four capabilities a second plugin fills. Every other capability's
# substitute is `F14-R31`, which 0.19.0 locks.
version = "0.18.0"
milestone = "M14"   # The platform
delivers  = "Plugins — the calls that configure what one installed, and what they may carry where"

