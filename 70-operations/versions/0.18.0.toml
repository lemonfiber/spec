# The companion's N1 rows that are built are locked here, where the companion is searched:
# 65 of them, `N1-R29` to `N1-R31` among them because the capability set they read is
# `ARCH-R78`'s, served in this version. `N1-R2` and `N1-R5` are parity, every action and
# every setting another surface offers, which is claimed when the interfaces stop moving:
# 1.0.0.
# [pins] is written by release-finalize at publish (OPS-R35); left out while planned.
