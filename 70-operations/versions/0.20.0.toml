# Glue — cross-seeding, announce-driven grabbing, quality-profile sync and subtitles.
#
# `ARCH-R28`, `ARCH-R30` and `ARCH-R34` are the platform matrix's rows no earlier version
# holds: a Windows data root outside the WSL2 filesystem detected and explained,
# `/dev/dri` detected and passed through on Linux, and the Docker API reached over a
# named pipe on Windows. Two of the three need a Windows binary, and Windows is not a
# release target: the core's `Cargo.toml` names the four it builds. This version is
# where Windows becomes one, and the three ship with it.
#
# 87 goals, seeded from the roadmap milestone this version serves;
# frozen at stage-version (OPS-R30).
# `ARCH-R153` is browsing the catalogue over the web API, answered from the verified
# index, so the companion lists what can be installed rather than taking a typed name.
#
