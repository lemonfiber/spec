# Canonical label set — the single source, applied to every repo by the
# label-sync reusable workflow (OPS-R12). Never create labels by hand; add them
# here and the sync upserts them everywhere. See project-workflow.md.
- name: bug
  color: d73a4a
  description: Behaviour contradicts the spec
- name: enhancement
  color: a2eeef
  description: New or improved behaviour
- name: documentation
  color: 0075ca
  description: Docs only
- name: question
  color: d876e3
  description: A question, not yet actionable
- name: spec-change
  color: 5319e7
  description: Requires or is a spec change first
- name: needs-spec
  color: fbca04
  description: Accepted, but a spec change must land before implementation
- name: needs-triage
  color: e99695
  description: A new issue awaiting maintainer triage
- name: awaiting-maintainer
  color: d93f0b
  description: Green PR with no review — a maintainer needs to act
- name: dependencies
  color: 0366d6
  description: Dependency update (Dependabot)
# Dependabot adds `major`, `minor` or `patch` to a bump, but only where the repo
# already has that label. Defining `major` alone is what makes a major bump say
# so without labelling every patch.
- name: major
  color: d93f0b
  description: A major version bump — arrives on its own, never grouped
- name: security
  color: b60205
  description: Security-relevant
- name: breaking-change
  color: ee0701
  description: Changes a public contract; needs a major bump
- name: good first issue
  color: 7057ff
  description: Small, well-scoped, newcomer-friendly
- name: help wanted
  color: 008672
  description: Maintainers would welcome a contributor
- name: blocked
  color: "000000"
  description: Waiting on something else
- name: release-blocker
  color: b60205
  description: Must be resolved before a staged version can release
- name: goals-change
  color: ee0701
  description: Alters a staged version's locked goals; needs review
- name: scope:next
  color: fef2c0
  description: Out of the current staged version's scope; routed to the next
- name: wontfix
  color: ffffff
  description: Considered and declined
- name: duplicate
  color: cfd3d7
  description: Already tracked elsewhere
- name: brand
  color: c5def5
  description: Design system
- name: governance
  color: bfd4f2
  description: The rules of change
- name: adapters
  color: 1d76db
  description: The code that talks to the outside world (Docker, HTTP, processes)
- name: core
  color: 0e8a16
  description: The logic that renders nothing — lemonfiber-core
- name: cli
  color: 6f42c1
  description: The command-line surface
- name: manifest
  color: b08800
  description: The stack manifest — schema and validation
- name: stack
  color: 0b6e4f
  description: The media stack the tool operates
- name: ci
  color: 5a6772
  description: Pipelines, workflows, and release engineering
